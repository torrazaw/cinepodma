<!DOCTYPE html>
<html lang="my">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Podmates — CinePodma</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Noto+Sans+Myanmar:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--white:#FFFFFF;--black:#0A0A0A;--slate:#6B7280;--slate-lt:#9CA3AF;--slate-bg:#F3F4F6;--red:#DC2626;--red-h:#B91C1C;--border:#E5E7EB;--radius:16px;--font-en:'Special Elite','Courier New',monospace;--font-my:'Noto Sans Myanmar',sans-serif;}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;}
body{font-family:var(--font-my);background:var(--white);color:var(--black);min-height:100vh;display:flex;flex-direction:column;-webkit-font-smoothing:antialiased;}

/* ── NAV — centered max-width ── */
nav{position:fixed;top:0;left:0;right:0;z-index:100;display:flex;align-items:center;justify-content:center;padding:16px 28px;background:rgba(255,255,255,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--border);}
.nav-inner{width:100%;max-width:900px;display:flex;align-items:center;justify-content:space-between;}
.brand{font-family:var(--font-en);font-size:13px;color:var(--black);text-decoration:none;line-height:1.3;}
.brand span{display:block;color:var(--slate);font-size:11px;letter-spacing:1px;}
.nav-back{display:flex;align-items:center;gap:5px;padding:6px 12px;border-radius:8px;border:1px solid var(--border);background:transparent;font-family:var(--font-my);font-size:12px;color:var(--slate);cursor:pointer;text-decoration:none;transition:all .15s;}
.nav-back:hover{background:var(--slate-bg);color:var(--black);}

main{flex:1;padding:88px 24px 60px;max-width:900px;margin:0 auto;width:100%;}

.page-header{margin-bottom:28px;}
.page-title{font-family:var(--font-en);font-size:28px;letter-spacing:.5px;color:var(--black);margin-bottom:4px;}
.page-divider{width:40px;height:2px;background:var(--red);border-radius:2px;margin-bottom:6px;}
.page-sub{font-size:13px;color:var(--slate);line-height:1.8;}

.search-filter-row{display:flex;flex-direction:column;gap:12px;margin-bottom:24px;}
.search-wrap{position:relative;}
.search-icon{position:absolute;left:14px;top:50%;transform:translateY(-50%);font-size:15px;color:var(--slate-lt);pointer-events:none;}
.search-input{width:100%;padding:11px 16px 11px 42px;border:1.5px solid var(--border);border-radius:99px;font-family:var(--font-my);font-size:14px;color:var(--black);outline:none;transition:border-color .15s;background:var(--white);line-height:1.8;}
.search-input:focus{border-color:var(--black);}

.filter-row{display:flex;gap:6px;flex-wrap:wrap;}
.filter-btn{padding:6px 14px;border-radius:99px;border:1.5px solid var(--border);background:var(--white);font-family:var(--font-my);font-size:12px;color:var(--slate);cursor:pointer;transition:all .15s;line-height:1.8;white-space:nowrap;}
.filter-btn:hover{border-color:var(--black);color:var(--black);}
.filter-btn.active{background:var(--black);border-color:var(--black);color:var(--white);}

.sort-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;flex-wrap:wrap;gap:8px;}
.result-count{font-size:12px;color:var(--slate-lt);font-family:var(--font-en);letter-spacing:.3px;}

/* ── 3-COL GRID ── */
.podmates-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:32px;}

/* ── USER CARD ── */
.pm-card{border:1px solid var(--border);border-radius:var(--radius);padding:18px 12px;text-align:center;cursor:pointer;transition:all .18s;color:var(--black);display:block;background:var(--white);}
.pm-card:hover{border-color:var(--black);transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,0,0,.08);}
.pm-avatar{width:56px;height:56px;border-radius:50%;background:var(--slate-bg);border:2px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:22px;margin:0 auto 10px;overflow:hidden;transition:border-color .15s;}
.pm-card:hover .pm-avatar{border-color:var(--black);}
.pm-avatar img{width:100%;height:100%;object-fit:cover;display:block;}
.pm-name{font-family:var(--font-my);font-size:13px;font-weight:700;color:var(--black);margin-bottom:2px;line-height:1.5;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.pm-username{font-family:var(--font-en);font-size:10px;color:var(--slate-lt);margin-bottom:6px;letter-spacing:.3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.pm-role{display:inline-flex;align-items:center;gap:3px;padding:2px 7px;background:var(--slate-bg);border-radius:99px;font-size:9px;color:var(--slate);margin-bottom:8px;border:1px solid var(--border);}
.pm-clap{font-size:11px;color:var(--slate);display:flex;align-items:center;justify-content:center;gap:3px;}
.pm-clap strong{color:var(--black);font-weight:700;}

/* ── DETAIL POPUP ── */
.dp-ov{position:fixed;inset:0;background:rgba(0,0,0,.5);backdrop-filter:blur(4px);z-index:600;display:none;align-items:flex-end;justify-content:center;}
.dp-ov.on{display:flex;}
.dp-card{background:var(--white);border-radius:20px 20px 0 0;width:100%;max-width:640px;padding:20px 20px 48px;animation:slideUp .3s cubic-bezier(.34,1.2,.64,1);}
@keyframes slideUp{from{transform:translateY(100%);opacity:0}to{transform:translateY(0);opacity:1}}
.dp-handle{width:40px;height:4px;background:var(--border);border-radius:2px;margin:0 auto 18px;}
.dp-row{display:flex;gap:16px;margin-bottom:16px;align-items:flex-start;}
.dp-av{width:72px;height:72px;border-radius:50%;background:var(--slate-bg);border:2px solid var(--border);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:28px;overflow:hidden;}
.dp-av img{width:100%;height:100%;object-fit:cover;}
.dp-info{flex:1;min-width:0;}
.dp-name{font-size:18px;font-weight:700;color:var(--black);line-height:1.5;margin-bottom:2px;}
.dp-username{font-family:var(--font-en);font-size:12px;color:var(--slate-lt);margin-bottom:6px;}
.dp-role-badge{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;background:var(--slate-bg);border-radius:99px;font-size:12px;color:var(--slate);border:1px solid var(--border);margin-bottom:6px;}
.dp-clap-row{font-size:13px;color:var(--slate);}
.dp-clap-row strong{color:var(--black);}
.dp-btn{display:block;width:100%;padding:13px;border-radius:12px;border:none;font-family:var(--font-my);font-size:14px;font-weight:600;cursor:pointer;transition:all .15s;line-height:1.6;text-align:center;text-decoration:none;margin-top:10px;}
.dp-btn.black{background:var(--black);color:#fff;}
.dp-btn.black:hover{background:#222;}

/* EMPTY / LOADING */
.state-msg{text-align:center;padding:60px 24px;color:var(--slate-lt);font-size:14px;line-height:2;grid-column:1/-1;}
.spinner{width:24px;height:24px;border:2px solid var(--border);border-top-color:var(--black);border-radius:50%;animation:spin .7s linear infinite;margin:0 auto 12px;}
@keyframes spin{to{transform:rotate(360deg);}}

.load-more-wrap{text-align:center;margin-top:8px;}
.load-more-btn{padding:11px 32px;border-radius:99px;border:1.5px solid var(--border);background:var(--white);font-family:var(--font-my);font-size:13px;color:var(--black);cursor:pointer;transition:all .15s;line-height:1.8;}
.load-more-btn:hover{background:var(--black);color:var(--white);border-color:var(--black);}

footer{background:var(--slate-bg);border-top:1px solid var(--border);padding:18px 28px;text-align:center;}
.footer-text{font-family:var(--font-en);font-size:11px;color:var(--slate);letter-spacing:.5px;}

@media(max-width:500px){
  main{padding:80px 16px 48px;}
  nav{padding:14px 18px;}
  .podmates-grid{grid-template-columns:repeat(3,1fr);gap:8px;}
  .pm-card{padding:14px 8px;}
  .pm-avatar{width:44px;height:44px;font-size:18px;}
  .pm-name{font-size:11px;}
  .pm-username{font-size:9px;}
}
</style>
</head>
<body>

<!-- NAV -->
<nav>
  <div class="nav-inner">
    <a class="brand" href="/home">cine<br><span>podma</span></a>
    <button class="nav-back" onclick="history.length>1?history.back():location.href='/home'">← ပြန်</button>
  </div>
</nav>

<main>
  <div class="page-header">
    <h1 class="page-title">Podmates</h1>
    <div class="page-divider"></div>
    <p class="page-sub">CinePodma တွင်ရှိသော ရုပ်ရှင်နှင့် စာပေချစ်သူများ</p>
  </div>

  <!-- Search + Filter -->
  <div class="search-filter-row">
    <div class="search-wrap">
      <span class="search-icon">🔍</span>
      <input class="search-input" id="searchInput" type="text"
        placeholder="နာမည် သို့မဟုတ် @username ရှာပါ..."
        oninput="onSearch(this.value)">
    </div>
    <div class="filter-row">
      <button class="filter-btn active" onclick="setFilter('all',this)">အားလုံး</button>
      <button class="filter-btn" onclick="setFilter('Producer',this)">🎬 Producer</button>
      <button class="filter-btn" onclick="setFilter('Director',this)">🎥 Director</button>
      <button class="filter-btn" onclick="setFilter('Writer',this)">✍️ Writer</button>
      <button class="filter-btn" onclick="setFilter('Screenwriter',this)">📝 Screenwriter</button>
      <button class="filter-btn" onclick="setFilter('Filmmaker',this)">🎞️ Filmmaker</button>
      <button class="filter-btn" onclick="setFilter('Cinematographer',this)">📷 Cinematographer</button>
      <button class="filter-btn" onclick="setFilter('Film Crew',this)">🎙️ Film Crew</button>
      <button class="filter-btn" onclick="setFilter('Actor',this)">🎭 Actor</button>
      <button class="filter-btn" onclick="setFilter('Cinephile',this)">🍿 Cinephile</button>
      <button class="filter-btn" onclick="setFilter('Fan',this)">⭐ Fan</button>
    </div>
  </div>

  <!-- Count only — no sort buttons -->
  <div class="sort-row">
    <span class="result-count" id="resultCount"></span>
  </div>

  <!-- Grid -->
  <div class="podmates-grid" id="pmGrid">
    <div class="state-msg"><div class="spinner"></div>ဖွင့်နေသည်...</div>
  </div>

  <div class="load-more-wrap" id="loadMoreWrap" style="display:none;">
    <button class="load-more-btn" onclick="loadMore()">နောက်ထပ် ထပ်ကြည့်မည်</button>
  </div>
</main>

<footer><span class="footer-text">© 2026 CinePodma. All rights reserved.</span></footer>

<!-- DETAIL POPUP -->
<div class="dp-ov" id="dpOv" onclick="if(event.target===this)closeDp()">
  <div class="dp-card">
    <div class="dp-handle"></div>
    <div class="dp-row">
      <div class="dp-av" id="dpAv"></div>
      <div class="dp-info">
        <div class="dp-name" id="dpName"></div>
        <div class="dp-username" id="dpUsername"></div>
        <div class="dp-role-badge" id="dpRole"></div>
        <div class="dp-clap-row" id="dpClap"></div>
      </div>
    </div>
    <a class="dp-btn black" id="dpProfileBtn" href="#">👤 Profile ကြည့်မည်</a>
  </div>
</div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js';
import { getFirestore, collection, query, where, getDocs, getCountFromServer }
  from 'https://www.gstatic.com/firebasejs/12.13.0/firebase-firestore.js';

const firebaseConfig = {
  apiKey:"AIzaSyB_fBWLeXjzTjWLQyZjz0SmRfzIpJTtfYw",
  authDomain:"cinepodma.firebaseapp.com",
  projectId:"cinepodma",
  storageBucket:"cinepodma.firebasestorage.app",
  messagingSenderId:"587916526322",
  appId:"1:587916526322:web:d00775311fb92fa1c8466b"
};

const app = initializeApp(firebaseConfig);
const db  = getFirestore(app);

const PAGE_SIZE  = 21; /* 3-col friendly */
var allUsers     = [];
var filtered     = [];
var displayed    = 0;
var activeFilter = 'all';
var searchQuery  = '';

const roleIcons = {
  Producer:'🎬', Director:'🎥', Writer:'✍️', Screenwriter:'📝',
  Filmmaker:'🎞️', Cinematographer:'📷', 'Film Crew':'🎙️',
  Actor:'🎭', Cinephile:'🍿', Fan:'⭐'
};

/* ── Load ── */
async function loadUsers() {
  try {
    var snap = await getDocs(query(collection(db,'users'), where('onboarded','==',true)));
    allUsers = [];
    snap.forEach(function(d){ allUsers.push({uid:d.id,...d.data()}); });

    /* clapper counts */
    await Promise.all(allUsers.map(async function(u){
      try{
        var cs = await getCountFromServer(collection(db,'clappers',u.uid,'users'));
        u.clapperCount = cs.data().count;
      }catch(e){ u.clapperCount=0; }
    }));



    applyFilter();
  } catch(e) {
    document.getElementById('pmGrid').innerHTML =
      '<div class="state-msg">ဖွင့်မရပါ — နောက်မှ ထပ်ကြိုးစားပါ</div>';
  }
}

/* ── Filter + Sort by Most Clappers only ── */
function applyFilter() {
  filtered = allUsers.filter(function(u){
    var matchRole   = activeFilter==='all' || u.role===activeFilter;
    var matchSearch = !searchQuery ||
      (u.name||'').toLowerCase().includes(searchQuery) ||
      (u.username||'').toLowerCase().includes(searchQuery);
    return matchRole && matchSearch;
  });

  /* always sort by most clappers */
  filtered.sort(function(a,b){ return (b.clapperCount||0)-(a.clapperCount||0); });

  displayed = 0;
  document.getElementById('pmGrid').innerHTML = '';
  renderBatch();
}

/* ── Render ── */
function renderBatch() {
  var batch = filtered.slice(displayed, displayed + PAGE_SIZE);
  displayed += batch.length;

  document.getElementById('resultCount').textContent =
    filtered.length + ' podmate' + (filtered.length !== 1 ? 's' : '');

  if (filtered.length === 0) {
    document.getElementById('pmGrid').innerHTML = '<div class="state-msg">ရှာမတွေ့ပါ</div>';
    document.getElementById('loadMoreWrap').style.display = 'none';
    return;
  }

  batch.forEach(function(u){
    var card = document.createElement('div');
    card.className = 'pm-card';
    card.onclick   = function(){ openDp(u); };

    var count    = u.clapperCount || 0;
    var countStr = count >= 1000 ? (count/1000).toFixed(1)+'K' : count;
    var roleIcon = roleIcons[u.role] || '👤';
    var avHtml   = u.avatar
      ? '<img src="'+u.avatar+'" alt="'+(u.name||'')+'">': '👤';

    card.innerHTML =
      '<div class="pm-avatar">'+avHtml+'</div>'+
      '<div class="pm-name">'+(u.name||'Podmate')+'</div>'+
      '<div class="pm-username">'+(u.username||'')+'</div>'+
      (u.role ? '<div class="pm-role">'+roleIcon+' '+u.role+'</div>' : '')+
      '<div class="pm-clap">👏 <strong>'+countStr+'</strong></div>';

    document.getElementById('pmGrid').appendChild(card);
  });

  document.getElementById('loadMoreWrap').style.display =
    displayed < filtered.length ? '' : 'none';
}

/* ── Detail Popup ── */
window.openDp = function(u) {
  var count    = u.clapperCount || 0;
  var countStr = count >= 1000 ? (count/1000).toFixed(1)+'K' : count;
  var roleIcon = roleIcons[u.role] || '';

  var avEl = document.getElementById('dpAv');
  avEl.innerHTML = u.avatar
    ? '<img src="'+u.avatar+'" alt="">'
    : (u.name||'?').charAt(0);

  document.getElementById('dpName').textContent     = u.name || 'Podmate';
  document.getElementById('dpUsername').textContent = u.username || '';
  document.getElementById('dpRole').textContent     = (roleIcon ? roleIcon+' ' : '') + (u.role || '');
  document.getElementById('dpClap').innerHTML       = '👏 <strong>'+countStr+'</strong> Clappers';
  document.getElementById('dpProfileBtn').href      = '/profile?uid='+u.uid;

  document.getElementById('dpOv').classList.add('on');
  document.body.style.overflow = 'hidden';
};

window.closeDp = function() {
  document.getElementById('dpOv').classList.remove('on');
  document.body.style.overflow = '';
};

/* ── Controls ── */
window.onSearch = function(val){
  searchQuery = val.toLowerCase().trim();
  applyFilter();
};
window.setFilter = function(role, btn){
  activeFilter = role;
  document.querySelectorAll('.filter-btn').forEach(function(b){ b.classList.remove('active'); });
  btn.classList.add('active');
  applyFilter();
};
window.loadMore = function(){ renderBatch(); };

/* ESC */
document.addEventListener('keydown', function(e){
  if(e.key==='Escape') window.closeDp();
});

loadUsers();
</script>
</body>
</html>
