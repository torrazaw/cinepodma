<!DOCTYPE html>
<html lang="my">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Library — CinePodma</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Noto+Sans+Myanmar:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --white:#FFFFFF; --black:#0A0A0A;
  --slate:#6B7280; --slate-lt:#9CA3AF; --slate-bg:#F3F4F6;
  --border:#E5E7EB; --red:#DC2626; --red-h:#B91C1C;
  --radius:16px;
  --font-en:'Special Elite','Courier New',monospace;
  --font-my:'Noto Sans Myanmar',sans-serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;}
body{font-family:var(--font-my);background:var(--white);color:var(--black);min-height:100vh;display:flex;flex-direction:column;-webkit-font-smoothing:antialiased;}

/* NAV */
nav{position:fixed;top:0;left:0;right:0;z-index:100;display:flex;align-items:center;justify-content:space-between;padding:16px 28px;background:rgba(255,255,255,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--border);}
.brand{font-family:var(--font-en);font-size:13px;color:var(--black);text-decoration:none;line-height:1.3;}
.brand span{display:block;color:var(--slate);font-size:11px;letter-spacing:1px;}
.back-btn{display:flex;align-items:center;gap:5px;padding:6px 12px;border-radius:8px;border:1px solid var(--border);background:transparent;font-family:var(--font-my);font-size:12px;color:var(--slate);cursor:pointer;text-decoration:none;transition:all .15s;line-height:1.6;}
.back-btn:hover{background:var(--slate-bg);color:var(--black);}

/* MAIN */
main{flex:1;padding:80px 24px 60px;max-width:960px;margin:0 auto;width:100%;}

/* PAGE HEADER */
.page-hdr{margin-bottom:24px;}
.page-title{font-family:var(--font-en);font-size:28px;letter-spacing:.5px;color:var(--black);margin-bottom:4px;}
.page-div{width:40px;height:2px;background:var(--red);border-radius:2px;margin-bottom:6px;}
.page-sub{font-size:13px;color:var(--slate);line-height:1.8;}

/* SEARCH */
.search-wrap{position:relative;margin-bottom:16px;}
.search-icon{position:absolute;left:14px;top:50%;transform:translateY(-50%);font-size:15px;color:var(--slate-lt);pointer-events:none;}
.search-input{width:100%;padding:11px 16px 11px 42px;border:1.5px solid var(--border);border-radius:99px;font-family:var(--font-my);font-size:14px;color:var(--black);outline:none;transition:border-color .15s;line-height:1.8;}
.search-input:focus{border-color:var(--black);}

/* TABS */
.lib-tabs{display:flex;gap:0;border-bottom:1px solid var(--border);margin-bottom:24px;overflow-x:auto;scrollbar-width:none;}
.lib-tabs::-webkit-scrollbar{display:none;}
.lib-tab{padding:12px 20px;border:none;background:transparent;font-family:var(--font-my);font-size:14px;color:var(--slate);cursor:pointer;border-bottom:2px solid transparent;transition:all .15s;white-space:nowrap;line-height:1.6;}
.lib-tab:hover{color:var(--black);}
.lib-tab.active{color:var(--black);border-bottom-color:var(--red);font-weight:600;}

/* FILTER ROW */
.filter-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:20px;}
.filter-btn{padding:6px 14px;border-radius:99px;border:1.5px solid var(--border);background:var(--white);font-family:var(--font-my);font-size:12px;color:var(--slate);cursor:pointer;transition:all .15s;line-height:1.8;white-space:nowrap;}
.filter-btn:hover,.filter-btn.active{background:var(--black);border-color:var(--black);color:var(--white);}

/* SORT */
.sort-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:8px;}
.result-count{font-family:var(--font-en);font-size:11px;color:var(--slate-lt);letter-spacing:.3px;}
.sort-btns{display:flex;gap:4px;}
.sort-btn{padding:5px 12px;border-radius:6px;border:1px solid var(--border);background:var(--white);font-family:var(--font-en);font-size:11px;color:var(--slate);cursor:pointer;transition:all .12s;letter-spacing:.3px;}
.sort-btn.active{background:var(--black);color:var(--white);border-color:var(--black);}

/* GRID */
.lib-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:16px;margin-bottom:32px;}

/* CARD — vertical poster style */
.lib-card{border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;cursor:pointer;transition:all .18s;background:var(--white);text-decoration:none;color:var(--black);display:block;}
.lib-card:hover{border-color:var(--black);transform:translateY(-3px);box-shadow:0 10px 28px rgba(0,0,0,.1);}

/* Poster — 2:3 ratio */
.lib-poster{width:100%;aspect-ratio:2/3;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;}
.lib-poster-img{width:100%;height:100%;object-fit:cover;display:block;}
.lib-poster-gradient{width:100%;height:100%;display:flex;align-items:center;justify-content:center;padding:16px;}
.lib-poster-letter{font-family:var(--font-my);font-size:32px;font-weight:700;color:rgba(255,255,255,.9);text-align:center;line-height:1.4;word-break:break-word;}
.lib-badge{position:absolute;top:8px;left:8px;padding:3px 8px;border-radius:99px;font-family:var(--font-en);font-size:9px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;}
.badge-mm{background:rgba(220,38,38,.9);color:white;}
.badge-int{background:rgba(10,10,10,.8);color:white;}
.badge-story{background:rgba(59,130,246,.9);color:white;}
.badge-sp{background:rgba(16,185,129,.9);color:white;}
.lib-type-icon{position:absolute;bottom:8px;right:8px;font-size:16px;opacity:.85;}

/* Card body */
.lib-body{padding:10px 12px;}
.lib-title{font-family:var(--font-my);font-size:13px;font-weight:600;color:var(--black);margin-bottom:3px;line-height:1.5;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.lib-author{font-size:11px;color:var(--slate-lt);line-height:1.6;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.lib-meta{font-size:10px;color:var(--slate-lt);margin-top:4px;line-height:1.4;}

/* LOADING / EMPTY */
.state-msg{grid-column:1/-1;text-align:center;padding:60px 24px;color:var(--slate-lt);font-size:14px;line-height:2;}
.spinner{width:24px;height:24px;border:2px solid var(--border);border-top-color:var(--black);border-radius:50%;animation:spin .7s linear infinite;margin:0 auto 12px;}
@keyframes spin{to{transform:rotate(360deg)}}

/* LOAD MORE */
.load-more-wrap{text-align:center;margin-top:8px;}
.load-more-btn{padding:11px 32px;border-radius:99px;border:1.5px solid var(--border);background:var(--white);font-family:var(--font-my);font-size:13px;color:var(--black);cursor:pointer;transition:all .15s;line-height:1.8;}
.load-more-btn:hover{background:var(--black);color:var(--white);border-color:var(--black);}

/* PDF VIEWER */
.pdf-ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.88);backdrop-filter:blur(6px);z-index:700;flex-direction:column;}
.pdf-ov.open{display:flex;}
.pdf-hdr{display:flex;align-items:center;justify-content:space-between;padding:12px 20px;background:var(--white);border-bottom:1px solid var(--border);flex-shrink:0;gap:12px;}
.pdf-title{font-family:var(--font-my);font-size:14px;font-weight:600;color:var(--black);line-height:1.6;flex:1;}
.pdf-close{width:32px;height:32px;border-radius:50%;border:1px solid var(--border);background:var(--white);cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;transition:all .15s;flex-shrink:0;}
.pdf-close:hover{background:var(--black);color:var(--white);border-color:var(--black);}
.pdf-body{flex:1;overflow:hidden;background:#525659;}
.pdf-body iframe{width:100%;height:100%;border:none;display:block;}
.pdf-ph{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:12px;color:#ccc;font-family:var(--font-my);font-size:14px;line-height:2;text-align:center;padding:24px;}

/* STORY READER OVERLAY */
.reader-ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.88);backdrop-filter:blur(6px);z-index:700;flex-direction:column;}
.reader-ov.open{display:flex;}
.reader-hdr{display:flex;align-items:center;justify-content:space-between;padding:12px 20px;background:var(--white);border-bottom:1px solid var(--border);flex-shrink:0;gap:12px;}
.reader-title{font-family:var(--font-my);font-size:14px;font-weight:600;color:var(--black);line-height:1.6;flex:1;}
.reader-close{width:32px;height:32px;border-radius:50%;border:1px solid var(--border);background:var(--white);cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;transition:all .15s;}
.reader-close:hover{background:var(--black);color:var(--white);border-color:var(--black);}
.reader-body{flex:1;overflow-y:auto;background:var(--white);}
.reader-content{max-width:680px;margin:0 auto;padding:48px 32px;font-family:var(--font-my);font-size:16px;line-height:2.2;color:var(--black);}
.reader-content h1{font-size:24px;font-weight:700;text-align:center;margin-bottom:8px;line-height:1.6;}
.reader-content .r-author{text-align:center;color:var(--slate);font-size:13px;margin-bottom:40px;}
.reader-content .r-divider{width:40px;height:1px;background:var(--border);margin:32px auto;}

/* FOOTER */
footer{background:var(--slate-bg);border-top:1px solid var(--border);padding:18px 28px;text-align:center;}
.footer-text{font-family:var(--font-en);font-size:11px;color:var(--slate);letter-spacing:.5px;}

@media(max-width:600px){
  main{padding:72px 12px 48px;}
  nav{padding:14px 18px;}
  .lib-grid{grid-template-columns:repeat(2,1fr);gap:10px;}
  .lib-body{padding:8px 10px;}
}
</style>
</head>
<body>

<nav>
  <a class="brand" href="index.html">cine<br><span>podma</span></a>
  <a class="back-btn" href="index.html">← Home</a>
</nav>

<main>
  <div class="page-hdr">
    <h1 class="page-title">Library</h1>
    <div class="page-div"></div>
    <p class="page-sub" id="libSub">ဇာတ်ညွှန်းနှင့် ဝတ္ထုများ — အားလုံး အခမဲ့ဖတ်ရှုနိုင်</p>
  </div>

  <!-- Search -->
  <div class="search-wrap">
    <span class="search-icon">🔍</span>
    <input class="search-input" id="searchIn" type="text" placeholder="ခေါင်းစဉ်၊ ရေးသားသူ ရှာပါ..." oninput="onSearch(this.value)">
  </div>

  <!-- Tabs -->
  <div class="lib-tabs">
    <button class="lib-tab active" onclick="setLibTab('admin',this)">ပြည်တွင်း / ပြည်ပ</button>
    <button class="lib-tab" onclick="setLibTab('podmates',this)">Podmates</button>
  </div>

  <!-- Admin tab filters -->
  <div id="adminFilters">
    <div class="filter-row">
      <button class="filter-btn active" onclick="setFilter('all',this)">အားလုံး</button>
      <button class="filter-btn" onclick="setFilter('mm',this)">🇲🇲 ပြည်တွင်း</button>
      <button class="filter-btn" onclick="setFilter('int',this)">🌐 ပြည်ပ</button>
    </div>
  </div>

  <!-- Podmates tab filters -->
  <div id="pmFilters" style="display:none;">
    <div class="filter-row">
      <button class="filter-btn active" onclick="setPmFilter('all',this)">အားလုံး</button>
      <button class="filter-btn" onclick="setPmFilter('screenplay',this)">🎬 Screenplay</button>
      <button class="filter-btn" onclick="setPmFilter('story',this)">📖 Story</button>
    </div>
  </div>

  <!-- Sort -->
  <div class="sort-row">
    <span class="result-count" id="resultCount"></span>
    <div class="sort-btns" id="sortBtns">
      <button class="sort-btn active" onclick="setSort('newest',this)">Newest</button>
      <button class="sort-btn" onclick="setSort('title',this)">A–Z</button>
    </div>
  </div>

  <!-- Grid -->
  <div class="lib-grid" id="libGrid">
    <div class="state-msg"><div class="spinner"></div>ဖွင့်နေသည်...</div>
  </div>

  <div class="load-more-wrap" id="loadMoreWrap" style="display:none;">
    <button class="load-more-btn" onclick="loadMore()">နောက်ထပ် ထပ်ကြည့်မည်</button>
  </div>
</main>

<footer>
  <span class="footer-text">© 2026 CinePodma. All rights reserved.</span>
</footer>

<!-- PDF VIEWER -->
<div class="pdf-ov" id="pdfViewer">
  <div class="pdf-hdr">
    <span class="pdf-title" id="pdfTitle">—</span>
    <button class="pdf-close" onclick="closePdf()">✕</button>
  </div>
  <div class="pdf-body" id="pdfBody">
    <div class="pdf-ph"><span style="font-size:48px;">📄</span><span>PDF ဖတ်ရှုနေသည်...</span></div>
  </div>
</div>

<!-- STORY READER -->
<div class="reader-ov" id="storyReader">
  <div class="reader-hdr">
    <span class="reader-title" id="readerTitle">—</span>
    <button class="reader-close" onclick="closeReader()">✕</button>
  </div>
  <div class="reader-body">
    <div class="reader-content" id="readerContent"></div>
  </div>
</div>

<script>
/* ══ ADMIN DATA (static — admin တင်မည်) ══ */
var adminDocs=[
  {id:'admin-1',cat:'mm',type:'screenplay',title:'ချစ်ရသောမြို့တော်',author:'Admin',year:'၂၀၁၈',genre:'Drama',pdfUrl:null},
  {id:'admin-2',cat:'int',type:'screenplay',title:'Parasite',author:'Bong Joon-ho',year:'2019',genre:'Thriller',pdfUrl:null},
  {id:'admin-3',cat:'int',type:'screenplay',title:'Pulp Fiction',author:'Quentin Tarantino',year:'1994',genre:'Crime',pdfUrl:null},
  {id:'admin-4',cat:'mm',type:'screenplay',title:'နမူနာဇာတ်ညွှန်း',author:'Admin',year:'—',genre:'—',pdfUrl:null},
];

/* ══ STATE ══ */
var curLibTab='admin';
var activeFilter='all';
var activePmFilter='all';
var activeSort='newest';
var searchQ='';
var pmDocs=[];
var displayed=0;
var PAGE_SIZE=20;

/* ══ GRADIENT COLORS ══ */
var gradients=[
  ['#1a1a2e','#16213e'],['#2d1b69','#11998e'],['#0f2027','#203a43'],
  ['#1e3c72','#2a5298'],['#360033','#0b8793'],['#1f4037','#99f2c8'],
  ['#141e30','#243b55'],['#42275a','#734b6d'],['#3d0000','#a00000'],
  ['#000428','#004e92']
];
function getGradient(str){
  var h=0;for(var i=0;i<str.length;i++)h=(h*31+str.charCodeAt(i))&0xffffffff;
  var g=gradients[Math.abs(h)%gradients.length];
  return'linear-gradient(135deg,'+g[0]+','+g[1]+')';
}
function getInitial(title){return title?title.charAt(0):' ';}

/* ══ BUILD CARD ══ */
function buildCard(doc){
  var a=document.createElement('a');
  a.className='lib-card';
  if(doc.type==='story'){
    a.href='#';
    a.onclick=function(e){e.preventDefault();openReader(doc);return false;};
  } else {
    a.href='#';
    a.onclick=function(e){e.preventDefault();openPdf(doc.title,doc.pdfUrl);return false;};
  }

  /* poster */
  var poster=document.createElement('div');poster.className='lib-poster';
  if(doc.coverUrl){
    var img=document.createElement('img');img.className='lib-poster-img';img.src=doc.coverUrl;img.alt=doc.title;
    poster.appendChild(img);
  } else {
    var grad=document.createElement('div');grad.className='lib-poster-gradient';
    grad.style.background=getGradient(doc.title||'');
    var letter=document.createElement('div');letter.className='lib-poster-letter';
    letter.textContent=getInitial(doc.title);
    grad.appendChild(letter);poster.appendChild(grad);
  }

  /* badge */
  var badge=document.createElement('div');badge.className='lib-badge';
  if(doc.source==='admin'){
    badge.className+=' '+(doc.cat==='mm'?'badge-mm':'badge-int');
    badge.textContent=doc.cat==='mm'?'မြန်မာ':'INT';
  } else {
    badge.className+=' '+(doc.type==='story'?'badge-story':'badge-sp');
    badge.textContent=doc.type==='story'?'Story':'Screenplay';
  }
  poster.appendChild(badge);

  /* type icon */
  var icon=document.createElement('div');icon.className='lib-type-icon';
  icon.textContent=doc.type==='story'?'📖':'🎬';
  poster.appendChild(icon);

  /* body */
  var body=document.createElement('div');body.className='lib-body';
  var title=document.createElement('div');title.className='lib-title';title.textContent=doc.title||'Untitled';
  var author=document.createElement('div');author.className='lib-author';
  author.textContent=(doc.authorUsername||doc.author||'—');
  var meta=document.createElement('div');meta.className='lib-meta';
  meta.textContent=(doc.year||'')+(doc.genre?' · '+doc.genre:'')+(doc.type?'':' · '+(doc.type||''));
  body.appendChild(title);body.appendChild(author);body.appendChild(meta);

  a.appendChild(poster);a.appendChild(body);
  return a;
}

/* ══ RENDER GRID ══ */
function renderGrid(docs){
  var grid=document.getElementById('libGrid');
  if(docs.length===0){
    grid.innerHTML='<div class="state-msg">ရှာမတွေ့ပါ</div>';
    document.getElementById('loadMoreWrap').style.display='none';
    document.getElementById('resultCount').textContent='0 ခု';
    return;
  }
  var batch=docs.slice(0,PAGE_SIZE);
  displayed=batch.length;
  grid.innerHTML='';
  batch.forEach(function(d){grid.appendChild(buildCard(d));});
  document.getElementById('resultCount').textContent=docs.length+' ခု';
  document.getElementById('loadMoreWrap').style.display=docs.length>PAGE_SIZE?'':'none';
  window._allDocs=docs;
}

function loadMore(){
  var docs=window._allDocs||[];
  var next=docs.slice(displayed,displayed+PAGE_SIZE);
  var grid=document.getElementById('libGrid');
  next.forEach(function(d){grid.appendChild(buildCard(d));});
  displayed+=next.length;
  if(displayed>=docs.length) document.getElementById('loadMoreWrap').style.display='none';
}

/* ══ ADMIN TAB ══ */
function loadAdmin(){
  var docs=adminDocs.map(function(d){return Object.assign({},d,{source:'admin'});});
  /* filter */
  if(activeFilter!=='all') docs=docs.filter(function(d){return d.cat===activeFilter;});
  /* search */
  if(searchQ) docs=docs.filter(function(d){
    return (d.title||'').toLowerCase().includes(searchQ)||(d.author||'').toLowerCase().includes(searchQ);
  });
  /* sort */
  if(activeSort==='title') docs.sort(function(a,b){return(a.title||'').localeCompare(b.title||'');});
  renderGrid(docs);
}

/* ══ PODMATES TAB ══ */
function loadPodmates(){
  var grid=document.getElementById('libGrid');
  if(pmDocs.length===0){
    grid.innerHTML='<div class="state-msg"><div class="spinner"></div>ဖွင့်နေသည်...</div>';
  }
  /* filter */
  var docs=pmDocs.slice();
  if(activePmFilter!=='all') docs=docs.filter(function(d){return d.type===activePmFilter;});
  if(searchQ) docs=docs.filter(function(d){
    return (d.title||'').toLowerCase().includes(searchQ)||(d.authorUsername||'').toLowerCase().includes(searchQ)||(d.authorName||'').toLowerCase().includes(searchQ);
  });
  /* sort */
  if(activeSort==='newest') docs.sort(function(a,b){return new Date(b.updatedAt||0)-new Date(a.updatedAt||0);});
  else docs.sort(function(a,b){return(a.title||'').localeCompare(b.title||'');});
  renderGrid(docs);
}

/* ══ CONTROLS ══ */
function setLibTab(tab,btn){
  curLibTab=tab;
  document.querySelectorAll('.lib-tab').forEach(function(b){b.classList.remove('active');});
  btn.classList.add('active');
  document.getElementById('adminFilters').style.display=tab==='admin'?'':'none';
  document.getElementById('pmFilters').style.display=tab==='podmates'?'':'none';
  if(tab==='admin') loadAdmin();
  else loadPodmates();
}

function setFilter(f,btn){
  activeFilter=f;
  document.querySelectorAll('#adminFilters .filter-btn').forEach(function(b){b.classList.remove('active');});
  btn.classList.add('active');
  loadAdmin();
}

function setPmFilter(f,btn){
  activePmFilter=f;
  document.querySelectorAll('#pmFilters .filter-btn').forEach(function(b){b.classList.remove('active');});
  btn.classList.add('active');
  loadPodmates();
}

function setSort(s,btn){
  activeSort=s;
  document.querySelectorAll('.sort-btn').forEach(function(b){b.classList.remove('active');});
  btn.classList.add('active');
  if(curLibTab==='admin') loadAdmin();
  else loadPodmates();
}

function onSearch(q){
  searchQ=q.toLowerCase().trim();
  if(curLibTab==='admin') loadAdmin();
  else loadPodmates();
}

/* ══ PDF VIEWER ══ */
function openPdf(title,url){
  document.getElementById('pdfTitle').textContent=title;
  var body=document.getElementById('pdfBody');
  if(url){
    body.innerHTML='<iframe src="'+url+'#toolbar=1" title="'+title+'"></iframe>';
  } else {
    body.innerHTML='<div class="pdf-ph"><span style="font-size:48px;">📄</span><span>'+title+'</span><span>PDF ဖိုင်ကို Admin တင်ပြီးမှ ဖတ်ရှုနိုင်မည်</span></div>';
  }
  document.getElementById('pdfViewer').classList.add('open');
  document.body.style.overflow='hidden';
}
function closePdf(){
  document.getElementById('pdfViewer').classList.remove('open');
  document.getElementById('pdfBody').innerHTML='';
  document.body.style.overflow='';
}

/* ══ STORY READER ══ */
function openReader(doc){
  document.getElementById('readerTitle').textContent=doc.title||'—';
  var content=document.getElementById('readerContent');
  content.innerHTML=
    '<h1>'+escHtml(doc.title||'')+'</h1>'+
    '<div class="r-author">'+escHtml(doc.authorUsername||doc.authorName||'')+'</div>'+
    '<div class="r-divider"></div>'+
    (doc.story||'<p style="color:#ccc;font-style:italic;">Story မပါသေးပါ</p>');
  document.getElementById('storyReader').classList.add('open');
  document.body.style.overflow='hidden';
}
function closeReader(){
  document.getElementById('storyReader').classList.remove('open');
  document.body.style.overflow='';
}

function escHtml(s){
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

/* ESC key */
document.addEventListener('keydown',function(e){
  if(e.key!=='Escape')return;
  closePdf();closeReader();
});

const db=getFirestore(app);

/* Load public docs from Podmates */
async function loadPublicDocs(){
  try{
    var q=query(
      collection(db,'docs'),
      where('privacy','==','public'),
      orderBy('updatedAt','desc'),
      limit(100)
    );
    var snap=await getDocs(q);
    var docs=[];
    snap.forEach(function(d){docs.push(Object.assign({id:d.id},d.data(),{source:'podmate'}));});
    pmDocs=docs;
    document.getElementById('libSub').textContent=
      'ဇာတ်ညွှန်းနှင့် ဝတ္ထုများ — Podmates '+docs.length+' ဦး၏ ရေးသားချက်များ';
    /* if currently on podmates tab, refresh */
    if(curLibTab==='podmates') loadPodmates();
  }catch(e){
    console.error('loadPublicDocs',e);
    pmDocs=[];
    if(curLibTab==='podmates') loadPodmates();
  }
}

loadPublicDocs();
