<!DOCTYPE html>
<html lang="my" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact — CinePodma</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Noto+Sans+Myanmar:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* ── TOKENS ── */
:root{
  --font-en:'Special Elite','Courier New',monospace;
  --font-my:'Noto Sans Myanmar',sans-serif;
  --red:#DC2626;
  --red-h:#B91C1C;
}

[data-theme="light"]{
  --bg:#FFFFFF;
  --bg2:#F3F4F6;
  --fg:#0A0A0A;
  --fg2:#6B7280;
  --fg3:#9CA3AF;
  --border:#E5E7EB;
  --nav-bg:rgba(255,255,255,0.92);
  --card-bg:#FFFFFF;
}

[data-theme="dark"]{
  --bg:#0D0D0D;
  --bg2:#1A1A1A;
  --fg:#F0F0F0;
  --fg2:#9CA3AF;
  --fg3:#6B7280;
  --border:#2A2A2A;
  --nav-bg:rgba(13,13,13,0.92);
  --card-bg:#181818;
}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{
  font-family:var(--font-my);
  background:var(--bg);color:var(--fg);
  min-height:100vh;display:flex;flex-direction:column;
  -webkit-font-smoothing:antialiased;
  transition:background .25s,color .25s;
}

/* ── NAV ── */
nav{
  position:fixed;top:0;left:0;right:0;z-index:100;
  display:flex;align-items:center;justify-content:center;
  padding:18px 32px;
  padding-top:calc(18px + env(safe-area-inset-top,0px));
  background:var(--nav-bg);backdrop-filter:blur(8px);
  border-bottom:1px solid var(--border);
  transition:background .25s,border-color .25s;
}
.nav-inner{width:100%;max-width:900px;display:flex;align-items:center;justify-content:space-between;gap:16px;}
.brand{font-family:var(--font-en);font-size:13px;letter-spacing:.5px;color:var(--fg);text-decoration:none;line-height:1.3;white-space:nowrap;flex-shrink:0;}
.brand span{display:block;color:var(--fg2);font-size:11px;letter-spacing:1px;}
.nav-right{display:flex;align-items:center;gap:8px;}
.theme-btn{width:34px;height:34px;border-radius:50%;border:1px solid var(--border);background:var(--bg2);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:15px;transition:all .18s;flex-shrink:0;}
.theme-btn:hover{background:var(--fg);color:var(--bg);}
.back-btn{display:flex;align-items:center;gap:4px;padding:6px 14px;border-radius:8px;border:1px solid var(--border);background:transparent;font-family:var(--font-my);font-size:12px;color:var(--fg2);cursor:pointer;text-decoration:none;transition:all .15s;line-height:1.6;}
.back-btn:hover{background:var(--bg2);color:var(--fg);}

/* ── MAIN ── */
main{flex:1;max-width:640px;margin:0 auto;width:100%;padding:100px 24px 60px;}

.page-title{font-family:var(--font-en);font-size:32px;letter-spacing:.5px;margin-bottom:6px;color:var(--fg);}
.page-div{width:40px;height:3px;background:var(--red);border-radius:2px;margin-bottom:20px;}
.page-sub{font-size:14px;color:var(--fg2);line-height:2.0;margin-bottom:40px;}

/* ── CONTACT CARD ── */
.contact-card{
  background:var(--bg2);border-radius:16px;padding:24px;margin-bottom:16px;
  display:flex;align-items:center;gap:16px;
  text-decoration:none;color:var(--fg);
  transition:all .18s;border:1px solid var(--border);
}
.contact-card:hover{
  border-color:var(--fg);background:var(--card-bg);
  transform:translateY(-2px);
  box-shadow:0 6px 20px rgba(0,0,0,.2);
}
.contact-icon{font-size:28px;flex-shrink:0;}
.contact-label{font-size:12px;color:var(--fg3);font-family:var(--font-en);letter-spacing:.5px;margin-bottom:2px;}
.contact-val{font-size:15px;font-weight:600;line-height:1.6;color:var(--fg);}

/* ── FORM ── */
.form-wrap{margin-top:40px;}
.form-title{font-family:var(--font-en);font-size:16px;letter-spacing:.3px;margin-bottom:20px;color:var(--fg);}
.fg{margin-bottom:16px;}
.fl{display:block;font-size:12px;font-weight:600;margin-bottom:6px;color:var(--fg2);}
.fi{
  width:100%;padding:11px 14px;
  border:1.5px solid var(--border);border-radius:10px;
  font-family:var(--font-my);font-size:14px;
  color:var(--fg);background:var(--bg2);
  outline:none;transition:border-color .15s,background .25s;
  line-height:1.8;
}
.fi:focus{border-color:var(--fg);}
.fi::placeholder{color:var(--fg3);}
textarea.fi{resize:vertical;min-height:120px;}

.btn-r{
  display:inline-flex;align-items:center;gap:6px;
  padding:12px 24px;border-radius:12px;border:none;
  cursor:pointer;font-family:var(--font-my);font-size:14px;font-weight:600;line-height:1.6;
  background:var(--red);color:#fff;
  transition:all .18s;
}
.btn-r:hover{background:var(--red-h);transform:translateY(-2px);box-shadow:0 8px 24px rgba(220,38,38,.3);}
.btn-r:disabled{opacity:.6;transform:none;box-shadow:none;cursor:not-allowed;}

/* ── FOOTER ── */
footer{background:var(--bg2);border-top:1px solid var(--border);padding:20px 32px;text-align:center;transition:background .25s,border-color .25s;}
.footer-text{font-family:var(--font-en);font-size:11px;color:var(--fg2);letter-spacing:.5px;}

/* ── RESPONSIVE ── */
@media(max-width:480px){
  nav{padding:14px 18px;padding-top:calc(14px + env(safe-area-inset-top,0px));}
  .page-title{font-size:26px;}
}
@media(hover:none) and (pointer:coarse){
  .fi{font-size:16px;}
  .btn-r{min-height:48px;}
}
</style>
</head>
<body>

<nav>
  <div class="nav-inner">
    <a class="brand" href="/home">cine<br><span>podma</span></a>
    <div class="nav-right">
      <a class="back-btn" href="/home">← ပြန်</a>
      <button class="theme-btn" id="themeBtn" onclick="toggleTheme()" aria-label="Toggle theme" title="Light / Dark">🌙</button>
    </div>
  </div>
</nav>

<main>
  <h1 class="page-title">Contact</h1>
  <div class="page-div"></div>
  <p class="page-sub">မေးခွန်းများ၊ တိုင်ကြားချက်များ ရှိပါက အောက်ပါ နည်းလမ်းများဖြင့် ဆက်သွယ်နိုင်ပါသည်။</p>

  <a class="contact-card" href="mailto:razaw@cinepodma.com">
    <span class="contact-icon">✉️</span>
    <div>
      <div class="contact-label">Email</div>
      <div class="contact-val">razaw@cinepodma.com</div>
    </div>
  </a>

  <div class="form-wrap">
    <div class="form-title">Message ပို့မည်</div>
    <div class="fg"><label class="fl">အမည်</label><input class="fi" id="fName" type="text" placeholder="သင့်နာမည်"></div>
    <div class="fg"><label class="fl">Email</label><input class="fi" id="fEmail" type="email" placeholder="email@example.com"></div>
    <div class="fg"><label class="fl">Message</label><textarea class="fi" id="fMsg" placeholder="မေးချင်သည်များ ရေးပါ..."></textarea></div>
    <button class="btn-r" id="sendBtn" onclick="sendMsg()">📨 ပို့မည်</button>
  </div>
</main>

<footer><span class="footer-text">© 2026 CinePodma. All rights reserved.</span></footer>

<script>
/* ── THEME ── */
(function(){
  var saved = localStorage.getItem('cp-theme');
  var theme = saved || 'dark';
  document.documentElement.setAttribute('data-theme', theme);
  updateThemeBtn(theme);
})();

function updateThemeBtn(theme){
  var btn = document.getElementById('themeBtn');
  if(btn) btn.textContent = theme === 'dark' ? '☀️' : '🌙';
}

function toggleTheme(){
  var cur = document.documentElement.getAttribute('data-theme') || 'dark';
  var next = cur === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  localStorage.setItem('cp-theme', next);
  updateThemeBtn(next);
}

/* ── SEND MESSAGE ── */
var SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyPh9BZZMOyRGyryHrUmVH800HaADFJVxt5GUYb0E9lP-ZYM1sGogzCivtuuK8f2e1I/exec';

async function sendMsg(){
  var name  = document.getElementById('fName').value.trim();
  var email = document.getElementById('fEmail').value.trim();
  var msg   = document.getElementById('fMsg').value.trim();
  if(!name||!email||!msg){ alert('အကုန်ဖြည့်ပါ'); return; }

  var btn = document.getElementById('sendBtn');
  btn.textContent = '📤 ပို့နေသည်...';
  btn.disabled = true;

  try {
    await fetch(SCRIPT_URL, {
      method: 'POST',
      mode: 'no-cors',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name:name, email:email, message:msg })
    });
    document.getElementById('fName').value = '';
    document.getElementById('fEmail').value = '';
    document.getElementById('fMsg').value = '';
    btn.textContent = '✅ ပို့ပြီးပြီ';
    setTimeout(function(){ btn.textContent='📨 ပို့မည်'; btn.disabled=false; }, 3000);
  } catch(e) {
    btn.textContent = '❌ မရပါ — ထပ်ကြိုးစားပါ';
    btn.disabled = false;
  }
}
</script>
</body>
</html>
