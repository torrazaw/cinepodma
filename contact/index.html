<!DOCTYPE html>
<html lang="my">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact — CinePodma</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Noto+Sans+Myanmar:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--white:#fff;--black:#0A0A0A;--slate:#6B7280;--slate-lt:#9CA3AF;--slate-bg:#F3F4F6;--border:#E5E7EB;--red:#DC2626;--font-en:'Special Elite','Courier New',monospace;--font-my:'Noto Sans Myanmar',sans-serif;}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{font-family:var(--font-my);background:var(--white);color:var(--black);min-height:100vh;display:flex;flex-direction:column;-webkit-font-smoothing:antialiased;}
nav{position:fixed;top:0;left:0;right:0;z-index:100;display:flex;align-items:center;justify-content:space-between;padding:16px 28px;background:rgba(255,255,255,.95);backdrop-filter:blur(8px);border-bottom:1px solid var(--border);}
.brand{font-family:var(--font-en);font-size:13px;color:var(--black);text-decoration:none;line-height:1.3;}
.brand span{display:block;color:var(--slate);font-size:11px;letter-spacing:1px;}
.back-btn{display:flex;align-items:center;gap:4px;padding:6px 12px;border-radius:8px;border:1px solid var(--border);background:transparent;font-family:var(--font-my);font-size:12px;color:var(--slate);cursor:pointer;text-decoration:none;transition:all .15s;line-height:1.6;}
.back-btn:hover{background:var(--slate-bg);color:var(--black);}
main{flex:1;max-width:640px;margin:0 auto;width:100%;padding:100px 24px 60px;}
.page-title{font-family:var(--font-en);font-size:32px;letter-spacing:.5px;margin-bottom:6px;}
.page-div{width:40px;height:3px;background:var(--red);border-radius:2px;margin-bottom:20px;}
.page-sub{font-size:14px;color:var(--slate);line-height:2.0;margin-bottom:40px;}
.contact-card{background:var(--slate-bg);border-radius:16px;padding:24px;margin-bottom:16px;display:flex;align-items:center;gap:16px;text-decoration:none;color:var(--black);transition:all .15s;border:1px solid var(--border);}
.contact-card:hover{border-color:var(--black);background:var(--white);transform:translateY(-2px);box-shadow:0 6px 20px rgba(0,0,0,.07);}
.contact-icon{font-size:28px;flex-shrink:0;}
.contact-label{font-size:12px;color:var(--slate-lt);font-family:var(--font-en);letter-spacing:.5px;margin-bottom:2px;}
.contact-val{font-size:15px;font-weight:600;line-height:1.6;}
.form-wrap{margin-top:40px;}
.form-title{font-family:var(--font-en);font-size:16px;letter-spacing:.3px;margin-bottom:20px;}
.fg{margin-bottom:16px;}
.fl{display:block;font-size:12px;font-weight:600;margin-bottom:6px;color:var(--slate);}
.fi{width:100%;padding:11px 14px;border:1.5px solid var(--border);border-radius:10px;font-family:var(--font-my);font-size:14px;color:var(--black);outline:none;transition:border-color .15s;line-height:1.8;background:var(--white);}
.fi:focus{border-color:var(--black);}
textarea.fi{resize:vertical;min-height:120px;}
.btn-r{display:inline-flex;align-items:center;gap:6px;padding:12px 24px;border-radius:12px;border:none;cursor:pointer;font-family:var(--font-my);font-size:14px;font-weight:600;line-height:1.6;background:var(--red);color:var(--white);transition:all .15s;}
.btn-r:hover{opacity:.9;}
footer{background:var(--slate-bg);border-top:1px solid var(--border);padding:16px 28px;text-align:center;font-family:var(--font-en);font-size:11px;color:var(--slate);letter-spacing:.5px;}
</style>
</head>
<body>
<nav>
  <a class="brand" href="/home">cine<br><span>podma</span></a>
  <a class="back-btn" href="/home">← Home</a>
</nav>
<main>
  <h1 class="page-title">Contact</h1>
  <div class="page-div"></div>
  <p class="page-sub">မေးခွန်းများ၊ တိုင်ကြားချက်များ ရှိပါက အောက်ပါ နည်းလမ်းများဖြင့် ဆက်သွယ်နိုင်ပါသည်။</p>

  <a class="contact-card" href="mailto:razaw@cinepodma.com">
    <span class="contact-icon">✉️</span>
    <div>
      <div class="contact-label">Email</div>
      <div class="contact-val">razaw@cinepodma.com</div>
    </div>
  </a>

  <div class="form-wrap">
    <div class="form-title">Message ပို့မည်</div>
    <div class="fg"><label class="fl">အမည်</label><input class="fi" id="fName" type="text" placeholder="သင့်နာမည်"></div>
    <div class="fg"><label class="fl">Email</label><input class="fi" id="fEmail" type="email" placeholder="email@example.com"></div>
    <div class="fg"><label class="fl">Message</label><textarea class="fi" id="fMsg" placeholder="မေးချင်သည်များ ရေးပါ..."></textarea></div>
    <button class="btn-r" onclick="sendMsg()">📨 ပို့မည်</button>
  </div>
</main>
<footer>© 2026 CinePodma. All rights reserved.</footer>
<script>
var SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyPh9BZZMOyRGyryHrUmVH800HaADFJVxt5GUYb0E9lP-ZYM1sGogzCivtuuK8f2e1I/exec';

async function sendMsg(){
  var name  = document.getElementById('fName').value.trim();
  var email = document.getElementById('fEmail').value.trim();
  var msg   = document.getElementById('fMsg').value.trim();
  if(!name||!email||!msg){ alert('အကုန်ဖြည့်ပါ'); return; }

  var btn = document.querySelector('.btn-r');
  btn.textContent = '📤 ပို့နေသည်...';
  btn.disabled = true;

  try {
    await fetch(SCRIPT_URL, {
      method: 'POST',
      mode: 'no-cors',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name:name, email:email, message:msg })
    });
    /* no-cors မို့ response မဖတ်နိုင်ဘူး — success ယူဆမယ် */
    document.getElementById('fName').value = '';
    document.getElementById('fEmail').value = '';
    document.getElementById('fMsg').value = '';
    btn.textContent = '✅ ပို့ပြီးပြီ';
    setTimeout(function(){ btn.textContent='📨 ပို့မည်'; btn.disabled=false; }, 3000);
  } catch(e) {
    btn.textContent = '❌ မရပါ — ထပ်ကြိုးစားပါ';
    btn.disabled = false;
  }
}
</script>
</body>
</html>
