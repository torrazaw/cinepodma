<!DOCTYPE html>
<html lang="my">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Read — CinePodma</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Noto+Sans+Myanmar:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --white:#FFFFFF; --black:#0A0A0A;
  --slate:#6B7280; --slate-lt:#9CA3AF; --slate-bg:#F3F4F6;
  --border:#E5E7EB; --red:#DC2626;
  --font-en:'Special Elite','Courier New',monospace;
  --font-my:'Noto Sans Myanmar',sans-serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{font-family:var(--font-my);background:var(--white);color:var(--black);min-height:100vh;-webkit-font-smoothing:antialiased;}

/* NAV */
.reader-nav{
  position:fixed;top:0;left:0;right:0;z-index:100;
  background:rgba(255,255,255,.95);backdrop-filter:blur(8px);
  border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;
  padding:12px 24px;gap:12px;
}
.brand{font-family:var(--font-en);font-size:13px;color:var(--black);text-decoration:none;line-height:1.3;flex-shrink:0;}
.brand span{display:block;color:var(--slate);font-size:11px;letter-spacing:1px;}
.reader-nav-title{font-family:var(--font-my);font-size:13px;font-weight:600;color:var(--black);flex:1;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;line-height:1.6;}
.nav-back{display:flex;align-items:center;gap:4px;padding:6px 12px;border-radius:8px;border:1px solid var(--border);background:transparent;font-family:var(--font-my);font-size:12px;color:var(--slate);cursor:pointer;text-decoration:none;transition:all .15s;line-height:1.6;flex-shrink:0;}
.nav-back:hover{background:var(--slate-bg);color:var(--black);}

/* LOADING */
.loading{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;gap:16px;color:var(--slate);font-size:14px;line-height:1.8;}
.spinner{width:28px;height:28px;border:2px solid var(--border);border-top-color:var(--black);border-radius:50%;animation:spin .7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}

/* STORY READER */
.story-reader{max-width:680px;margin:0 auto;padding:88px 32px 80px;}

.story-cover{text-align:center;padding:48px 0 40px;border-bottom:1px solid var(--border);margin-bottom:48px;}
.story-cover-title{font-family:var(--font-my);font-size:28px;font-weight:700;color:var(--black);line-height:1.6;margin-bottom:12px;}
.story-cover-author{font-size:14px;color:var(--slate);line-height:1.8;margin-bottom:8px;}
.story-cover-meta{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;}
.story-badge{padding:3px 10px;border-radius:99px;font-size:11px;border:1px solid var(--border);color:var(--slate);background:var(--slate-bg);}

.story-body{font-family:var(--font-my);font-size:16px;line-height:2.2;color:var(--black);}
.story-body h1{font-size:22px;font-weight:700;margin:32px 0 16px;line-height:1.6;}
.story-body h2{font-size:18px;font-weight:700;margin:24px 0 12px;line-height:1.6;}
.story-body p{margin-bottom:16px;}
.story-body blockquote{border-left:3px solid var(--border);margin:20px 0;padding:8px 16px;color:var(--slate);font-style:italic;}

/* SCREENPLAY READER */
.sp-reader{max-width:794px;margin:0 auto;padding:88px 24px 80px;}
.sp-cover{text-align:center;padding:80px 48px;background:var(--white);border:1px solid var(--border);border-radius:16px;margin-bottom:32px;}
.sp-cover-title{font-family:var(--font-my);font-size:28px;font-weight:700;color:var(--black);line-height:1.8;margin-bottom:16px;}
.sp-cover-hr{width:60px;height:1px;background:var(--black);margin:0 auto 16px;}
.sp-cover-by{font-family:var(--font-en);font-size:12px;color:var(--slate);letter-spacing:1px;margin-bottom:6px;}
.sp-cover-author{font-family:var(--font-my);font-size:15px;font-weight:600;color:var(--black);line-height:1.8;}

.sp-section{background:var(--white);border:1px solid var(--border);border-radius:16px;padding:40px 48px;margin-bottom:24px;}
.sp-section-lbl{font-family:var(--font-en);font-size:10px;letter-spacing:3px;text-transform:uppercase;color:var(--slate-lt);margin-bottom:16px;display:flex;align-items:center;gap:10px;}
.sp-section-lbl::after{content:'';flex:1;height:1px;background:var(--border);}
.sp-section-text{font-family:var(--font-my);font-size:14px;line-height:2.0;color:var(--black);white-space:pre-wrap;}

.sp-script{background:var(--white);border:1px solid var(--border);border-radius:16px;padding:40px 48px;margin-bottom:24px;}
.sp-fade{font-family:var(--font-en);font-size:11px;font-weight:600;letter-spacing:.5px;color:var(--black);padding:4px 0;margin-bottom:8px;}
.sp-fade.right{text-align:right;margin-top:20px;margin-bottom:0;}
.sp-el-scene{font-family:var(--font-my);font-size:13px;font-weight:700;line-height:2.0;padding:4px 10px;background:rgba(0,0,0,.03);border-left:2px solid var(--black);border-radius:0 3px 3px 0;margin:20px 0 4px;}
.sp-el-action{font-family:var(--font-my);font-size:13px;line-height:2.0;padding:2px 0;margin-bottom:4px;}
.sp-el-char{font-family:var(--font-my);font-size:13px;font-weight:700;line-height:2.0;padding-left:34%;margin-top:12px;}
.sp-el-paren{font-family:var(--font-my);font-size:12px;line-height:1.8;color:var(--slate);padding-left:26%;padding-right:26%;}
.sp-el-dial{font-family:var(--font-my);font-size:13px;line-height:2.0;padding-left:20%;padding-right:20%;margin-bottom:4px;}
.sp-el-trans{font-family:var(--font-my);font-size:12px;font-weight:700;line-height:2.0;color:var(--slate);text-align:right;margin-top:12px;}

/* NOT FOUND */
.not-found{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;gap:16px;text-align:center;padding:32px;}
.not-found-icon{font-size:48px;}
.not-found-title{font-family:var(--font-en);font-size:20px;color:var(--black);}
.not-found-sub{font-size:13px;color:var(--slate);line-height:1.8;}
.btn{display:inline-flex;align-items:center;gap:5px;padding:10px 20px;border-radius:10px;border:none;cursor:pointer;font-family:var(--font-my);font-size:13px;font-weight:600;line-height:1.6;transition:all .15s;text-decoration:none;}
.btn-red{background:var(--red);color:var(--white);}
.btn-red:hover{opacity:.9;}

@media(max-width:600px){
  .story-reader{padding:80px 20px 60px;}
  .sp-reader{padding:80px 12px 60px;}
  .sp-section,.sp-script{padding:28px 20px;}
  .sp-cover{padding:48px 24px;}
  .sp-el-char{padding-left:20%;}
  .sp-el-paren{padding-left:15%;padding-right:15%;}
  .sp-el-dial{padding-left:10%;padding-right:10%;}
}
</style>
</head>
<body>

<!-- NAV -->
<nav class="reader-nav">
  <a class="brand" href="index.html">cine<br><span>podma</span></a>
  <div class="reader-nav-title" id="navTitle">ဖွင့်နေသည်...</div>
  <a class="nav-back" href="javascript:history.back()">← ပြန်</a>
</nav>

<!-- CONTENT -->
<div id="content">
  <div class="loading">
    <div class="spinner"></div>
    <span>ဖွင့်နေသည်...</span>
  </div>
</div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js';
import { getFirestore, doc, getDoc } from 'https://www.gstatic.com/firebasejs/12.13.0/firebase-firestore.js';

const firebaseConfig = {
  apiKey:"AIzaSyB_fBWLeXjzTjWLQyZjz0SmRfzIpJTtfYw",
  authDomain:"cinepodma.firebaseapp.com",
  projectId:"cinepodma",
  storageBucket:"cinepodma.firebasestorage.app",
  messagingSenderId:"587916526322",
  appId:"1:587916526322:web:d00775311fb92fa1c8466b"
};

const app = initializeApp(firebaseConfig);
const db  = getFirestore(app);

/* get doc id from URL */
var params = new URLSearchParams(window.location.search);
var docId  = params.get('id');

if (!docId) {
  showNotFound('Doc ID မပါပါ');
} else {
  loadDoc(docId);
}

async function loadDoc(id) {
  try {
    var snap = await getDoc(doc(db, 'docs', id));
    if (!snap.exists()) { showNotFound('Doc မတွေ့ပါ'); return; }
    var data = snap.data();
    if (data.privacy !== 'public') { showNotFound('Private doc ဖြစ်သည် — ဖတ်ခွင့် မရှိပါ'); return; }
    render(data);
  } catch(e) {
    console.error(e);
    showNotFound('ဖတ်မရပါ — ' + e.message);
  }
}

function render(data) {
  document.getElementById('navTitle').textContent = data.title || 'Untitled';
  document.title = (data.title || 'Untitled') + ' — CinePodma';

  if (data.type === 'story') {
    renderStory(data);
  } else {
    renderScreenplay(data);
  }
}

/* ══ STORY ══ */
function renderStory(data) {
  var content = document.getElementById('content');
  var div = document.createElement('div');
  div.className = 'story-reader';

  /* cover */
  var cover = document.createElement('div');
  cover.className = 'story-cover';
  cover.innerHTML =
    '<div class="story-cover-title">' + esc(data.title||'Untitled') + '</div>' +
    '<div class="story-cover-author">' + esc(data.authorName||data.authorUsername||'—') + '</div>' +
    '<div class="story-cover-meta">' +
      '<span class="story-badge">📖 Story</span>' +
      (data.updatedAt ? '<span class="story-badge">' + data.updatedAt.substring(0,10) + '</span>' : '') +
    '</div>';
  div.appendChild(cover);

  /* body */
  var body = document.createElement('div');
  body.className = 'story-body';
  body.innerHTML = data.story || '<p style="color:#ccc;font-style:italic;">Content မပါသေးပါ</p>';
  div.appendChild(body);

  content.innerHTML = '';
  content.appendChild(div);
}

/* ══ SCREENPLAY ══ */
function renderScreenplay(data) {
  var content = document.getElementById('content');
  var div = document.createElement('div');
  div.className = 'sp-reader';

  /* cover */
  var cover = document.createElement('div');
  cover.className = 'sp-cover';
  cover.innerHTML =
    '<div class="sp-cover-title">' + esc(data.title||'Untitled') + '</div>' +
    '<div class="sp-cover-hr"></div>' +
    '<div class="sp-cover-by">Written by</div>' +
    '<div class="sp-cover-author">' + esc(data.author||data.authorName||'—') + '</div>';
  div.appendChild(cover);

  /* logline */
  if (data.logline) {
    div.appendChild(makeSection('Logline', data.logline));
  }
  /* synopsis */
  if (data.synopsis) {
    div.appendChild(makeSection('Synopsis', data.synopsis));
  }
  /* treatment */
  if (data.treatment) {
    div.appendChild(makeSection('Treatment', data.treatment));
  }

  /* screenplay */
  if (data.screenplay && data.screenplay.length > 0) {
    var script = document.createElement('div');
    script.className = 'sp-script';

    var fi = document.createElement('div');
    fi.className = 'sp-fade';
    fi.textContent = 'FADE IN:';
    script.appendChild(fi);

    data.screenplay.forEach(function(el) {
      var elDiv = document.createElement('div');
      elDiv.className = 'sp-el-' + el.type;
      elDiv.textContent = el.text || '';
      script.appendChild(elDiv);
    });

    div.appendChild(script);
  }

  content.innerHTML = '';
  content.appendChild(div);
}

function makeSection(label, text) {
  var sec = document.createElement('div');
  sec.className = 'sp-section';
  var lbl = document.createElement('div');
  lbl.className = 'sp-section-lbl';
  lbl.textContent = label;
  var txt = document.createElement('div');
  txt.className = 'sp-section-text';
  txt.textContent = text;
  sec.appendChild(lbl);
  sec.appendChild(txt);
  return sec;
}

function showNotFound(msg) {
  document.getElementById('content').innerHTML =
    '<div class="not-found">' +
      '<div class="not-found-icon">📄</div>' +
      '<div class="not-found-title">ဖတ်မရပါ</div>' +
      '<div class="not-found-sub">' + esc(msg) + '</div>' +
      '<a class="btn btn-red" href="index.html">Home သို့ပြန်မည်</a>' +
    '</div>';
  document.getElementById('navTitle').textContent = '—';
}

function esc(s) {
  return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
</script>
</body>
</html>
