<!DOCTYPE html>
<html lang="my">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
<title>Read — CinePodma</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Noto+Sans+Myanmar:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFF;--fg:#111;--fg2:#555;--fg3:#999;
  --border:#E5E7EB;--card:#F5F5F5;--red:#DC2626;
  --font-en:'Special Elite','Courier New',monospace;
  --font-my:'Noto Sans Myanmar',sans-serif;
}
body.dark {--bg:#1C1C1E;--fg:#F0EDE8;--fg2:#AAA;--fg3:#666;--border:#333;--card:#2A2A2A;}
body.warm {--bg:#FAF3E0;--fg:#2C1810;--fg2:#7A5C3A;--fg3:#A08060;--border:#E2C88A;--card:#F0E4C0;}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;overflow:hidden;}
body{font-family:var(--font-my);background:var(--bg);color:var(--fg);-webkit-font-smoothing:antialiased;transition:background .2s,color .2s;}

/* NAV */
.nav{position:fixed;top:0;left:0;right:0;z-index:200;height:46px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;gap:8px;background:var(--bg);border-bottom:1px solid var(--border);transition:background .2s,border-color .2s;}
.brand{font-family:var(--font-en);font-size:12px;color:var(--fg);text-decoration:none;line-height:1.3;flex-shrink:0;}
.brand span{display:block;color:var(--fg3);font-size:9px;letter-spacing:1px;}
.nav-title{font-size:13px;font-weight:600;color:var(--fg);flex:1;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 8px;line-height:1.4;}
.back-btn{padding:5px 12px;border-radius:8px;border:1px solid var(--border);background:transparent;font-size:12px;color:var(--fg2);cursor:pointer;text-decoration:none;white-space:nowrap;transition:all .15s;flex-shrink:0;line-height:1.6;}
.back-btn:hover{background:var(--card);}

/* SETTINGS BAR */
.sbar{position:fixed;top:46px;left:0;right:0;z-index:199;height:40px;display:flex;align-items:center;gap:8px;padding:0 14px;background:var(--bg);border-bottom:1px solid var(--border);transition:background .2s,border-color .2s;overflow:hidden;}
.sb-av{width:24px;height:24px;border-radius:50%;background:var(--card);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:11px;overflow:hidden;flex-shrink:0;text-decoration:none;}
.sb-av img{width:100%;height:100%;object-fit:cover;}
.sb-name{font-size:11px;font-weight:600;color:var(--fg);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:72px;line-height:1.4;flex-shrink:0;}
.sb-badge{padding:2px 8px;border-radius:99px;font-size:10px;border:1px solid var(--border);color:var(--fg2);background:var(--card);white-space:nowrap;flex-shrink:0;}
.sb-space{flex:1;}
.sb-sep{width:1px;height:16px;background:var(--border);flex-shrink:0;}
.th-btn{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--border);cursor:pointer;flex-shrink:0;transition:all .12s;padding:0;}
.th-btn.tl{background:#FFF;border-color:#CCC;}
.th-btn.td{background:#1C1C1E;border-color:#555;}
.th-btn.tw{background:#FAF3E0;border-color:#CCC;}
.th-btn.act{border-color:var(--red);transform:scale(1.2);}
.fs-wrap{display:flex;align-items:center;gap:2px;flex-shrink:0;}
.fs-btn{width:22px;height:22px;border-radius:6px;border:1px solid var(--border);background:transparent;font-size:12px;cursor:pointer;color:var(--fg);display:flex;align-items:center;justify-content:center;line-height:1;transition:all .12s;}
.fs-btn:hover{background:var(--card);}
.fs-num{font-family:var(--font-en);font-size:10px;color:var(--fg2);min-width:20px;text-align:center;}

/* READER CONTAINER */
.reader{
  position:fixed;
  top:86px; /* nav(46) + sbar(40) */
  left:0;right:0;bottom:0;
  overflow:hidden;
  background:var(--bg);
  transition:background .2s;
}

/* SLIDE VIEWPORT — clips to reader, no scroll */
.slide-viewport{
  position:absolute;top:0;left:0;right:0;bottom:0;
  overflow:hidden;
}

/* SLIDE TRACK — holds all slides side by side */
.slide-track{
  position:absolute;top:0;left:0;bottom:0;
  display:flex;
  transition:transform .32s cubic-bezier(.4,0,.2,1);
}

/* Each SLIDE — exactly reader width, full height, internally scrollable */
.slide{
  flex-shrink:0;
  position:relative;
  overflow-y:auto;
  overflow-x:hidden;
  -webkit-overflow-scrolling:touch;
}

/* PAGE NUMBER INDICATOR */
.pg-ind{
  position:fixed;
  bottom:10px;left:0;right:0;
  text-align:center;
  font-family:var(--font-en);font-size:10px;
  color:var(--fg3);
  pointer-events:none;
  z-index:150;
  letter-spacing:.5px;
}

/* COVER slide */
.cover-slide-inner{
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  min-height:100%;
  padding:32px 28px;
  text-align:center;
}
.cover-title{font-size:22px;font-weight:700;color:var(--fg);line-height:1.8;margin-bottom:16px;}
.cover-hr{width:40px;height:1px;background:var(--fg);margin:0 auto 16px;}
.cover-by{font-family:var(--font-en);font-size:10px;color:var(--fg3);letter-spacing:1px;margin-bottom:6px;}
.cover-auth{font-size:15px;font-weight:600;color:var(--fg);line-height:1.8;}
.cover-draft{font-size:11px;color:var(--fg3);margin-top:24px;font-family:var(--font-en);letter-spacing:.5px;}

/* SECTION slide (logline / synopsis / treatment) */
.sec-slide-inner{padding:24px 22px 40px;}
.sec-lbl{
  font-family:var(--font-en);font-size:9px;letter-spacing:3px;text-transform:uppercase;
  color:var(--fg3);margin-bottom:14px;
  display:flex;align-items:center;gap:8px;
}
.sec-lbl::after{content:'';flex:1;height:1px;background:var(--border);}
.sec-txt{font-size:15px;line-height:2.1;color:var(--fg);white-space:pre-wrap;word-break:break-word;}

/* SCREENPLAY slide */
.sp-slide-inner{padding:20px 18px 48px;font-family:'Courier New',Courier,monospace;}
.sp-pg-label{
  font-family:'Courier New',Courier,monospace;
  font-size:9px;color:var(--fg3);
  text-align:right;margin-bottom:12px;letter-spacing:.5px;
}

/* Screenplay element types */
.sp-scene {font-size:13px;font-weight:bold;text-transform:uppercase;margin-top:14px;margin-bottom:2px;color:var(--fg);line-height:1.8;word-break:break-word;}
.sp-action{font-size:13px;line-height:1.9;color:var(--fg);margin-bottom:2px;word-break:break-word;}
.sp-char  {font-size:13px;font-weight:bold;text-transform:uppercase;padding-left:32%;margin-top:10px;color:var(--fg);line-height:1.8;word-break:break-word;}
.sp-paren {font-size:12px;padding-left:20%;padding-right:20%;color:var(--fg2);line-height:1.8;word-break:break-word;}
.sp-dial  {font-size:13px;padding-left:14%;padding-right:8%;color:var(--fg);line-height:1.9;margin-bottom:2px;word-break:break-word;}
.sp-trans {font-size:12px;font-weight:bold;text-transform:uppercase;text-align:right;margin-top:10px;color:var(--fg2);line-height:1.8;}

/* CLAP FAB */
.clap-fab{position:fixed;bottom:32px;right:16px;z-index:300;width:46px;height:46px;border-radius:50%;background:var(--red);color:#fff;border:none;cursor:pointer;box-shadow:0 4px 14px rgba(220,38,38,.4);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:0;transition:all .2s;}
.clap-fab.clapped{background:#16A34A;box-shadow:0 4px 14px rgba(22,163,74,.4);}
.clap-icon{font-size:18px;line-height:1;}
.clap-n{font-size:9px;font-family:var(--font-en);line-height:1;margin-top:1px;}

/* LOADING / NOT FOUND */
.loading{position:absolute;top:0;left:0;right:0;bottom:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:var(--fg2);font-size:14px;}
.spinner{width:26px;height:26px;border:2px solid var(--border);border-top-color:var(--red);border-radius:50%;animation:spin .7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.not-found{position:absolute;top:0;left:0;right:0;bottom:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:32px;}
.nf-icon{font-size:44px;}
.nf-title{font-size:17px;font-weight:700;color:var(--fg);}
.nf-sub{font-size:13px;color:var(--fg2);line-height:1.8;}
.btn-h{display:inline-flex;padding:10px 20px;border-radius:10px;background:var(--red);color:#fff;text-decoration:none;font-size:13px;font-weight:600;}

/* TOAST */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(40px);background:rgba(0,0,0,.85);color:#fff;font-family:var(--font-my);font-size:12px;line-height:1.8;padding:8px 16px;border-radius:10px;opacity:0;transition:all .3s;z-index:9999;pointer-events:none;white-space:nowrap;}
.toast.on{transform:translateX(-50%) translateY(0);opacity:1;}

/* tap zones — invisible, left/right 35% of screen */
.tap-prev,.tap-next{position:fixed;top:86px;bottom:0;z-index:100;width:30%;cursor:pointer;}
.tap-prev{left:0;}
.tap-next{right:0;}

@media(max-width:400px){
  .sp-char{padding-left:24%;}
  .sp-paren{padding-left:12%;padding-right:12%;}
  .sp-dial{padding-left:8%;padding-right:4%;}
}
</style>
</head>
<body class="light">

<!-- NAV -->
<nav class="nav" id="topNav">
  <a class="brand" href="/home">cine<br><span>podma</span></a>
  <div class="nav-title" id="navTitle">ဖွင့်နေသည်...</div>
  <a class="back-btn" href="javascript:history.back()">← ပြန်</a>
</nav>

<!-- SETTINGS BAR -->
<div class="sbar" id="sbar">
  <a class="sb-av" id="sbAv" href="/home">👤</a>
  <span class="sb-name" id="sbName">—</span>
  <span class="sb-badge" id="sbGenre">—</span>
  <div class="sb-space"></div>
  <div class="sb-sep"></div>
  <button class="th-btn tl act" id="thL" onclick="setTheme('light')"></button>
  <button class="th-btn td"     id="thD" onclick="setTheme('dark')"></button>
  <button class="th-btn tw"     id="thW" onclick="setTheme('warm')"></button>
  <div class="sb-sep"></div>
  <div class="fs-wrap">
    <button class="fs-btn" onclick="chFS(-1)">−</button>
    <span class="fs-num" id="fsNum">14</span>
    <button class="fs-btn" onclick="chFS(1)">+</button>
  </div>
</div>

<!-- READER -->
<div class="reader" id="reader">
  <div class="loading"><div class="spinner"></div><span>ဖွင့်နေသည်...</span></div>
</div>

<!-- TAP ZONES -->
<div class="tap-prev" id="tapPrev" onclick="prevSlide()"></div>
<div class="tap-next" id="tapNext" onclick="nextSlide()"></div>

<!-- PAGE INDICATOR -->
<div class="pg-ind" id="pgInd"></div>

<!-- CLAP FAB -->
<button class="clap-fab" id="clapFab" onclick="doClap()" style="display:none;">
  <span class="clap-icon">👏</span>
  <span class="clap-n" id="clapN">0</span>
</button>

<div class="toast" id="toast"></div>

<script>
/* ===== THEME / FONT ===== */
var fontSize = 14;

function setTheme(t) {
  document.body.className = t;
  ['L','D','W'].forEach(function(x,i){
    document.getElementById('th'+x).classList.toggle('act', ['light','dark','warm'][i]===t);
  });
  /* update nav/sbar bg */
  var bg = getBg();
  document.getElementById('topNav').style.background = bg;
  document.getElementById('sbar').style.background   = bg;
  try { localStorage.setItem('cp_theme', t); } catch(e) {}
  if (window._onSettingChange) window._onSettingChange();
}

function chFS(d) {
  fontSize = Math.min(20, Math.max(11, fontSize + d));
  document.getElementById('fsNum').textContent = fontSize;
  try { localStorage.setItem('cp_fs', fontSize); } catch(e) {}
  if (window._onSettingChange) window._onSettingChange();
}

function getFg() {
  var t = document.body.className;
  if (t==='dark') return '#F0EDE8';
  if (t==='warm') return '#2C1810';
  return '#111111';
}
function getBg() {
  var t = document.body.className;
  if (t==='dark') return '#1C1C1E';
  if (t==='warm') return '#FAF3E0';
  return '#FFFFFF';
}

/* restore settings */
try {
  var _t = localStorage.getItem('cp_theme') || 'light';
  setTheme(_t);
  var _f = parseInt(localStorage.getItem('cp_fs')) || 14;
  fontSize = _f;
  document.getElementById('fsNum').textContent = _f;
} catch(e) {}

function toast(m) {
  var t = document.getElementById('toast');
  t.textContent = m; t.classList.add('on');
  setTimeout(function(){ t.classList.remove('on'); }, 2500);
}
function esc(s) { return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

/* ===== SLIDE ENGINE ===== */
var slides     = []; /* array of DOM elements (.slide) */
var curSlide   = 0;
var trackEl    = null;

function buildSlideTrack() {
  var reader = document.getElementById('reader');
  var W = reader.clientWidth;

  reader.innerHTML =
    '<div class="slide-viewport" id="svp">'+
      '<div class="slide-track" id="strack"></div>'+
    '</div>';

  trackEl = document.getElementById('strack');
  slides  = [];
  return W;
}

function addSlide(innerHtml) {
  var reader = document.getElementById('reader');
  var W = reader.clientWidth;
  var s = document.createElement('div');
  s.className = 'slide';
  s.style.width  = W + 'px';
  s.style.height = '100%';
  s.innerHTML = innerHtml;
  trackEl.appendChild(s);
  slides.push(s);
  /* update track width */
  trackEl.style.width = (slides.length * W) + 'px';
  return s;
}

function goSlide(n, instant) {
  var reader = document.getElementById('reader');
  var W = reader.clientWidth;
  curSlide = Math.max(0, Math.min(n, slides.length - 1));
  var x = curSlide * W;
  if (trackEl) {
    trackEl.style.transition = instant ? 'none' : 'transform .32s cubic-bezier(.4,0,.2,1)';
    trackEl.style.transform  = 'translateX(' + (-x) + 'px)';
  }
  updateInd();
  try { localStorage.setItem('cprd_sl_' + window._docId, curSlide); } catch(e) {}
}

function prevSlide() { goSlide(curSlide - 1); }
function nextSlide() { goSlide(curSlide + 1); }

function updateInd() {
  var ind = document.getElementById('pgInd');
  if (!ind) return;
  if (slides.length <= 1) { ind.textContent = ''; return; }
  ind.textContent = (curSlide + 1) + ' / ' + slides.length;
}

/* swipe */
function initSwipe() {
  var reader = document.getElementById('reader');
  var sx = 0, sy = 0, dragging = false;
  reader.addEventListener('touchstart', function(e){
    sx = e.touches[0].clientX;
    sy = e.touches[0].clientY;
    dragging = false;
  }, {passive:true});
  reader.addEventListener('touchmove', function(e){
    if (Math.abs(e.touches[0].clientX - sx) > 8) dragging = true;
  }, {passive:true});
  reader.addEventListener('touchend', function(e){
    var dx = e.changedTouches[0].clientX - sx;
    var dy = e.changedTouches[0].clientY - sy;
    if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 40) {
      if (dx < 0) nextSlide(); else prevSlide();
    }
  }, {passive:true});
  document.addEventListener('keydown', function(e){
    if (e.key==='ArrowRight'||e.key==='ArrowDown') nextSlide();
    if (e.key==='ArrowLeft' ||e.key==='ArrowUp')   prevSlide();
  });
}
</script>

<script type="module">
import { initializeApp }  from 'https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js';
import { getFirestore, doc, getDoc, setDoc, deleteDoc, updateDoc }
  from 'https://www.gstatic.com/firebasejs/12.13.0/firebase-firestore.js';
import { getAuth, onAuthStateChanged }
  from 'https://www.gstatic.com/firebasejs/12.13.0/firebase-auth.js';

const app = initializeApp({
  apiKey:"AIzaSyB_fBWLeXjzTjWLQyZjz0SmRfzIpJTtfYw",
  authDomain:"cinepodma.firebaseapp.com", projectId:"cinepodma",
  storageBucket:"cinepodma.firebasestorage.app",
  messagingSenderId:"587916526322",
  appId:"1:587916526322:web:d00775311fb92fa1c8466b"
});
const db   = getFirestore(app);
const auth = getAuth(app);

var docId    = new URLSearchParams(window.location.search).get('id');
window._docId = docId;
var docData  = null, authorData = {}, currentUser = null, isClapped = false;

var genreMap = {
  novel:'ဝတ္ထု', short:'ဝတ္ထုတို', essay:'ဆောင်းပါး', poem:'ကဗျာ',
  feature:'ဇာတ်ညွှန်း', shortfilm:'ဇာတ်ညွှန်းတို', series:'စီးရီး'
};

onAuthStateChanged(auth, function(u){
  currentUser = u;
  if (!docId) { showNF('Doc ID မပါပါ'); return; }
  loadDoc();
});

async function loadDoc() {
  try {
    var s = await getDoc(doc(db,'docs',docId));
    if (!s.exists()) { showNF('Doc မတွေ့ပါ'); return; }
    docData = s.data();
    var own = currentUser && currentUser.uid === docData.uid;
    if (docData.privacy !== 'public' && !own) { showNF('🔒 Private — ဖတ်ခွင့် မရပါ'); return; }
    try { var a = await getDoc(doc(db,'users',docData.uid)); authorData = a.exists() ? a.data() : {}; } catch(e) {}
    if (currentUser) {
      try { var c = await getDoc(doc(db,'docClaps',docId,'users',currentUser.uid)); isClapped = c.exists(); } catch(e) {}
    }
    initUI();
    if (docData.type === 'story') initStory();
    else initScreenplay();
  } catch(e) { showNF('ဖတ်မရပါ — ' + e.message); }
}

/* ===== UI ===== */
function initUI() {
  document.title = (docData.title||'Untitled') + ' — CinePodma';
  document.getElementById('navTitle').textContent = docData.title || 'Untitled';
  var gl = docData.genreLabel || genreMap[docData.genre] || (docData.type==='story'?'ဝတ္ထု':'ဇာတ်ညွှန်း');
  document.getElementById('sbGenre').textContent = gl;
  var av = document.getElementById('sbAv');
  av.href = '/profile?uid=' + (docData.uid||'');
  if (authorData.avatar) av.innerHTML = '<img src="'+esc(authorData.avatar)+'" alt="">';
  document.getElementById('sbName').textContent = authorData.name || docData.authorName || '—';
  var fab = document.getElementById('clapFab');
  fab.style.display = 'flex';
  fab.className = 'clap-fab' + (isClapped ? ' clapped' : '');
  document.getElementById('clapN').textContent = docData.clapCount || 0;
}

/* ===== STORY (epub-style horizontal pages) ===== */
function initStory() {
  var div = document.createElement('div');
  div.innerHTML = docData.story || '<p>Content မရှိပါ</p>';

  var blocks = [];
  function walk(node) {
    if (node.nodeType === 3 && node.textContent.trim()) {
      blocks.push('<p>' + esc(node.textContent.trim()) + '</p>');
    } else if (node.nodeType === 1) {
      var tag = node.tagName.toLowerCase();
      if (['p','h1','h2','h3','blockquote','div'].includes(tag)) {
        blocks.push(node.outerHTML || '<p>' + esc(node.textContent) + '</p>');
      } else { node.childNodes.forEach(walk); }
    }
  }
  div.childNodes.forEach(walk);
  if (!blocks.length) blocks = ['<p>Content မရှိပါ</p>'];

  var allParas = blocks.map(function(h){
    return h.replace(/\s*color\s*:[^;"}]+[;"]?/gi,'').replace(/\s*style\s*=\s*"(\s*)"/gi,'');
  });

  function build() {
    var reader = document.getElementById('reader');
    if (!reader || reader.clientWidth===0 || reader.clientHeight===0) {
      setTimeout(build, 60); return;
    }
    var W = reader.clientWidth;
    var H = reader.clientHeight;
    var PAD = 22;
    var fg  = getFg();
    var bg  = getBg();
    var fs  = fontSize;
    var saved = curSlide;

    reader.style.background = bg;

    var titleHtml = docData.title
      ? '<div style="font-size:'+(fs+4)+'px;font-weight:700;line-height:1.6;margin-bottom:18px;padding-bottom:14px;border-bottom:1px solid rgba(128,128,128,.2);color:'+fg+';">'+esc(docData.title)+'</div>'
      : '';

    var styledParas = allParas.map(function(h){
      return h.replace(/^<(\w+)/,function(m,tag){
        return '<'+tag+' style="font-size:'+fs+'px;line-height:2.1;color:'+fg+';"';
      });
    });

    reader.innerHTML =
      '<div id="epubWrap" style="position:absolute;top:0;left:0;right:0;bottom:0;overflow:hidden;opacity:0;transition:opacity .2s;">'+
        '<div id="epubSlider" style="position:absolute;top:0;left:0;height:100%;display:flex;">'+
          '<div id="epubCol" style="height:'+H+'px;padding:'+PAD+'px '+PAD+'px '+(PAD+20)+'px;font-size:'+fs+'px;line-height:2.1;color:'+fg+';column-width:'+(W-PAD*2)+'px;column-gap:'+(PAD*2)+'px;column-fill:auto;overflow:hidden;word-break:break-word;box-sizing:border-box;">'+
            titleHtml+styledParas.join('')+
          '</div>'+
        '</div>'+
      '</div>'+
      '<div id="pgInd2" style="position:absolute;bottom:8px;left:0;right:0;text-align:center;font-family:monospace;font-size:10px;color:'+fg+';opacity:.35;pointer-events:none;"></div>';

    setTimeout(function(){
      var col    = document.getElementById('epubCol');
      var slider = document.getElementById('epubSlider');
      var wrap   = document.getElementById('epubWrap');
      var ind    = document.getElementById('pgInd2');
      if (!col||!slider||!wrap) return;

      var sw = col.scrollWidth;
      var totalPg = Math.max(1, Math.round(sw/W));
      col.style.width = (totalPg*W) + 'px';
      slider.style.width = (totalPg*W) + 'px';

      var pg = Math.min(saved, totalPg-1);
      slider.style.transition = 'none';
      slider.style.transform  = 'translateX('+(-pg*W)+'px)';
      if (ind) ind.textContent = totalPg>1 ? 'p.'+(pg+1)+' / '+totalPg : '';

      requestAnimationFrame(function(){
        wrap.style.opacity='1';
        setTimeout(function(){
          if(slider) slider.style.transition='transform .32s cubic-bezier(.4,0,.2,1)';
        },220);
      });

      /* swipe for story */
      var sx2=0,sy2=0,mv2=false;
      reader.addEventListener('touchstart',function(e){sx2=e.touches[0].clientX;sy2=e.touches[0].clientY;mv2=false;},{passive:true});
      reader.addEventListener('touchmove', function(e){if(Math.abs(e.touches[0].clientX-sx2)>8)mv2=true;},{passive:true});
      reader.addEventListener('touchend',  function(e){
        var dx=e.changedTouches[0].clientX-sx2;
        var dy=e.changedTouches[0].clientY-sy2;
        if(Math.abs(dx)>Math.abs(dy)&&Math.abs(dx)>40){
          pg=Math.max(0,Math.min(totalPg-1,pg+(dx<0?1:-1)));
          slider.style.transition='transform .32s cubic-bezier(.4,0,.2,1)';
          slider.style.transform='translateX('+(-pg*W)+'px)';
          if(ind) ind.textContent=totalPg>1?'p.'+(pg+1)+' / '+totalPg:'';
          try{localStorage.setItem('cprd_'+docId,pg);}catch(ex){}
        }
      },{passive:true});
      document.addEventListener('keydown',function(e){
        if(e.key==='ArrowRight'||e.key==='ArrowDown'){ pg=Math.min(totalPg-1,pg+1); slider.style.transform='translateX('+(-pg*W)+'px)'; if(ind)ind.textContent=totalPg>1?'p.'+(pg+1)+' / '+totalPg:''; }
        if(e.key==='ArrowLeft'||e.key==='ArrowUp'){    pg=Math.max(0,pg-1);          slider.style.transform='translateX('+(-pg*W)+'px)'; if(ind)ind.textContent=totalPg>1?'p.'+(pg+1)+' / '+totalPg:''; }
      });

      try{localStorage.setItem('cprd_'+docId,pg);}catch(e){}
    }, 150);
  }

  try { curSlide = parseInt(localStorage.getItem('cprd_'+docId))||0; } catch(e){ curSlide=0; }
  document.fonts.ready.then(build);
  window._onSettingChange = build;
}

/* ===== SCREENPLAY SLIDE-BY-SLIDE ===== */
function initScreenplay() {
  /* tap zones visible */
  document.getElementById('tapPrev').style.display = '';
  document.getElementById('tapNext').style.display = '';

  var W = buildSlideTrack();

  /* ── COVER slide ── */
  addSlide(
    '<div class="cover-slide-inner">'+
      '<div class="cover-title">'+esc(docData.title||'')+'</div>'+
      '<div class="cover-hr"></div>'+
      '<div class="cover-by">Written by</div>'+
      '<div class="cover-auth">'+esc(docData.author||docData.authorName||'')+'</div>'+
      (docData.draft?'<div class="cover-draft">'+esc(docData.draft)+'</div>':'')+
    '</div>'
  );

  /* ── LOGLINE slide ── */
  if (docData.logline && docData.logline.trim()) {
    addSlide(
      '<div class="sec-slide-inner">'+
        '<div class="sec-lbl">Logline</div>'+
        '<div class="sec-txt">'+esc(docData.logline)+'</div>'+
      '</div>'
    );
  }

  /* ── SYNOPSIS slide ── */
  if (docData.synopsis && docData.synopsis.trim()) {
    addSlide(
      '<div class="sec-slide-inner">'+
        '<div class="sec-lbl">Synopsis</div>'+
        '<div class="sec-txt">'+esc(docData.synopsis)+'</div>'+
      '</div>'
    );
  }

  /* ── TREATMENT slide ── */
  if (docData.treatment && docData.treatment.trim()) {
    addSlide(
      '<div class="sec-slide-inner">'+
        '<div class="sec-lbl">Treatment</div>'+
        '<div class="sec-txt">'+esc(docData.treatment)+'</div>'+
      '</div>'
    );
  }

  /* ── SCREENPLAY — reflow into A4-proportioned pages ── */
  if (docData.screenplay && docData.screenplay.length) {

    /*
      Reflow strategy:
      - Render all elements into a hidden off-screen measure div
      - Read each element's offsetHeight
      - Group elements into pages where cumulative height ≤ PAGE_H
      - Build one slide per page group
    */

    var PAGE_H = 780; /* px — approx A4 usable at mobile scale */
    var spEls  = docData.screenplay.filter(function(e){ return !!elCls(e.type); });

    /* measure div */
    var mhost = document.createElement('div');
    mhost.style.cssText =
      'position:fixed;top:-9999px;left:0;width:'+(W-36)+'px;'+
      'visibility:hidden;pointer-events:none;font-family:Courier New,Courier,monospace;font-size:13px;';
    document.body.appendChild(mhost);

    var elDivs = spEls.map(function(el){
      var d = document.createElement('div');
      d.className = elCls(el.type);
      d.textContent = el.text || '';
      mhost.appendChild(d);
      return d;
    });

    /* force layout */
    void mhost.offsetHeight;

    var heights = elDivs.map(function(d){ return Math.max(d.offsetHeight, 22); });
    document.body.removeChild(mhost);

    /* group into pages */
    var pageGroups = []; /* each = array of spEls indices */
    var curGroup   = [];
    var usedH      = 0;

    spEls.forEach(function(el, i){
      var h = heights[i];
      if (usedH + h > PAGE_H && curGroup.length > 0) {
        pageGroups.push(curGroup);
        curGroup = [];
        usedH    = 0;
      }
      curGroup.push(i);
      usedH += h;
    });
    if (curGroup.length) pageGroups.push(curGroup);
    if (!pageGroups.length) pageGroups = [[]];

    /* build one slide per page */
    pageGroups.forEach(function(group, pi){
      var html = '<div class="sp-slide-inner">';
      html += '<div class="sp-pg-label">p. '+(pi+1)+' / '+pageGroups.length+'</div>';
      group.forEach(function(i){
        var el = spEls[i];
        var x  = esc(el.text || '');
        var cls= elCls(el.type);
        html += '<div class="'+cls+'">'+x+'</div>';
      });
      html += '</div>';
      addSlide(html);
    });
  }

  /* restore saved slide */
  var saved = 0;
  try { saved = parseInt(localStorage.getItem('cprd_sl_'+docId))||0; } catch(e) {}
  goSlide(Math.min(saved, slides.length-1), true);

  initSwipe();
  updateInd();

  /* font size change → rebuild screenplay slides */
  window._onSettingChange = function() {
    var savedIdx = curSlide;
    /* re-init */
    document.getElementById('reader').innerHTML =
      '<div class="loading"><div class="spinner"></div><span>ပြန်ဆောက်နေသည်...</span></div>';
    setTimeout(function(){
      trackEl = null; slides = []; curSlide = savedIdx;
      initScreenplay();
    }, 50);
  };
}

function elCls(type) {
  var map = {scene:'sp-scene',action:'sp-action',char:'sp-char',paren:'sp-paren',dial:'sp-dial',trans:'sp-trans'};
  return map[type] || 'sp-action';
}

/* ===== CLAP ===== */
window.doClap = async function() {
  if (!currentUser) { toast('👏 Login ဝင်ပြီး Clap လုပ်ပါ'); return; }
  var fab = document.getElementById('clapFab');
  var cEl = document.getElementById('clapN');
  var cr  = doc(db,'docClaps',docId,'users',currentUser.uid);
  var gr  = doc(db,'clapping',currentUser.uid,'users',docId);
  try {
    if (isClapped) {
      await deleteDoc(cr); try{await deleteDoc(gr);}catch(e){}
      var s  = await getDoc(doc(db,'docs',docId));
      var n  = s.exists() ? (s.data().clapCount||0) : 0;
      await updateDoc(doc(db,'docs',docId),{clapCount:Math.max(0,n-1)});
      cEl.textContent=Math.max(0,n-1); isClapped=false; fab.className='clap-fab'; toast('👏 Clap ဖြုတ်ပြီး');
    } else {
      var now=new Date().toISOString();
      await setDoc(cr,{uid:currentUser.uid,clappedAt:now});
      await setDoc(gr,{docId:docId,clappedAt:now});
      var s2 = await getDoc(doc(db,'docs',docId));
      var n2 = s2.exists() ? (s2.data().clapCount||0) : 0;
      await updateDoc(doc(db,'docs',docId),{clapCount:n2+1});
      cEl.textContent=n2+1; isClapped=true; fab.className='clap-fab clapped'; toast('👏 Clap လုပ်ပြီး');
    }
  } catch(e) { toast('❌ '+e.message); }
};
