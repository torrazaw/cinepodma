<!DOCTYPE html>
<html lang="my">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Read — CinePodma</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Noto+Sans+Myanmar:wght@400;600;700&display=swap" rel="stylesheet">
<style>
body{
  --bg:#FFF;--fg:#111;--fg2:#555;--fg3:#999;
  --border:#E5E7EB;--card:#F5F5F5;--red:#DC2626;
  --rfs:17px;--rlh:2.0;
  --font-en:'Special Elite','Courier New',monospace;
  --font-my:'Noto Sans Myanmar',sans-serif;
}
body.dark{--bg:#1C1C1E;--fg:#F0EDE8;--fg2:#AAA;--fg3:#666;--border:#333;--card:#2A2A2A;}
body.warm{--bg:#FAF3E0;--fg:#2C1810;--fg2:#7A5C3A;--fg3:#A08060;--border:#E2C88A;--card:#F0E4C0;}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;overflow:hidden;}
body{font-family:var(--font-my);background:var(--bg);color:var(--fg);-webkit-font-smoothing:antialiased;transition:background .2s,color .2s;}

/* ── NAV BAR ── */
.nav{
  position:fixed;top:0;left:0;right:0;z-index:200;
  height:46px;
  display:flex;align-items:center;justify-content:space-between;
  padding:0 16px;gap:8px;
  background:var(--bg);border-bottom:1px solid var(--border);
  transition:background .2s,border-color .2s;
}
.brand{font-family:var(--font-en);font-size:12px;color:var(--fg);text-decoration:none;line-height:1.3;flex-shrink:0;}
.brand span{display:block;color:var(--fg3);font-size:9px;letter-spacing:1px;}
.nav-title{font-size:13px;font-weight:600;color:var(--fg);flex:1;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 8px;line-height:1.4;}
.back-btn{padding:5px 12px;border-radius:8px;border:1px solid var(--border);background:transparent;font-size:12px;color:var(--fg2);cursor:pointer;text-decoration:none;white-space:nowrap;transition:all .15s;flex-shrink:0;line-height:1.6;}
.back-btn:hover{background:var(--card);}

/* ── SETTINGS BAR ── */
.sbar{
  position:fixed;top:46px;left:0;right:0;z-index:199;
  height:40px;
  display:flex;align-items:center;gap:8px;
  padding:0 14px;
  background:var(--bg);border-bottom:1px solid var(--border);
  transition:background .2s,border-color .2s;
  overflow:hidden;
}
/* author */
.sb-av{width:24px;height:24px;border-radius:50%;background:var(--card);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:11px;overflow:hidden;flex-shrink:0;text-decoration:none;}
.sb-av img{width:100%;height:100%;object-fit:cover;}
.sb-name{font-size:11px;font-weight:600;color:var(--fg);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:72px;line-height:1.4;flex-shrink:0;}
.sb-badge{padding:2px 8px;border-radius:99px;font-size:10px;border:1px solid var(--border);color:var(--fg2);background:var(--card);white-space:nowrap;flex-shrink:0;}
.sb-sep{width:1px;height:16px;background:var(--border);flex-shrink:0;}
.sb-space{flex:1;}
/* theme */
.th-btn{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--border);cursor:pointer;flex-shrink:0;transition:all .12s;padding:0;}
.th-btn.tl{background:#FFF;border-color:#CCC;}
.th-btn.td{background:#1C1C1E;border-color:#555;}
.th-btn.tw{background:#FAF3E0;border-color:#CCC;}
.th-btn.act{border-color:var(--red);transform:scale(1.2);}
/* font */
.fs-wrap{display:flex;align-items:center;gap:2px;flex-shrink:0;}
.fs-btn{width:22px;height:22px;border-radius:6px;border:1px solid var(--border);background:transparent;font-size:12px;cursor:pointer;color:var(--fg);display:flex;align-items:center;justify-content:center;line-height:1;transition:all .12s;}
.fs-btn:hover{background:var(--card);}
.fs-num{font-family:var(--font-en);font-size:10px;color:var(--fg2);min-width:20px;text-align:center;}

/* ── READER (fixed, no scroll) ── */
.reader{
  position:fixed;
  top:86px;   /* nav(46) + sbar(40) */
  left:0;right:0;bottom:0;
  overflow:hidden;
  background:var(--bg);
  transition:background .2s;
}

/* page = exactly fills reader, no scroll */
.rpage{
  position:absolute;top:0;left:0;right:0;bottom:0;
  padding:20px 22px 28px;
  overflow:hidden;          /* NO scroll */
  display:flex;flex-direction:column;
}

/* content inside page */
.rpage-body{
  flex:1;
  font-size:var(--rfs);
  line-height:2.0;
  color:var(--fg);
  overflow:hidden;
}
.rpage-body *{color:inherit !important;}
.rpage-body p{margin-bottom:12px;}
.rpage-body h1{font-size:calc(var(--rfs) + 4px);font-weight:700;margin-bottom:14px;line-height:1.6;}
.rpage-body h2{font-size:calc(var(--rfs) + 2px);font-weight:700;margin-bottom:10px;line-height:1.6;}

/* page title (page 1 only) */
.rpage-title{font-size:calc(var(--rfs) + 5px);font-weight:700;color:var(--fg);line-height:1.6;margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid var(--border);}

/* page number */
.rpage-num{
  flex-shrink:0;
  text-align:center;font-family:var(--font-en);font-size:10px;color:var(--fg3);
  padding-top:8px;letter-spacing:.5px;
}

/* SCREENPLAY (scrollable since it's one long read) */
.sp-reader{
  position:absolute;top:0;left:0;right:0;bottom:0;
  overflow-y:auto;padding:20px 22px 60px;
  -webkit-overflow-scrolling:touch;
}
.sp-cover{text-align:center;padding:40px 16px;border:1px solid var(--border);border-radius:14px;margin-bottom:16px;background:var(--card);}
.sp-cover-title{font-size:calc(var(--rfs) + 4px);font-weight:700;color:var(--fg);line-height:1.8;margin-bottom:12px;}
.sp-hr{width:40px;height:1px;background:var(--fg);margin:0 auto 12px;}
.sp-by{font-family:var(--font-en);font-size:10px;color:var(--fg3);letter-spacing:1px;margin-bottom:4px;}
.sp-auth{font-size:14px;font-weight:600;color:var(--fg);line-height:1.8;}
.sp-sec{border:1px solid var(--border);border-radius:12px;padding:18px;margin-bottom:12px;background:var(--card);}
.sp-lbl{font-family:var(--font-en);font-size:8px;letter-spacing:3px;text-transform:uppercase;color:var(--fg3);margin-bottom:10px;display:flex;align-items:center;gap:8px;}
.sp-lbl::after{content:'';flex:1;height:1px;background:var(--border);}
.sp-txt{font-size:var(--rfs);line-height:var(--rlh);color:var(--fg);white-space:pre-wrap;}
.sp-script{border:1px solid var(--border);border-radius:12px;padding:18px;margin-bottom:12px;background:var(--card);}
.sp-fade{font-family:var(--font-en);font-size:10px;font-weight:600;letter-spacing:.5px;color:var(--fg);padding:2px 0;margin-bottom:6px;}
.sp-fade.r{text-align:right;margin-top:14px;}
.sp-scene{font-weight:700;font-size:var(--rfs);line-height:2;padding:2px 8px;background:rgba(128,128,128,.1);border-left:2px solid var(--fg);margin:14px 0 4px;color:var(--fg);}
.sp-action{font-size:var(--rfs);line-height:var(--rlh);margin-bottom:4px;color:var(--fg);}
.sp-char{font-size:var(--rfs);font-weight:700;line-height:2;padding-left:34%;margin-top:10px;color:var(--fg);}
.sp-paren{font-size:calc(var(--rfs) - 1px);line-height:1.8;color:var(--fg2);padding-left:22%;padding-right:22%;font-style:italic;}
.sp-dial{font-size:var(--rfs);line-height:var(--rlh);padding-left:16%;padding-right:16%;margin-bottom:4px;color:var(--fg);}
.sp-trans{font-size:var(--rfs);font-weight:700;line-height:2;color:var(--fg2);text-align:right;margin-top:10px;}

/* CLAP FAB */
.clap-fab{position:fixed;bottom:24px;right:16px;z-index:300;width:46px;height:46px;border-radius:50%;background:var(--red);color:#fff;border:none;cursor:pointer;box-shadow:0 4px 14px rgba(220,38,38,.4);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:0;transition:all .2s;}
.clap-fab.clapped{background:#16A34A;box-shadow:0 4px 14px rgba(22,163,74,.4);}
.clap-fab-icon{font-size:18px;line-height:1;}
.clap-fab-n{font-size:9px;font-family:var(--font-en);line-height:1;margin-top:1px;}

/* LOADING */
.loading{position:absolute;top:0;left:0;right:0;bottom:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:var(--fg2);font-size:14px;}
.spinner{width:26px;height:26px;border:2px solid var(--border);border-top-color:var(--red);border-radius:50%;animation:spin .7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}

/* NOT FOUND */
.not-found{position:absolute;top:0;left:0;right:0;bottom:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:32px;}
.nf-icon{font-size:44px;}
.nf-title{font-size:17px;font-weight:700;color:var(--fg);}
.nf-sub{font-size:13px;color:var(--fg2);line-height:1.8;}
.btn-h{display:inline-flex;padding:10px 20px;border-radius:10px;background:var(--red);color:#fff;text-decoration:none;font-size:13px;font-weight:600;}

/* TOAST */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(40px);background:rgba(0,0,0,.85);color:#fff;font-family:var(--font-my);font-size:12px;line-height:1.8;padding:8px 16px;border-radius:10px;opacity:0;transition:all .3s;z-index:9999;pointer-events:none;white-space:nowrap;}
.toast.on{transform:translateX(-50%) translateY(0);opacity:1;}

@media(max-width:600px){
  .sp-char{padding-left:20%;}
  .sp-paren{padding-left:8%;padding-right:8%;}
  .sp-dial{padding-left:4%;padding-right:4%;}
}
</style>
</head>
<body class="light">

<!-- NAV -->
<nav class="nav">
  <a class="brand" href="/home">cine<br><span>podma</span></a>
  <div class="nav-title" id="navTitle">ဖွင့်နေသည်...</div>
  <a class="back-btn" href="javascript:history.back()">← ပြန်</a>
</nav>

<!-- SETTINGS BAR -->
<div class="sbar">
  <a class="sb-av" id="sbAv" href="/home">👤</a>
  <span class="sb-name" id="sbName">—</span>
  <span class="sb-badge" id="sbGenre">—</span>
  <div class="sb-space"></div>
  <div class="sb-sep"></div>
  <button class="th-btn tl act" id="thL" onclick="setTheme('light')"></button>
  <button class="th-btn td"     id="thD" onclick="setTheme('dark')"></button>
  <button class="th-btn tw"     id="thW" onclick="setTheme('warm')"></button>
  <div class="sb-sep"></div>
  <div class="fs-wrap">
    <button class="fs-btn" onclick="chFS(-1)">−</button>
    <span class="fs-num" id="fsNum">17</span>
    <button class="fs-btn" onclick="chFS(1)">+</button>
  </div>
</div>

<!-- READER -->
<div class="reader" id="reader">
  <div class="loading"><div class="spinner"></div><span>ဖွင့်နေသည်...</span></div>
</div>

<!-- CLAP FAB -->
<button class="clap-fab" id="clapFab" onclick="doClap()" style="display:none;">
  <span class="clap-fab-icon">👏</span>
  <span class="clap-fab-n" id="clapN">0</span>
</button>

<div class="toast" id="toast"></div>

<script>
var fontSize=17;

function setTheme(t){
  document.body.className=t;
  ['L','D','W'].forEach(function(x,i){
    document.getElementById('th'+x).classList.toggle('act',['light','dark','warm'][i]===t);
  });
  try{localStorage.setItem('cp_theme',t);}catch(e){}
  if(window._rebuildPages) window._rebuildPages();
}

function chFS(d){
  fontSize=Math.min(24,Math.max(12,fontSize+d));
  document.getElementById('fsNum').textContent=fontSize;
  try{localStorage.setItem('cp_fs',fontSize);}catch(e){}
  /* rebuild epub with new font size */
  if(window._rebuildPages){
    setTimeout(window._rebuildPages, 30);
  }
}

/* restore settings */
try{
  var _t=localStorage.getItem('cp_theme')||'light'; setTheme(_t);
  var _f=parseInt(localStorage.getItem('cp_fs'))||17;
  fontSize=_f;
  document.documentElement.style.setProperty('--rfs',_f+'px');
  document.body.style.setProperty('--rfs',_f+'px');
  document.getElementById('fsNum').textContent=_f;
}catch(e){}

function toast(m){var t=document.getElementById('toast');t.textContent=m;t.classList.add('on');setTimeout(function(){t.classList.remove('on');},2500);}
function esc(s){return(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
</script>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js';
import { getFirestore, doc, getDoc, setDoc, deleteDoc, updateDoc }
  from 'https://www.gstatic.com/firebasejs/12.13.0/firebase-firestore.js';
import { getAuth, onAuthStateChanged }
  from 'https://www.gstatic.com/firebasejs/12.13.0/firebase-auth.js';

const app=initializeApp({
  apiKey:"AIzaSyB_fBWLeXjzTjWLQyZjz0SmRfzIpJTtfYw",
  authDomain:"cinepodma.firebaseapp.com",projectId:"cinepodma",
  storageBucket:"cinepodma.firebasestorage.app",
  messagingSenderId:"587916526322",appId:"1:587916526322:web:d00775311fb92fa1c8466b"
});
const db=getFirestore(app);
const auth=getAuth(app);

var docId=new URLSearchParams(window.location.search).get('id');
var docData=null,authorData={},currentUser=null,isClapped=false;
var allParas=[]; /* all paragraph HTML strings */
var pageGroups=[]; /* array of arrays of para indices */
var curPage=0;

var genreMap={novel:'ဝတ္ထု',short:'ဝတ္ထုတို',essay:'ဆောင်းပါး',poem:'ကဗျာ',
  feature:'ဇာတ်ညွှန်း',shortfilm:'ဇာတ်ညွှန်းတို',series:'စီးရီး'};

onAuthStateChanged(auth,function(u){
  currentUser=u;
  if(!docId){showNF('Doc ID မပါပါ');return;}
  loadDoc();
});

async function loadDoc(){
  try{
    var s=await getDoc(doc(db,'docs',docId));
    if(!s.exists()){showNF('Doc မတွေ့ပါ');return;}
    docData=s.data();
    var own=currentUser&&currentUser.uid===docData.uid;
    if(docData.privacy!=='public'&&!own){showNF('🔒 Private — ဖတ်ခွင့် မရပါ');return;}
    try{var a=await getDoc(doc(db,'users',docData.uid));authorData=a.exists()?a.data():{};}catch(e){}
    if(currentUser){try{var c=await getDoc(doc(db,'docClaps',docId,'users',currentUser.uid));isClapped=c.exists();}catch(e){}}
    initUI();
    if(docData.type==='story') initStory();
    else initScreenplay();
  }catch(e){showNF('ဖတ်မရပါ — '+e.message);}
}

function initUI(){
  document.title=(docData.title||'Untitled')+' — CinePodma';
  document.getElementById('navTitle').textContent=docData.title||'Untitled';
  var gl=docData.genreLabel||genreMap[docData.genre]||(docData.type==='story'?'ဝတ္ထု':'ဇာတ်ညွှန်း');
  document.getElementById('sbGenre').textContent=gl;
  var av=document.getElementById('sbAv');
  av.href='/profile?uid='+(docData.uid||'');
  if(authorData.avatar)av.innerHTML='<img src="'+esc(authorData.avatar)+'" alt="">';
  document.getElementById('sbName').textContent=authorData.name||docData.authorName||'—';
  /* clap fab */
  var fab=document.getElementById('clapFab');fab.style.display='flex';
  fab.className='clap-fab'+(isClapped?' clapped':'');
  document.getElementById('clapN').textContent=docData.clapCount||0;
}

/* ── STORY PAGINATION ── */
function initStory(){
  var div=document.createElement('div');
  div.innerHTML=docData.story||'<p>Content မရှိပါ</p>';
  var blocks=[];
  function walk(node){
    if(node.nodeType===3&&node.textContent.trim()){
      blocks.push('<p>'+esc(node.textContent.trim())+'</p>');
    } else if(node.nodeType===1){
      var tag=node.tagName.toLowerCase();
      if(['p','h1','h2','h3','blockquote','div'].includes(tag)){
        blocks.push(node.outerHTML||'<p>'+esc(node.textContent)+'</p>');
      } else { node.childNodes.forEach(walk); }
    }
  }
  div.childNodes.forEach(walk);
  if(!blocks.length) blocks=['<p>Content မရှိပါ</p>'];
  allParas=blocks.map(function(h){
    return h.replace(/\s*color\s*:[^;"}]+[;"]?/gi,'')
             .replace(/\s*style\s*=\s*"(\s*)"/gi,'');
  });
  try{curPage=parseInt(localStorage.getItem('cprd_'+docId))||0;}catch(e){curPage=0;}
  document.fonts.ready.then(function(){ renderEpub(); initSwipe(); });
  window._rebuildPages=function(){ renderEpub(); };
  window._showCurrentPage=function(){ goPage(curPage,true); };
}

function renderEpub(){
  var reader=document.getElementById('reader');
  var W=reader.clientWidth;
  var H=reader.clientHeight;
  var PAD=22;
  var fg=getFg();
  var bg=getBg();
  /* update page background */
  reader.style.background=bg;
  document.getElementById('topbar').style.background=bg;
  document.getElementById('sbar').style.background=bg;
  var titleHtml=docData.title
    ?'<div style="font-size:'+(fontSize+4)+'px;font-weight:700;line-height:1.6;margin-bottom:18px;padding-bottom:14px;border-bottom:1px solid rgba(128,128,128,.2);">'+esc(docData.title)+'</div>'
    :'';

  reader.innerHTML=
    '<div id="epubWrap" style="'+
      'position:absolute;top:0;left:0;right:0;bottom:0;overflow:hidden;">'+
      '<div id="epubSlider" style="'+
        'position:absolute;top:0;left:0;height:100%;'+
        'display:flex;will-change:transform;'+
        'transition:transform .3s cubic-bezier(.4,0,.2,1);">'+
        '<div id="epubCol" style="'+
          'height:'+H+'px;'+
          'padding:'+PAD+'px '+PAD+'px '+(PAD+24)+'px;'+
          'font-size:'+fontSize+'px;'+
          'line-height:2.1;color:'+fg+';'+
          'column-width:'+(W-PAD*2)+'px;'+
          'column-gap:'+(PAD*2)+'px;'+
          'column-fill:auto;'+
          'overflow:hidden;'+
          'word-break:break-word;'+
          'box-sizing:border-box;'+
          '-webkit-column-width:'+(W-PAD*2)+'px;'+
          '-webkit-column-gap:'+(PAD*2)+'px;'+
          '-moz-column-width:'+(W-PAD*2)+'px;'+
        '">'+titleHtml+allParas.join('')+'</div>'+
      '</div>'+
    '</div>'+
    '<div id="pgInd" style="position:absolute;bottom:10px;left:0;right:0;text-align:center;font-family:monospace;font-size:10px;color:'+fg+';opacity:.35;pointer-events:none;"></div>';

  /* measure total pages after layout */
  requestAnimationFrame(function(){
    requestAnimationFrame(function(){
      var col=document.getElementById('epubCol');
      var slider=document.getElementById('epubSlider');
      if(!col||!slider) return;
      /* each column = (W - PAD*2) + column-gap(PAD*2) = W */
      var sw=col.scrollWidth;
      totalPages=Math.max(1,Math.round(sw/W));
      /* set col and slider width so columns lay out correctly */
      col.style.width=(totalPages*W)+'px';
      slider.style.width=(totalPages*W)+'px';
      curPage=Math.min(curPage,totalPages-1);
      goPage(curPage,true);
    });
  });
}

var totalPages=1;

function goPage(n,instant){
  var reader=document.getElementById('reader');
  var W=reader.clientWidth;
  var PAD=22;
  curPage=Math.max(0,Math.min(n,totalPages-1));
  var slider=document.getElementById('epubSlider');
  var ind=document.getElementById('pgInd');
  if(slider){
    /* each page step = column-width(W-PAD*2) + column-gap(PAD*2) = W */
    var x=curPage*W;
    slider.style.transition=instant?'none':'transform .3s cubic-bezier(.4,0,.2,1)';
    slider.style.transform='translateX('+(-x)+'px)';
  }
  if(ind) ind.textContent=totalPages>1?'p.'+(curPage+1)+' / '+totalPages:'';
  try{localStorage.setItem('cprd_'+docId,curPage);}catch(e){}
}

function getFg(){
  var t=document.body.className;
  if(t==='dark') return '#F0EDE8';
  if(t==='warm') return '#2C1810';
  return '#111111';
}
function getBg(){
  var t=document.body.className;
  if(t==='dark') return '#1C1C1E';
  if(t==='warm') return '#FAF3E0';
  return '#FFFFFF';
}

/* ── SWIPE / TAP ── */
function initSwipe(){
  var reader=document.getElementById('reader');
  var sx=0,sy=0,moved=false;
  reader.addEventListener('touchstart',function(e){sx=e.touches[0].clientX;sy=e.touches[0].clientY;moved=false;},{passive:true});
  reader.addEventListener('touchmove',function(e){if(Math.abs(e.touches[0].clientX-sx)>8)moved=true;},{passive:true});
  reader.addEventListener('touchend',function(e){
    var dx=e.changedTouches[0].clientX-sx;
    var dy=e.changedTouches[0].clientY-sy;
    if(Math.abs(dx)>Math.abs(dy)&&Math.abs(dx)>40){
      goPage(dx<0?curPage+1:curPage-1);
    } else if(!moved){
      var x=e.changedTouches[0].clientX,w=window.innerWidth;
      if(x<w*0.35) goPage(curPage-1);
      else if(x>w*0.65) goPage(curPage+1);
    }
  },{passive:true});
  document.addEventListener('keydown',function(e){
    if(e.key==='ArrowRight'||e.key==='ArrowDown') goPage(curPage+1);
    if(e.key==='ArrowLeft'||e.key==='ArrowUp') goPage(curPage-1);
  });
}

/* ── SCREENPLAY ── */
function initScreenplay(){
  var html='<div class="sp-reader">'+
    '<div class="sp-cover"><div class="sp-cover-title">'+esc(docData.title||'')+'</div>'+
    '<div class="sp-hr"></div><div class="sp-by">Written by</div>'+
    '<div class="sp-auth">'+esc(docData.author||docData.authorName||'')+'</div></div>';
  if(docData.logline) html+='<div class="sp-sec"><div class="sp-lbl">Logline</div><div class="sp-txt">'+esc(docData.logline)+'</div></div>';
  if(docData.synopsis) html+='<div class="sp-sec"><div class="sp-lbl">Synopsis</div><div class="sp-txt">'+esc(docData.synopsis)+'</div></div>';
  if(docData.treatment) html+='<div class="sp-sec"><div class="sp-lbl">Treatment</div><div class="sp-txt">'+esc(docData.treatment)+'</div></div>';
  if(docData.screenplay&&docData.screenplay.length){
    html+='<div class="sp-script"><div class="sp-fade">FADE IN:</div>';
    docData.screenplay.forEach(function(el){
      var t=el.type||'action',x=esc(el.text||'');
      if(t==='scene') html+='<div class="sp-scene">'+x+'</div>';
      else if(t==='char') html+='<div class="sp-char">'+x+'</div>';
      else if(t==='paren') html+='<div class="sp-paren">'+x+'</div>';
      else if(t==='dial') html+='<div class="sp-dial">'+x+'</div>';
      else if(t==='trans') html+='<div class="sp-trans">'+x+'</div>';
      else html+='<div class="sp-action">'+x+'</div>';
    });
    html+='<div class="sp-fade r">FADE OUT.</div></div>';
  }
  html+='</div>';
  document.getElementById('reader').innerHTML=html;
}

/* ── CLAP ── */
window.doClap=async function(){
  if(!currentUser){toast('👏 Login ဝင်ပြီး Clap လုပ်ပါ');return;}
  var fab=document.getElementById('clapFab'),cEl=document.getElementById('clapN');
  var cr=doc(db,'docClaps',docId,'users',currentUser.uid);
  var gr=doc(db,'clapping',currentUser.uid,'users',docId);
  try{
    if(isClapped){
      await deleteDoc(cr);try{await deleteDoc(gr);}catch(e){}
      var s=await getDoc(doc(db,'docs',docId));var n=s.exists()?(s.data().clapCount||0):0;
      await updateDoc(doc(db,'docs',docId),{clapCount:Math.max(0,n-1)});
      cEl.textContent=Math.max(0,n-1);isClapped=false;fab.className='clap-fab';toast('👏 Clap ဖြုတ်ပြီး');
    }else{
      var now=new Date().toISOString();
      await setDoc(cr,{uid:currentUser.uid,clappedAt:now});
      await setDoc(gr,{docId:docId,clappedAt:now});
      var s2=await getDoc(doc(db,'docs',docId));var n2=s2.exists()?(s2.data().clapCount||0):0;
      await updateDoc(doc(db,'docs',docId),{clapCount:n2+1});
      cEl.textContent=n2+1;isClapped=true;fab.className='clap-fab clapped';toast('👏 Clap လုပ်ပြီး');
    }
  }catch(e){toast('❌ '+e.message);}
};
