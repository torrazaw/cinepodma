<!DOCTYPE html>
<html lang="my">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Podmates — CinePodma</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Noto+Sans+Myanmar:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --white:    #FFFFFF;
  --black:    #0A0A0A;
  --slate:    #6B7280;
  --slate-lt: #9CA3AF;
  --slate-bg: #F3F4F6;
  --red:      #DC2626;
  --red-h:    #B91C1C;
  --border:   #E5E7EB;
  --radius:   16px;
  --font-en:  'Special Elite', 'Courier New', monospace;
  --font-my:  'Noto Sans Myanmar', sans-serif;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  font-family: var(--font-my);
  background: var(--white);
  color: var(--black);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  -webkit-font-smoothing: antialiased;
}

/* ── NAV ── */
nav {
  position: fixed;
  top: 0; left: 0; right: 0;
  z-index: 100;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 16px 28px;
  background: rgba(255,255,255,0.92);
  backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--border);
}
.brand {
  font-family: var(--font-en);
  font-size: 13px;
  color: var(--black);
  text-decoration: none;
  line-height: 1.3;
}
.brand span { display: block; color: var(--slate); font-size: 11px; letter-spacing: 1px; }
.nav-back {
  display: flex; align-items: center; gap: 5px;
  padding: 6px 12px;
  border-radius: 8px;
  border: 1px solid var(--border);
  background: transparent;
  font-family: var(--font-my);
  font-size: 12px;
  color: var(--slate);
  cursor: pointer;
  text-decoration: none;
  transition: all 0.15s;
}
.nav-back:hover { background: var(--slate-bg); color: var(--black); }

/* ── MAIN ── */
main {
  flex: 1;
  padding: 88px 24px 60px;
  max-width: 900px;
  margin: 0 auto;
  width: 100%;
}

/* ── PAGE HEADER ── */
.page-header {
  margin-bottom: 28px;
}
.page-title {
  font-family: var(--font-en);
  font-size: 28px;
  letter-spacing: 0.5px;
  color: var(--black);
  margin-bottom: 4px;
}
.page-divider {
  width: 40px; height: 2px;
  background: var(--red);
  border-radius: 2px;
  margin-bottom: 6px;
}
.page-sub {
  font-size: 13px;
  color: var(--slate);
  line-height: 1.8;
}

/* ── SEARCH + FILTER ── */
.search-filter-row {
  display: flex;
  flex-direction: column;
  gap: 12px;
  margin-bottom: 24px;
}

.search-wrap {
  position: relative;
}
.search-icon {
  position: absolute;
  left: 14px; top: 50%;
  transform: translateY(-50%);
  font-size: 15px;
  color: var(--slate-lt);
  pointer-events: none;
}
.search-input {
  width: 100%;
  padding: 11px 16px 11px 42px;
  border: 1.5px solid var(--border);
  border-radius: 99px;
  font-family: var(--font-my);
  font-size: 14px;
  color: var(--black);
  outline: none;
  transition: border-color 0.15s;
  background: var(--white);
  line-height: 1.8;
}
.search-input:focus { border-color: var(--black); }

.filter-row {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
}
.filter-btn {
  padding: 6px 14px;
  border-radius: 99px;
  border: 1.5px solid var(--border);
  background: var(--white);
  font-family: var(--font-my);
  font-size: 12px;
  color: var(--slate);
  cursor: pointer;
  transition: all 0.15s;
  line-height: 1.8;
  white-space: nowrap;
}
.filter-btn:hover { border-color: var(--black); color: var(--black); }
.filter-btn.active { background: var(--black); border-color: var(--black); color: var(--white); }

/* ── SORT ROW ── */
.sort-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 20px;
  flex-wrap: wrap;
  gap: 8px;
}
.result-count {
  font-size: 12px;
  color: var(--slate-lt);
  font-family: var(--font-en);
  letter-spacing: 0.3px;
}
.sort-btns { display: flex; gap: 4px; }
.sort-btn {
  padding: 5px 12px;
  border-radius: 6px;
  border: 1px solid var(--border);
  background: var(--white);
  font-family: var(--font-en);
  font-size: 11px;
  color: var(--slate);
  cursor: pointer;
  transition: all 0.12s;
  letter-spacing: 0.3px;
}
.sort-btn:hover { color: var(--black); border-color: var(--black); }
.sort-btn.active { background: var(--black); color: var(--white); border-color: var(--black); }

/* ── GRID ── */
.podmates-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
  gap: 14px;
  margin-bottom: 32px;
}

/* ── USER CARD ── */
.pm-card {
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 20px 16px;
  text-align: center;
  cursor: pointer;
  transition: all 0.18s;
  text-decoration: none;
  color: var(--black);
  display: block;
  background: var(--white);
}
.pm-card:hover {
  border-color: var(--black);
  transform: translateY(-2px);
  box-shadow: 0 8px 24px rgba(0,0,0,0.08);
}

.pm-avatar {
  width: 64px; height: 64px;
  border-radius: 50%;
  background: var(--slate-bg);
  border: 2px solid var(--border);
  display: flex; align-items: center; justify-content: center;
  font-size: 26px;
  margin: 0 auto 12px;
  overflow: hidden;
  transition: border-color 0.15s;
}
.pm-card:hover .pm-avatar { border-color: var(--black); }
.pm-avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }

.pm-name {
  font-family: var(--font-my);
  font-size: 14px;
  font-weight: 700;
  color: var(--black);
  margin-bottom: 2px;
  line-height: 1.5;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.pm-username {
  font-family: var(--font-en);
  font-size: 11px;
  color: var(--slate-lt);
  margin-bottom: 8px;
  letter-spacing: 0.3px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.pm-role {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 2px 8px;
  background: var(--slate-bg);
  border-radius: 99px;
  font-size: 10px;
  color: var(--slate);
  margin-bottom: 10px;
  border: 1px solid var(--border);
}
.pm-clap {
  font-size: 12px;
  color: var(--slate);
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 4px;
}
.pm-clap strong { color: var(--black); font-weight: 700; }

/* ── EMPTY / LOADING ── */
.state-msg {
  text-align: center;
  padding: 60px 24px;
  color: var(--slate-lt);
  font-size: 14px;
  line-height: 2;
  grid-column: 1 / -1;
}
.spinner {
  width: 24px; height: 24px;
  border: 2px solid var(--border);
  border-top-color: var(--black);
  border-radius: 50%;
  animation: spin 0.7s linear infinite;
  margin: 0 auto 12px;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ── LOAD MORE ── */
.load-more-wrap { text-align: center; margin-top: 8px; }
.load-more-btn {
  padding: 11px 32px;
  border-radius: 99px;
  border: 1.5px solid var(--border);
  background: var(--white);
  font-family: var(--font-my);
  font-size: 13px;
  color: var(--black);
  cursor: pointer;
  transition: all 0.15s;
  line-height: 1.8;
}
.load-more-btn:hover { background: var(--black); color: var(--white); border-color: var(--black); }

/* ── FOOTER ── */
footer {
  background: var(--slate-bg);
  border-top: 1px solid var(--border);
  padding: 18px 28px;
  text-align: center;
}
.footer-text {
  font-family: var(--font-en);
  font-size: 11px;
  color: var(--slate);
  letter-spacing: 0.5px;
}

/* ── RESPONSIVE ── */
@media (max-width: 500px) {
  main { padding: 80px 16px 48px; }
  nav { padding: 14px 18px; }
  .podmates-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
  .pm-card { padding: 16px 12px; }
  .pm-avatar { width: 52px; height: 52px; font-size: 20px; }
}
</style>
</head>
<body>

<!-- NAV -->
<nav>
  <a class="brand" href="index.html">cine<br><span>podma</span></a>
  <a class="nav-back" href="index.html">← Home</a>
</nav>

<main>
  <!-- Header -->
  <div class="page-header">
    <h1 class="page-title">Podmates</h1>
    <div class="page-divider"></div>
    <p class="page-sub" id="subCount">CinePodma တွင် ရှိသော screenwriter, filmmaker များ</p>
  </div>

  <!-- Search + Filter -->
  <div class="search-filter-row">
    <div class="search-wrap">
      <span class="search-icon">🔍</span>
      <input class="search-input" id="searchInput" type="text"
        placeholder="နာမည် သို့မဟုတ် @username ရှာပါ..."
        oninput="onSearch(this.value)">
    </div>
    <div class="filter-row">
      <button class="filter-btn active" onclick="setFilter('all', this)">အားလုံး</button>
      <button class="filter-btn" onclick="setFilter('Producer', this)">🎬 Producer</button>
      <button class="filter-btn" onclick="setFilter('Director', this)">🎥 Director</button>
      <button class="filter-btn" onclick="setFilter('Writer', this)">✍️ Writer</button>
      <button class="filter-btn" onclick="setFilter('Filmmaker', this)">🎞️ Filmmaker</button>
      <button class="filter-btn" onclick="setFilter('Cinephile', this)">🍿 Cinephile</button>
    </div>
  </div>

  <!-- Sort -->
  <div class="sort-row">
    <span class="result-count" id="resultCount"></span>
    <div class="sort-btns">
      <button class="sort-btn active" id="sortNewest" onclick="setSort('newest', this)">Newest</button>
      <button class="sort-btn" id="sortClappers" onclick="setSort('clappers', this)">Most Clappers</button>
    </div>
  </div>

  <!-- Grid -->
  <div class="podmates-grid" id="pmGrid">
    <div class="state-msg">
      <div class="spinner"></div>
      ဖွင့်နေသည်...
    </div>
  </div>

  <!-- Load More -->
  <div class="load-more-wrap" id="loadMoreWrap" style="display:none;">
    <button class="load-more-btn" onclick="loadMore()">နောက်ထပ် ထပ်ကြည့်မည်</button>
  </div>
</main>

<footer>
  <span class="footer-text">© 2026 CinePodma. All rights reserved.</span>
</footer>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js';
import { getFirestore, collection, query, where, orderBy,
         limit, startAfter, getDocs, getCountFromServer, doc, getDoc }
  from 'https://www.gstatic.com/firebasejs/12.13.0/firebase-firestore.js';

const firebaseConfig = {
  apiKey:            "AIzaSyB_fBWLeXjzTjWLQyZjz0SmRfzIpJTtfYw",
  authDomain:        "cinepodma.firebaseapp.com",
  projectId:         "cinepodma",
  storageBucket:     "cinepodma.firebasestorage.app",
  messagingSenderId: "587916526322",
  appId:             "1:587916526322:web:d00775311fb92fa1c8466b"
};

const app = initializeApp(firebaseConfig);
const db  = getFirestore(app);

const PAGE_SIZE  = 20;
var allUsers     = [];   /* all loaded from Firestore */
var filtered     = [];   /* after search + filter */
var displayed    = 0;
var activeFilter = 'all';
var activeSort   = 'newest';
var searchQuery  = '';

/* ══ LOAD ALL USERS ══ */
async function loadUsers() {
  try {
    var q    = query(collection(db, 'users'), where('onboarded', '==', true));
    var snap = await getDocs(q);
    allUsers = [];
    snap.forEach(function(d) { allUsers.push({ uid: d.id, ...d.data() }); });

    /* load clapper counts */
    await loadClapperCounts();

    document.getElementById('subCount').textContent =
      'CinePodma တွင် Podmate ' + allUsers.length + ' ယောက် ရှိသည်';

    applyFilterSort();
  } catch(e) {
    document.getElementById('pmGrid').innerHTML =
      '<div class="state-msg">ဖွင့်မရပါ — နောက်မှ ထပ်ကြိုးစားပါ</div>';
  }
}

async function loadClapperCounts() {
  await Promise.all(allUsers.map(async function(u) {
    try {
      var coll = collection(db, 'clappers', u.uid, 'users');
      var snap = await getCountFromServer(coll);
      u.clapperCount = snap.data().count;
    } catch(e) {
      u.clapperCount = 0;
    }
  }));
}

/* ══ FILTER + SORT ══ */
function applyFilterSort() {
  /* filter */
  filtered = allUsers.filter(function(u) {
    var matchRole   = activeFilter === 'all' || u.role === activeFilter;
    var matchSearch = !searchQuery ||
      (u.name     || '').toLowerCase().includes(searchQuery) ||
      (u.username || '').toLowerCase().includes(searchQuery);
    return matchRole && matchSearch;
  });

  /* sort */
  if (activeSort === 'newest') {
    filtered.sort(function(a, b) {
      return new Date(b.createdAt || 0) - new Date(a.createdAt || 0);
    });
  } else {
    filtered.sort(function(a, b) { return (b.clapperCount || 0) - (a.clapperCount || 0); });
  }

  displayed = 0;
  document.getElementById('pmGrid').innerHTML = '';
  renderBatch();
}

/* ══ RENDER ══ */
function renderBatch() {
  var batch = filtered.slice(displayed, displayed + PAGE_SIZE);
  displayed += batch.length;

  document.getElementById('resultCount').textContent =
    filtered.length + ' podmate' + (filtered.length !== 1 ? 's' : '');

  if (filtered.length === 0) {
    document.getElementById('pmGrid').innerHTML =
      '<div class="state-msg">ရှာမတွေ့ပါ</div>';
    document.getElementById('loadMoreWrap').style.display = 'none';
    return;
  }

  var roleIcons = {
    Producer: '🎬', Director: '🎥', Writer: '✍️',
    Filmmaker: '🎞️', Cinephile: '🍿'
  };

  batch.forEach(function(u) {
    var card = document.createElement('a');
    card.className = 'pm-card';
    card.href      = 'profile.html?uid=' + u.uid;

    var count = u.clapperCount || 0;
    var countStr = count >= 1000 ? (count / 1000).toFixed(1) + 'K' : count;
    var roleIcon = roleIcons[u.role] || '👤';
    var avatarHtml = u.avatar
      ? '<img src="' + u.avatar + '" alt="' + (u.name || '') + '">'
      : '👤';

    card.innerHTML =
      '<div class="pm-avatar">' + avatarHtml + '</div>' +
      '<div class="pm-name">' + (u.name || 'Podmate') + '</div>' +
      '<div class="pm-username">' + (u.username || '') + '</div>' +
      (u.role ?
        '<div class="pm-role">' + roleIcon + ' ' + u.role + '</div>' : '') +
      '<div class="pm-clap">👏 <strong>' + countStr + '</strong> Clappers</div>';

    document.getElementById('pmGrid').appendChild(card);
  });

  document.getElementById('loadMoreWrap').style.display =
    displayed < filtered.length ? '' : 'none';
}

/* ══ CONTROLS ══ */
window.onSearch = function(val) {
  searchQuery = val.toLowerCase().trim();
  applyFilterSort();
};

window.setFilter = function(role, btn) {
  activeFilter = role;
  document.querySelectorAll('.filter-btn').forEach(function(b) { b.classList.remove('active'); });
  btn.classList.add('active');
  applyFilterSort();
};

window.setSort = function(sort, btn) {
  activeSort = sort;
  document.querySelectorAll('.sort-btn').forEach(function(b) { b.classList.remove('active'); });
  btn.classList.add('active');
  applyFilterSort();
};

window.loadMore = function() { renderBatch(); };

/* ══ START ══ */
loadUsers();
</script>
</body>
</html>
