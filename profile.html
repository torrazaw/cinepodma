<!DOCTYPE html>
<html lang="my">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profile — CinePodma</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Noto+Sans+Myanmar:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --white:    #FFFFFF;
  --black:    #0A0A0A;
  --slate:    #6B7280;
  --slate-lt: #9CA3AF;
  --slate-bg: #F3F4F6;
  --red:      #DC2626;
  --red-h:    #B91C1C;
  --border:   #E5E7EB;
  --radius:   20px;
  --font-en:  'Special Elite', 'Courier New', monospace;
  --font-my:  'Noto Sans Myanmar', sans-serif;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  font-family: var(--font-my);
  background: var(--white);
  color: var(--black);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  -webkit-font-smoothing: antialiased;
}

/* ── NAV ── */
nav {
  position: fixed;
  top: 0; left: 0; right: 0;
  z-index: 100;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 18px 32px;
  background: rgba(255,255,255,0.92);
  backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--border);
}
.brand {
  font-family: var(--font-en);
  font-size: 13px;
  color: var(--black);
  text-decoration: none;
  line-height: 1.3;
}
.brand span { display: block; color: var(--slate); font-size: 11px; letter-spacing: 1px; }

.nav-right { display: flex; align-items: center; gap: 10px; }
.btn {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 8px 18px;
  border-radius: var(--radius);
  border: none; cursor: pointer;
  font-family: var(--font-my);
  font-size: 13px; font-weight: 600;
  line-height: 1.6;
  text-decoration: none;
  transition: all 0.18s;
  white-space: nowrap;
}
.btn-outline {
  background: transparent;
  color: var(--black);
  border: 1.5px solid var(--black);
}
.btn-outline:hover { background: var(--black); color: var(--white); }
.btn-red { background: var(--red); color: var(--white); }
.btn-red:hover { background: var(--red-h); transform: translateY(-1px); }
.btn-ghost {
  background: transparent; color: var(--slate);
  border: 1px solid var(--border);
}
.btn-ghost:hover { background: var(--slate-bg); color: var(--black); }
.btn-sm { padding: 6px 14px; font-size: 12px; }

/* ── MAIN ── */
main {
  flex: 1;
  padding-top: 73px;
  max-width: 860px;
  margin: 0 auto;
  width: 100%;
  padding-left: 24px;
  padding-right: 24px;
  padding-bottom: 80px;
}

/* ── PROFILE HEADER ── */
.profile-header {
  display: flex;
  align-items: flex-start;
  gap: 28px;
  padding: 40px 0 32px;
  border-bottom: 1px solid var(--border);
  flex-wrap: wrap;
}

/* Avatar */
.avatar-wrap { position: relative; flex-shrink: 0; }
.avatar {
  width: 96px; height: 96px;
  border-radius: 50%;
  background: var(--slate-bg);
  border: 2px solid var(--border);
  object-fit: cover;
  display: flex; align-items: center; justify-content: center;
  font-size: 40px;
  overflow: hidden;
  cursor: pointer;
  transition: border-color 0.18s;
}
.avatar:hover { border-color: var(--black); }
.avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
.avatar-edit-hint {
  position: absolute;
  bottom: 2px; right: 2px;
  width: 26px; height: 26px;
  background: var(--black);
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 12px;
  cursor: pointer;
  border: 2px solid var(--white);
}
#avatarInput { display: none; }

/* Profile info */
.profile-info { flex: 1; min-width: 200px; }

.profile-name-row {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
  margin-bottom: 4px;
}
.profile-name {
  font-family: var(--font-my);
  font-size: 22px;
  font-weight: 700;
  color: var(--black);
  line-height: 1.5;
}
.profile-username {
  font-family: var(--font-en);
  font-size: 13px;
  color: var(--slate);
  letter-spacing: 0.3px;
}
.profile-bio {
  font-size: 14px;
  line-height: 2.0;
  color: var(--slate);
  margin-top: 8px;
  max-width: 480px;
}
.profile-bio:empty::before {
  content: 'Bio မရှိသေးပါ — Edit နှိပ်ပြီး ထည့်နိုင်သည်';
  color: var(--slate-lt);
  font-style: italic;
}

.profile-stats {
  display: flex;
  gap: 24px;
  margin-top: 16px;
  flex-wrap: wrap;
}
.stat-item { text-align: center; }
.stat-num {
  font-family: var(--font-en);
  font-size: 20px;
  font-weight: 700;
  color: var(--black);
  display: block;
}
.stat-label {
  font-size: 11px;
  color: var(--slate-lt);
  line-height: 1.6;
}

.profile-actions {
  display: flex;
  gap: 8px;
  margin-top: 20px;
  flex-wrap: wrap;
}

/* ── EDIT MODAL ── */
.modal-overlay {
  display: none;
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.45);
  backdrop-filter: blur(4px);
  z-index: 500;
  align-items: center;
  justify-content: center;
  padding: 20px;
}
.modal-overlay.open { display: flex; }
.modal-card {
  background: var(--white);
  border-radius: var(--radius);
  padding: 28px 24px;
  width: 100%;
  max-width: 420px;
  box-shadow: 0 20px 60px rgba(0,0,0,0.2);
  animation: popIn 0.25s cubic-bezier(0.34,1.56,0.64,1);
}
@keyframes popIn {
  from { opacity: 0; transform: scale(0.95) translateY(12px); }
  to   { opacity: 1; transform: scale(1) translateY(0); }
}
.modal-title {
  font-family: var(--font-en);
  font-size: 16px;
  letter-spacing: 0.5px;
  margin-bottom: 20px;
  color: var(--black);
}
.form-group { margin-bottom: 16px; }
.form-label {
  display: block;
  font-size: 12px; font-weight: 600;
  margin-bottom: 6px;
  color: var(--black);
}
.form-input, .form-textarea {
  width: 100%;
  padding: 10px 14px;
  border: 1.5px solid var(--border);
  border-radius: 12px;
  font-family: var(--font-my);
  font-size: 14px;
  color: var(--black);
  outline: none;
  transition: border-color 0.15s;
  background: var(--white);
  line-height: 1.8;
}
.form-input:focus, .form-textarea:focus { border-color: var(--black); }
.form-textarea { min-height: 90px; resize: vertical; }
.modal-actions { display: flex; gap: 8px; margin-top: 20px; }

/* ── SCRIPTS SECTION ── */
.section-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-top: 36px;
  margin-bottom: 20px;
  flex-wrap: wrap;
  gap: 10px;
}
.section-title {
  font-family: var(--font-en);
  font-size: 15px;
  letter-spacing: 0.5px;
  color: var(--black);
  display: flex; align-items: center; gap: 8px;
}
.section-divider {
  width: 32px; height: 2px;
  background: var(--red);
  border-radius: 2px;
  display: inline-block;
  vertical-align: middle;
  margin-left: 8px;
}

/* Scripts grid */
.scripts-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  gap: 14px;
}

.script-card {
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 18px;
  transition: all 0.18s;
  position: relative;
  background: var(--white);
}
.script-card:hover {
  border-color: var(--black);
  transform: translateY(-2px);
  box-shadow: 0 8px 24px rgba(0,0,0,0.07);
}
.script-card-top {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 8px;
  margin-bottom: 8px;
}
.script-card-title {
  font-family: var(--font-my);
  font-size: 14px;
  font-weight: 600;
  color: var(--black);
  line-height: 1.6;
}
.script-card-menu {
  position: relative;
  flex-shrink: 0;
}
.script-menu-btn {
  width: 28px; height: 28px;
  border-radius: 50%;
  border: 1px solid transparent;
  background: transparent;
  cursor: pointer;
  font-size: 16px;
  color: var(--slate-lt);
  display: flex; align-items: center; justify-content: center;
  transition: all 0.12s;
}
.script-menu-btn:hover { background: var(--slate-bg); border-color: var(--border); color: var(--black); }

.script-dropdown {
  display: none;
  position: absolute;
  right: 0; top: 32px;
  background: var(--white);
  border: 1px solid var(--border);
  border-radius: 12px;
  box-shadow: 0 8px 24px rgba(0,0,0,0.1);
  z-index: 50;
  min-width: 130px;
  overflow: hidden;
}
.script-dropdown.open { display: block; }
.script-dd-item {
  display: flex; align-items: center; gap: 8px;
  padding: 10px 14px;
  font-family: var(--font-my);
  font-size: 12px;
  color: var(--black);
  cursor: pointer;
  transition: background 0.12s;
  line-height: 1.6;
  border: none; background: none; width: 100%; text-align: left;
}
.script-dd-item:hover { background: var(--slate-bg); }
.script-dd-item.danger { color: var(--red); }
.script-dd-item.danger:hover { background: rgba(220,38,38,0.06); }

.script-card-meta {
  font-size: 11px;
  color: var(--slate-lt);
  line-height: 1.8;
  margin-bottom: 12px;
}
.script-tag {
  display: inline-block;
  padding: 3px 10px;
  border-radius: 99px;
  font-family: var(--font-en);
  font-size: 10px;
  letter-spacing: 0.3px;
  border: 1px solid var(--border);
  color: var(--slate);
  margin-right: 4px;
}
.script-tag.draft { border-color: var(--slate-lt); }
.script-tag.complete { background: var(--black); color: var(--white); border-color: var(--black); }

.script-card-actions {
  display: flex;
  gap: 6px;
  margin-top: 12px;
}
.script-act-btn {
  flex: 1;
  padding: 6px 10px;
  border-radius: 10px;
  border: 1px solid var(--border);
  background: var(--white);
  font-family: var(--font-my);
  font-size: 11px;
  color: var(--black);
  cursor: pointer;
  transition: all 0.12s;
  text-align: center;
  line-height: 1.6;
}
.script-act-btn:hover { background: var(--black); color: var(--white); border-color: var(--black); }
.script-act-btn.primary { background: var(--black); color: var(--white); border-color: var(--black); }
.script-act-btn.primary:hover { background: var(--red); border-color: var(--red); }

/* New script card */
.script-card-new {
  border: 1.5px dashed var(--border);
  border-radius: var(--radius);
  padding: 18px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 160px;
  cursor: pointer;
  transition: all 0.18s;
  gap: 8px;
  text-decoration: none;
  color: var(--slate);
}
.script-card-new:hover { border-color: var(--black); background: var(--slate-bg); color: var(--black); }
.script-card-new .plus { font-size: 28px; line-height: 1; }
.script-card-new .new-label { font-family: var(--font-en); font-size: 12px; letter-spacing: 0.5px; }

/* Empty state */
.empty-state {
  text-align: center;
  padding: 48px 24px;
  color: var(--slate-lt);
  font-size: 14px;
  line-height: 2;
  border: 1.5px dashed var(--border);
  border-radius: var(--radius);
}
.empty-state .icon { font-size: 36px; display: block; margin-bottom: 10px; }

/* ── FOOTER ── */
footer {
  background: var(--slate-bg);
  border-top: 1px solid var(--border);
  padding: 18px 32px;
  text-align: center;
}
.footer-text {
  font-family: var(--font-en);
  font-size: 11px;
  color: var(--slate);
  letter-spacing: 0.5px;
}

/* Toast */
.toast {
  position: fixed;
  bottom: 24px; right: 24px;
  background: var(--black);
  color: var(--white);
  font-family: var(--font-my);
  font-size: 13px;
  line-height: 1.8;
  padding: 10px 18px;
  border-radius: 10px;
  box-shadow: 0 8px 24px rgba(0,0,0,0.2);
  transform: translateY(80px);
  opacity: 0;
  transition: all 0.3s cubic-bezier(0.34,1.56,0.64,1);
  z-index: 9999;
}
.toast.show { transform: translateY(0); opacity: 1; }

/* ── Clap stats (big) ── */
.clap-stats {
  display: flex;
  align-items: center;
  gap: 20px;
  margin-bottom: 10px;
}
.clap-stat-item {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
}
.clap-num {
  font-family: var(--font-en);
  font-size: 32px;
  font-weight: 700;
  color: var(--black);
  line-height: 1.1;
  letter-spacing: -0.5px;
}
.clap-label {
  font-size: 12px;
  color: var(--slate);
  margin-top: 2px;
  line-height: 1.4;
}
.clap-stat-divider {
  width: 1px;
  height: 36px;
  background: var(--border);
}

/* ── Script stats (small) ── */
.script-stats {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-bottom: 16px;
  flex-wrap: wrap;
}
.script-stat-item {
  font-size: 12px;
  color: var(--slate);
  line-height: 1.6;
}
.script-stat-item strong {
  color: var(--black);
  font-weight: 700;
}
.script-stat-sep {
  color: var(--border);
  font-size: 12px;
}

/* ── Profile tabs ── */
.profile-tabs {
  display: flex;
  border-bottom: 1px solid var(--border);
  margin-bottom: 24px;
  gap: 0;
}
.profile-tab {
  padding: 12px 20px;
  border: none; background: transparent;
  font-family: var(--font-my); font-size: 14px;
  color: var(--slate); cursor: pointer;
  border-bottom: 2px solid transparent;
  transition: all .15s; line-height: 1.6;
  white-space: nowrap;
}
.profile-tab:hover { color: var(--black); }
.profile-tab.active { color: var(--black); border-bottom-color: var(--black); font-weight: 600; }

/* ── Clapped privacy buttons ── */
.clap-priv-btn {
  padding: 5px 12px; border-radius: 99px;
  border: 1.5px solid var(--border);
  background: var(--white); font-family: var(--font-my);
  font-size: 12px; color: var(--slate); cursor: pointer;
  transition: all .15s; line-height: 1.8;
}
.clap-priv-btn.active { background: var(--black); border-color: var(--black); color: var(--white); }

/* ── Clapper count — clickable ── */
.clap-num { cursor: pointer; transition: opacity .15s; }
.clap-num:hover { opacity: .7; }

/* ── New clapper badge ── */
.new-clap-badge {
  display: inline-flex; align-items: center;
  padding: 1px 6px; border-radius: 99px;
  background: var(--red); color: var(--white);
  font-family: var(--font-en); font-size: 10px; font-weight: 700;
  margin-left: 6px; vertical-align: middle;
  animation: pulse 1.5s ease infinite;
}
@keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:.6;} }

/* ── Clappers/Clapping popup ── */
.clap-popup-ov {
  display: none; position: fixed; inset: 0;
  background: rgba(0,0,0,.5); backdrop-filter: blur(4px);
  z-index: 600; align-items: center; justify-content: center; padding: 20px;
}
.clap-popup-ov.open { display: flex; }
.clap-popup {
  background: var(--white); border-radius: 20px;
  padding: 0; width: 100%; max-width: 380px;
  box-shadow: 0 20px 60px rgba(0,0,0,.2);
  animation: popIn .25s cubic-bezier(.34,1.56,.64,1);
  overflow: hidden; max-height: 80vh; display: flex; flex-direction: column;
}
@keyframes popIn { from{opacity:0;transform:scale(.95) translateY(12px);}to{opacity:1;transform:scale(1) translateY(0);} }
.clap-popup-hdr {
  display: flex; align-items: center; justify-content: space-between;
  padding: 16px 20px; border-bottom: 1px solid var(--border); flex-shrink: 0;
}
.clap-popup-title { font-family: var(--font-my); font-size: 15px; font-weight: 600; color: var(--black); line-height: 1.6; }
.clap-popup-close {
  width: 28px; height: 28px; border-radius: 50%; border: 1px solid var(--border);
  background: transparent; cursor: pointer; font-size: 14px;
  display: flex; align-items: center; justify-content: center; color: var(--slate);
}
.clap-popup-close:hover { background: var(--slate-bg); }
.clap-popup-body { overflow-y: auto; flex: 1; padding: 8px 0; }
.clap-user-item {
  display: flex; align-items: center; gap: 12px;
  padding: 10px 20px; text-decoration: none; color: var(--black);
  transition: background .12s;
}
.clap-user-item:hover { background: var(--slate-bg); }
.clap-user-av {
  width: 40px; height: 40px; border-radius: 50%;
  background: var(--slate-bg); border: 1px solid var(--border);
  display: flex; align-items: center; justify-content: center;
  font-size: 16px; overflow: hidden; flex-shrink: 0;
}
.clap-user-av img { width: 100%; height: 100%; object-fit: cover; }
.clap-user-name { font-size: 14px; font-weight: 600; line-height: 1.5; }
.clap-user-uname { font-family: var(--font-en); font-size: 12px; color: var(--slate-lt); }
.clap-popup-empty { padding: 32px; text-align: center; color: var(--slate-lt); font-size: 13px; line-height: 2; }

/* ── Role badge ── */
.role-badge {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 3px 12px;
  background: var(--slate-bg);
  border-radius: 99px;
  font-size: 12px;
  color: var(--slate);
  border: 1px solid var(--border);
}

/* ── RESPONSIVE ── */
@media (max-width: 600px) {
  nav { padding: 14px 18px; }
  main { padding-left: 16px; padding-right: 16px; }
  .profile-header { gap: 18px; }
  .avatar { width: 80px; height: 80px; font-size: 32px; }
  .profile-name { font-size: 18px; }
  .scripts-grid { grid-template-columns: 1fr; }
  .profile-stats { gap: 16px; }
}
</style>
</head>
<body>

<!-- NAV -->
<nav>
  <a class="brand" href="index.html">
    cine<br><span>podma</span>
  </a>
  <div class="nav-right" id="navRight">
    <a class="btn btn-ghost btn-sm" href="index.html">← Home</a>
    <!-- JS က owner/public အလိုက် ဖြည့်မည် -->
  </div>
</nav>

<main>

  <!-- PROFILE HEADER -->
  <div class="profile-header">

    <!-- Avatar -->
    <div class="avatar-wrap">
      <div class="avatar" id="avatarDiv">
        <span id="avatarEmoji">👤</span>
        <img id="avatarImg" src="" alt="" style="display:none;">
      </div>
      <input type="file" id="avatarInput" accept="image/*" style="display:none;">
    </div>

    <!-- Info -->
    <div class="profile-info">
      <div class="profile-name-row">
        <span class="profile-name" id="dispName">—</span>
        <span class="profile-username" id="dispUsername"></span>
      </div>
      <div id="dispRole" style="margin:4px 0 6px;"></div>
      <p id="dispBio" style="font-size:13px;color:var(--slate);margin-bottom:6px;line-height:1.8;"></p>
      <p id="dispEmail" style="font-size:12px;color:var(--slate);margin-bottom:16px;line-height:1.8;"></p>

      <!-- Clappers / Clapping — ကြီးကြီး -->
      <div class="clap-stats">
        <div class="clap-stat-item" onclick="openClappersPopup()" style="cursor:pointer;">
          <span class="clap-num" id="statClappers">0</span><span id="newClapBadge" style="display:none;" class="new-clap-badge"></span>
          <span class="clap-label">👏 Clappers</span>
        </div>
        <div class="clap-stat-divider"></div>
        <div class="clap-stat-item" onclick="openClappingPopup()" style="cursor:pointer;">
          <span class="clap-num" id="statClapping">0</span>
          <span class="clap-label">Clapping</span>
        </div>
      </div>

      <!-- Scripts — သေးသေး -->
      <div class="script-stats">
        <span class="script-stat-item">
          <strong id="statScripts">0</strong> Scripts
        </span>
        <span class="script-stat-sep">·</span>
        <span class="script-stat-item">
          <strong id="statDrafts">0</strong> Drafts
        </span>
        <span class="script-stat-sep">·</span>
        <span class="script-stat-item">
          <strong id="statComplete">0</strong> Complete
        </span>
      </div>

      <div class="profile-actions" id="profileActions"></div>
    </div>
  </div>

  <!-- PROFILE TABS -->
  <div class="profile-tabs">
    <button class="profile-tab active" id="tabDocs" onclick="switchProfileTab('docs',this)">
      Story / Screenplay
    </button>
    <button class="profile-tab" id="tabClapped" onclick="switchProfileTab('clapped',this)">
      👏 Clapped
    </button>
  </div>

  <!-- DOCS TAB -->

/* ══ AUTH ══ */
onAuthStateChanged(auth, async function(user) {

/* ══ LOAD PROFILE ══ */
async function loadProfile() {
  var snap = await getDoc(doc(db, 'users', profileUid));
  if (!snap.exists()) { document.getElementById('dispName').textContent='User မတွေ့ပါ'; return; }
  currentProfile = snap.data();
  document.getElementById('dispName').textContent     = currentProfile.name     || '—';
  document.getElementById('dispUsername').textContent = currentProfile.username  || '';
  document.getElementById('dispBio').textContent      = currentProfile.bio       || '';
  if (currentProfile.role) {
    var roleIcons={Producer:'🎬',Director:'🎥',Writer:'✍️',Filmmaker:'🎞️',Actor:'🎭',Cinephile:'🍿'};
    document.getElementById('dispRole').innerHTML =
      '<span style="display:inline-flex;align-items:center;gap:5px;padding:3px 10px;background:var(--slate-bg);border-radius:99px;font-size:12px;color:var(--slate);">' +
      (roleIcons[currentProfile.role]||'') + ' ' + currentProfile.role + '</span>';
  }
  if (currentProfile.contactEmail) {
    document.getElementById('dispEmail').innerHTML =
      '✉ <a href="mailto:'+currentProfile.contactEmail+'" style="color:var(--black)">'+currentProfile.contactEmail+'</a>';
  }
  if (currentProfile.avatar) {
    document.getElementById('avatarEmoji').style.display='none';
    var img=document.getElementById('avatarImg');img.src=currentProfile.avatar;img.style.display='block';
  }
}

/* ══ LOAD SCRIPTS ══ */
async function loadScripts() {
  var q = query(collection(db,'docs'), where('uid','==',profileUid));
  var snap = await getDocs(q);
  scripts = [];
  snap.forEach(function(d) {
    var data=d.data();
    scripts.push({id:d.id,title:data.title||'Untitled',type:data.type||'screenplay',
      status:data.status||'draft',privacy:data.privacy||'private',
      scenes:data.screenplay?data.screenplay.length:0,
      updated:data.updatedAt?data.updatedAt.substring(0,10):'—',uid:data.uid});
  });
  if (!isOwner) scripts=scripts.filter(function(s){return s.privacy==='public';});
  scripts.sort(function(a,b){return b.updated.localeCompare(a.updated);});
  renderScripts();
}

/* ══ LOAD CLAPPERS ══ */
async function loadClappers() {
  try {
    var coll = collection(db,'clappers',profileUid,'users');
    var snap = await getCountFromServer(coll);
    var count = snap.data().count;
    document.getElementById('statClappers').textContent =
      count>=1000?(count/1000).toFixed(1)+'K':count;
  } catch(e) { document.getElementById('statClappers').textContent='0'; }

  try {
    var coll2 = collection(db,'clapping',profileUid,'users');
    var snap2 = await getCountFromServer(coll2);
    var count2 = snap2.data().count;
    document.getElementById('statClapping').textContent =
      count2>=1000?(count2/1000).toFixed(1)+'K':count2;
  } catch(e) { document.getElementById('statClapping').textContent='0'; }
}

}

var clappedDocs=[];
window.setClappedPrivacy=function(p,btn){
  clappedPrivacy=p;
  document.querySelectorAll('.clap-priv-btn').forEach(function(b){b.classList.remove('active');});
  btn.classList.add('active');

async function loadClappedDocs(){
  var grid=document.getElementById('clappedGrid');
  grid.innerHTML='<div style="padding:32px;text-align:center;color:var(--slate-lt);">ဖွင့်နေသည်...</div>';
  try{
    var snap=await getDocs(collection(db,'clapping',profileUid,'users'));
    var docIds=[];
    snap.forEach(function(d){docIds.push(d.data().uid||d.id);});
    if(docIds.length===0){grid.innerHTML='<div style="padding:32px;text-align:center;color:var(--slate-lt);font-size:13px;">Clapped doc မရှိသေးပါ</div>';return;}
    /* load each doc */
    var promises=docIds.map(function(id){return getDoc(doc(db,'docs',id));});
    var docs=await Promise.all(promises);
    clappedDocs=[];
    docs.forEach(function(d){if(d.exists())clappedDocs.push({id:d.id,...d.data()});});
    renderClappedDocs();
  }catch(e){grid.innerHTML='<div style="padding:32px;text-align:center;color:var(--slate-lt);">ဖွင့်မရပါ</div>';}
}

function renderClappedDocs(){
  var grid=document.getElementById('clappedGrid');
  var docs=clappedDocs;
  /* privacy filter — owner only sees private, public sees all public */
  if(!isOwner){
    docs=docs.filter(function(d){return d.privacy==='public';});
  } else {
    if(clappedPrivacy==='public') docs=docs.filter(function(d){return d.privacy==='public';});
    /* private = show all (owner) */
  }
  if(docs.length===0){
    grid.innerHTML='<div style="padding:32px;text-align:center;color:var(--slate-lt);font-size:13px;">Doc မရှိသေးပါ</div>';
    return;
  }
  grid.innerHTML=docs.map(function(s){
    var typeIcon=s.type==='story'?'📖':'🎬';
    return '<div class="script-card">'+
      '<div class="script-card-top">'+
        '<div class="script-card-title">'+typeIcon+' '+(s.title||'Untitled')+'</div>'+
      '</div>'+
      '<div class="script-card-meta">'+(s.authorUsername||s.authorName||'—')+'</div>'+
      '<div class="script-card-actions">'+
        '<button class="script-act-btn primary" onclick="window.location.href=\'profile.html?uid='+(s.uid||'')+'\'">👤 Profile</button>'+
      '</div>'+
    '</div>';
  }).join('');
}

/* ══ CLAP TOGGLE ══ */
window.toggleClap=async function(){
  if(!currentUser){
    /* show sign up prompt instead of redirect */
    if(confirm('Clap လုပ်ရန် အကောင့်ဖွင့်ရန် လိုသည်။ အကောင့်ဖွင့်မည်လား?')){
      window.location.href='index.html';
    }
    return;
  }
  var btn      =document.getElementById('clapBtn');
  var clapRef  =doc(db,'clappers',profileUid,'users',currentUser.uid);
  var clapSnap =await getDoc(clapRef);
  var el       =document.getElementById('statClappers');
  var count    =parseInt(el.textContent.replace('K',''))||0;

  if(clapSnap.exists()){
    await deleteDoc(clapRef);
    try{await deleteDoc(doc(db,'clapping',currentUser.uid,'users',profileUid));}catch(e){}
    /* decrease newClappers for profile owner */
    try{
      var ownerSnap=await getDoc(doc(db,'users',profileUid));
      if(ownerSnap.exists()){
        var nc=Math.max(0,(ownerSnap.data().newClappers||0)-1);
        await updateDoc(doc(db,'users',profileUid),{newClappers:nc});
      }
    }catch(e){}
    btn.textContent='👏 Clap';btn.classList.remove('clapped');
    el.textContent=Math.max(0,count-1);
  }else{
    await setDoc(clapRef,{clappedAt:new Date().toISOString(),uid:currentUser.uid});
    try{
      /* get my profile for clapping record */
      var mySnap=await getDoc(doc(db,'users',currentUser.uid));
      var myData=mySnap.exists()?mySnap.data():{};
      await setDoc(doc(db,'clapping',currentUser.uid,'users',profileUid),
        {uid:profileUid,clappedAt:new Date().toISOString()});
      /* increment newClappers for profile owner */
      var ownerSnap2=await getDoc(doc(db,'users',profileUid));
      if(ownerSnap2.exists()){
        var nc2=(ownerSnap2.data().newClappers||0)+1;
        await updateDoc(doc(db,'users',profileUid),{newClappers:nc2});
      }
    }catch(e){}
    btn.textContent='👏 Clapped';btn.classList.add('clapped');
    el.textContent=count+1;
  }
};

/* ══ RENDER SCRIPTS ══ */
function renderScripts(){
  var grid=document.getElementById('scriptsGrid');
  var drafts=scripts.filter(function(s){return s.status==='draft';}).length;
  var complete=scripts.filter(function(s){return s.status==='complete';}).length;
  document.getElementById('statScripts').textContent=scripts.length;
  document.getElementById('statDrafts').textContent=drafts;
  document.getElementById('statComplete').textContent=complete;

  if(scripts.length===0){
    grid.innerHTML='<div class="empty-state"><span class="icon">📝</span>'+(isOwner?'Doc မရှိသေးပါ<br><small>+ New နှိပ်ပြီး စတင်ပါ</small>':'Public doc မရှိသေးပါ')+'</div>';
    return;
  }
  var html=scripts.map(function(s){
    var typeIcon=s.type==='story'?'📖':'🎬';
    var typeName=s.type==='story'?'Story':'Screenplay';
    var ownerBtns=isOwner?(
      '<button class="script-menu-btn" onclick="window._toggleMenu(\''+s.id+'\', event)">⋯</button>'+
      '<div class="script-dropdown" id="menu-'+s.id+'">'+
        '<button class="script-dd-item" onclick="window._editScript(\''+s.id+'\')">✏ ဖွင့်မည်</button>'+
        '<button class="script-dd-item" onclick="window._toggleStatus(\''+s.id+'\')">'+(s.status==='draft'?'✅ Complete မှတ်မည်':'📝 Draft ပြန်မည်')+'</button>'+
        '<button class="script-dd-item" onclick="window._togglePrivacy(\''+s.id+'\')">'+(s.privacy==='public'?'🔒 Private ပြောင်းမည်':'🌐 Public ပြောင်းမည်')+'</button>'+
        '<button class="script-dd-item danger" onclick="window._deleteScript(\''+s.id+'\')">🗑 ဖျက်မည်</button>'+
      '</div>'
    ):'';
    var actionBtns=isOwner
      ?'<button class="script-act-btn primary" onclick="window._editScript(\''+s.id+'\')">✍ ဆက်ရေးမည်</button>'
      :'<button class="script-act-btn primary" onclick="window._editScript(\''+s.id+'\')">📖 ဖတ်မည်</button>';
    return '<div class="script-card" id="sc-'+s.id+'">'+
      '<div class="script-card-top">'+
        '<div class="script-card-title">'+typeIcon+' '+(s.title||'Untitled')+'</div>'+
        '<div class="script-card-menu">'+ownerBtns+'</div>'+
      '</div>'+
      '<div class="script-card-meta">'+typeName+' · '+s.updated+'</div>'+
      '<div style="display:flex;gap:6px;margin-top:4px;">'+
        '<span class="script-tag '+s.status+'">'+(s.status==='draft'?'Draft':'Complete')+'</span>'+
        '<span class="script-tag" style="background:var(--slate-bg);color:var(--slate);">'+(s.privacy==='public'?'🌐 Public':'🔒 Private')+'</span>'+
      '</div>'+
      '<div class="script-card-actions">'+actionBtns+'</div>'+
    '</div>';
  }).join('');
  if(isOwner) html+='<a class="script-card-new" href="write.html"><span class="plus">+</span><span class="new-label">New Doc</span></a>';
  grid.innerHTML=html;
}

/* ══ SCRIPT ACTIONS ══ */
window._toggleMenu=function(id,e){
  e.stopPropagation();
  document.querySelectorAll('.script-dropdown').forEach(function(d){if(d.id!=='menu-'+id)d.classList.remove('open');});
  document.getElementById('menu-'+id).classList.toggle('open');
};
document.addEventListener('click',function(){document.querySelectorAll('.script-dropdown').forEach(function(d){d.classList.remove('open');});});
window._editScript=function(id){window.location.href='write.html?id='+id;};
window._toggleStatus=async function(id){
  var s=scripts.find(function(x){return x.id===id;});if(!s)return;
  s.status=s.status==='draft'?'complete':'draft';
  await updateDoc(doc(db,'docs',id),{status:s.status});
  renderScripts();toast('✅ '+(s.status==='complete'?'Complete':'Draft')+' မှတ်ပြီး');
};
window._togglePrivacy=async function(id){
  var s=scripts.find(function(x){return x.id===id;});if(!s)return;
  s.privacy=s.privacy==='public'?'private':'public';
  await updateDoc(doc(db,'docs',id),{privacy:s.privacy});
  renderScripts();toast((s.privacy==='public'?'🌐 Public':'🔒 Private')+' ပြောင်းပြီး');
};
window._deleteScript=async function(id){
  var s=scripts.find(function(x){return x.id===id;});
  if(!s||!confirm('"'+s.title+'" ကို ဖျက်မည်?'))return;
  await deleteDoc(doc(db,'docs',id));
  scripts=scripts.filter(function(x){return x.id!==id;});
  renderScripts();toast('🗑 ဖျက်ပြီး');
};

/* ══ INIT ══ */
/* get uid from URL ?uid=xxx or load own profile */
var urlParams = new URLSearchParams(window.location.search);
var uidParam  = urlParams.get('uid');

var initialized = false;

onAuthStateChanged(auth, async function(user) {
  if (initialized) return;
  initialized = true;
  currentUser = user;

  /* ── Public view via URL ?uid=xxx ── */
  if (uidParam) {
    profileUid = uidParam;
    isOwner    = user ? user.uid === profileUid : false;
    try { await loadProfile(); } catch(e) { console.error('loadProfile',e); }
    try { await loadScripts(); } catch(e) { console.error('loadScripts',e); }
    try { await loadClappers(); } catch(e) { console.error('loadClappers',e); }
    renderNav();
    renderActions();
    return;
  }

  /* ── Own profile — must be logged in ── */
  if (!user) {
    window.location.href = 'index.html';
    return;
  }
  profileUid = user.uid;
  isOwner    = true;
  try { await loadProfile(); } catch(e) { console.error('loadProfile',e); }
  try { await loadScripts(); } catch(e) { console.error('loadScripts',e); }
  try { await loadClappers(); } catch(e) { console.error('loadClappers',e); }

  renderActions();

/* ══ LOAD PROFILE ══ */
async function loadProfile() {
  try {
    var snap = await getDoc(doc(db, 'users', profileUid));
    if (!snap.exists()) {
      document.getElementById('dispName').textContent = 'User မတွေ့ပါ';
      return;
    }
    currentProfile = snap.data();
    document.getElementById('dispName').textContent     = currentProfile.name || '—';
    document.getElementById('dispUsername').textContent = currentProfile.username || '';
    document.getElementById('dispBio').textContent      = currentProfile.bio || '';
    if (currentProfile.role) {
      var roleIcons = { Producer:'🎬', Director:'🎥', Writer:'✍️', Filmmaker:'🎞️', Actor:'🎭', Cinephile:'🍿' };
      var icon = roleIcons[currentProfile.role] || '';
      document.getElementById('dispRole').innerHTML =
        '<span style="display:inline-flex;align-items:center;gap:5px;padding:3px 10px;' +
        'background:var(--slate-bg);border-radius:99px;font-size:12px;color:var(--slate);">' +
        icon + ' ' + currentProfile.role + '</span>';
    }
    if (currentProfile.contactEmail) {
      document.getElementById('dispEmail').innerHTML =
        '✉ <a href="mailto:' + currentProfile.contactEmail + '" style="color:var(--black)">' +
        currentProfile.contactEmail + '</a>';
    }
    if (currentProfile.avatar) {
      document.getElementById('avatarEmoji').style.display = 'none';
      var img = document.getElementById('avatarImg');
      img.src = currentProfile.avatar;
      img.style.display = 'block';
    }
  } catch(e) {
    console.error('loadProfile error:', e);
    document.getElementById('dispName').textContent = 'Profile ဖတ်မရပါ';
  }
}

/* ══ LOAD SCRIPTS ══ */
async function loadScripts() {
  try {
    var q = query(collection(db, 'docs'), where('uid', '==', profileUid));
    var snap = await getDocs(q);
    scripts = [];
    snap.forEach(function(d) {
      var data = d.data();
      scripts.push({
        id: d.id,
        title: data.title || 'Untitled',
        type: data.type || 'screenplay',
        status: data.status || 'draft',
        privacy: data.privacy || 'private',
        scenes: data.screenplay ? data.screenplay.length : 0,
        updated: data.updatedAt ? data.updatedAt.substring(0,10) : '—',
        uid: data.uid
      });
    });
    /* public view — only show public docs */
    if (!isOwner) {
      scripts = scripts.filter(function(s) { return s.privacy === 'public'; });
    }
    /* newest first */
    scripts.sort(function(a,b){ return b.updated.localeCompare(a.updated); });
    renderScripts();
  } catch(e) {
    console.error('loadScripts',e);
    scripts = [];
    renderScripts();
  }
}

/* ══ LOAD CLAPPERS ══ */
async function loadClappers() {
  try {
    /* Clappers — ကိုယ့်ကို clap လုပ်သူ */
    var coll  = collection(db, 'clappers', profileUid, 'users');
    var snap  = await getCountFromServer(coll);
    var count = snap.data().count;
    document.getElementById('statClappers').textContent =
      count >= 1000 ? (count / 1000).toFixed(1) + 'K' : count;

    /* Clapping — ကိုယ်က clap လုပ်ထားသူ (owner only) */
    if (isOwner && currentUser) {
      /* query all clappers subcollections where current user exists */
      /* Firestore limitation: collectionGroup query လိုအပ်တယ် */
      /* Simple approach: load from user's clapping list */
      try {
        var clappingSnap = await getDocs(collection(db, 'clapping', profileUid, 'users'));
        var clappingCount = clappingSnap.size;
        document.getElementById('statClapping').textContent =
          clappingCount >= 1000 ? (clappingCount / 1000).toFixed(1) + 'K' : clappingCount;
      } catch(e) {
        document.getElementById('statClapping').textContent = '0';
      }
    } else {
      document.getElementById('statClapping').textContent = '0';
    }
  } catch(e) {
    document.getElementById('statClappers').textContent = '0';
    document.getElementById('statClapping').textContent = '0';
  }
}

/* ══ RENDER ACTIONS ══ */
async function renderActions() {
  var el = document.getElementById('profileActions');
  var newBtn = document.getElementById('newScriptBtn');

  if (isOwner) {
    el.innerHTML =
      '<button class="btn btn-ghost btn-sm" onclick="copyProfileLink()">🔗 Link ကူးမည်</button>';
    newBtn.innerHTML = '<a class="btn btn-red btn-sm" href="write.html">+ New Script</a>';
  } else {
    /* check if already clapped */
    var clapped = false;
    if (currentUser) {
      var cSnap = await getDoc(doc(db, 'clappers', profileUid, 'users', currentUser.uid));
      clapped = cSnap.exists();
    }
    el.innerHTML =
      '<button class="btn btn-red btn-sm" id="clapBtn" onclick="toggleClap()">' +
        (clapped ? '👏 Clapped' : '👏 Clap') +
      '</button>' +
      '<button class="btn btn-ghost btn-sm" onclick="copyProfileLink()">🔗 Link ကူးမည်</button>';
    newBtn.innerHTML = '';
  }
}

/* ══ CLAP ══ */
window.toggleClap = async function() {
  if (!currentUser) {
    window.location.href = 'index.html';
    return;
  }
  var btn      = document.getElementById('clapBtn');
  var clapRef  = doc(db, 'clappers', profileUid, 'users', currentUser.uid);
  var clapSnap = await getDoc(clapRef);

  var el    = document.getElementById('statClappers');
  var count = parseInt(el.textContent.replace('K','')) || 0;

  if (clapSnap.exists()) {
    /* remove clap */
    await deleteDoc(clapRef);
    /* remove from my clapping list */
    try { await deleteDoc(doc(db, 'clapping', currentUser.uid, 'users', profileUid)); } catch(e) {}
    btn.textContent = '👏 Clap';
    btn.classList.remove('clapped');
    el.textContent = Math.max(0, count - 1);
  } else {
    /* add clap */
    await setDoc(clapRef, { clappedAt: new Date().toISOString() });
    /* add to my clapping list */
    try { await setDoc(doc(db, 'clapping', currentUser.uid, 'users', profileUid), { uid: profileUid, clappedAt: new Date().toISOString() }); } catch(e) {}
    btn.textContent = '👏 Clapped';
    btn.classList.add('clapped');
    el.textContent = count + 1;
  }
};

/* ══ RENDER SCRIPTS ══ */
function renderScripts() {
  var grid     = document.getElementById('scriptsGrid');
  var drafts   = scripts.filter(function(s) { return s.status === 'draft'; }).length;
  var complete = scripts.filter(function(s) { return s.status === 'complete'; }).length;
  document.getElementById('statScripts').textContent  = scripts.length;
  document.getElementById('statDrafts').textContent   = drafts;
  document.getElementById('statComplete').textContent = complete;

  if (scripts.length === 0) {
    grid.innerHTML =
      '<div class="empty-state"><span class="icon">📝</span>' +
      (isOwner ? 'Screenplay မရှိသေးပါ<br><small>+ New Script နှိပ်ပြီး စတင်ပါ</small>'
               : 'Public screenplay မရှိသေးပါ') +
      '</div>';
    return;
  }

  var html = scripts.map(function(s) {
    var ownerBtns = isOwner ?
      '<button class="script-menu-btn" onclick="window._toggleMenu(\'' + s.id + '\', event)">⋯</button>' +
      '<div class="script-dropdown" id="menu-' + s.id + '">' +
        '<button class="script-dd-item" onclick="window._editScript(\'' + s.id + '\')">✏ ဖွင့်မည်</button>' +
        '<button class="script-dd-item" onclick="window._renameScript(\'' + s.id + '\')">✎ နာမည်ပြောင်း</button>' +
        '<button class="script-dd-item" onclick="window._toggleStatus(\'' + s.id + '\')">' +
          (s.status === 'draft' ? '✅ Complete မှတ်မည်' : '📝 Draft ပြန်မည်') +
        '</button>' +
        '<button class="script-dd-item danger" onclick="window._deleteScript(\'' + s.id + '\')">🗑 ဖျက်မည်</button>' +
      '</div>' : '';

    var ownerActions = isOwner ?
      '<button class="script-act-btn primary" onclick="window._editScript(\'' + s.id + '\')">✍ ဆက်ရေးမည်</button>' +
      '<button class="script-act-btn" onclick="window._exportScript(\'' + s.id + '\')">⬇ Export</button>'
      : '<button class="script-act-btn" onclick="window.location.href=\'write.html?id=' + s.id + '&view=1\'">📖 ဖတ်မည်</button>';

    return (
      '<div class="script-card">' +
        '<div class="script-card-top">' +
          '<div class="script-card-title">' + (s.title || 'Untitled') + '</div>' +
          '<div class="script-card-menu">' + ownerBtns + '</div>' +
        '</div>' +
        '<div class="script-card-meta">မြင်ကွင်း ' + (s.scenes || 0) + ' ခု · ' + (s.updated || '—') + '</div>' +
        '<div><span class="script-tag ' + s.status + '">' + (s.status === 'draft' ? 'Draft' : 'Complete') + '</span></div>' +
        '<div class="script-card-actions">' + ownerActions + '</div>' +
      '</div>'
    );
  }).join('');

  if (isOwner) {
    html += '<a class="script-card-new" href="write.html"><span class="plus">+</span><span class="new-label">New Script</span></a>';
  }
  grid.innerHTML = html;
}

/* ══ EDIT PROFILE ══ */
window.openEdit = function() {
  document.getElementById('editName').value     = currentProfile.name     || '';
  document.getElementById('editUsername').value = (currentProfile.username || '').replace('@','');
  document.getElementById('editBio').value      = currentProfile.bio       || '';

  avatarDiv.style.cursor = 'pointer';
  avatarDiv.title = 'ဓာတ်ပုံ ပြောင်းရန် နှိပ်ပါ';
  avatarDiv.onclick = function() {
    document.getElementById('avatarInput').click();
  };
  document.getElementById('editModal').classList.add('open');
};

window.closeEdit = function() {
  document.getElementById('editModal').classList.remove('open');
  /* disable avatar click when not editing */
  var avatarDiv = document.getElementById('avatarDiv');
  avatarDiv.style.cursor = 'default';
  avatarDiv.title = '';
  avatarDiv.onclick = null;
};
window.saveProfile = async function() {
  var name = document.getElementById('editName').value.trim();
  var bio  = document.getElementById('editBio').value.trim();
  if (!name) { alert('အမည် ထည့်ပါ'); return; }
  try {
    await updateDoc(doc(db, 'users', currentUser.uid), { name: name, bio: bio });
    await updateProfile(currentUser, { displayName: name });
    currentProfile.name = name;
    currentProfile.bio  = bio;
    document.getElementById('dispName').textContent = name;
    document.getElementById('dispBio').textContent  = bio;

  } catch(e) { toast('❌ သိမ်းမရပါ — ' + e.message); }
};

/* ══ SCRIPT ACTIONS ══ */
window._toggleMenu = function(id, e) {
  e.stopPropagation();
  document.querySelectorAll('.script-dropdown').forEach(function(d) {
    if (d.id !== 'menu-' + id) d.classList.remove('open');
  });
  document.getElementById('menu-' + id).classList.toggle('open');
};
document.addEventListener('click', function() {
  document.querySelectorAll('.script-dropdown').forEach(function(d) { d.classList.remove('open'); });
});

window._editScript = function(id) {
  window.location.href = 'write.html?id=' + id;
};

window._toggleStatus = async function(id) {
  var s = scripts.find(function(x) { return x.id === id; });
  if (!s) return;
  s.status = s.status === 'draft' ? 'complete' : 'draft';
  try {
    await updateDoc(doc(db, 'docs', id), { status: s.status });
    renderScripts();
    toast('✅ Status ပြောင်းပြီး — ' + (s.status === 'complete' ? 'Complete' : 'Draft'));
  } catch(e) { toast('❌ ပြောင်းမရပါ'); }
};

window._togglePrivacy = async function(id) {
  var s = scripts.find(function(x) { return x.id === id; });
  if (!s) return;
  s.privacy = s.privacy === 'public' ? 'private' : 'public';
  try {
    await updateDoc(doc(db, 'docs', id), { privacy: s.privacy });
    renderScripts();
    toast((s.privacy === 'public' ? '🌐 Public' : '🔒 Private') + ' ပြောင်းပြီး');
  } catch(e) { toast('❌ ပြောင်းမရပါ'); }
};

window._deleteScript = async function(id) {
  var s = scripts.find(function(x) { return x.id === id; });
  if (!s || !confirm('"' + s.title + '" ကို ဖျက်မည်နှင့် သေချာပါသလား?')) return;
  try {
    await deleteDoc(doc(db, 'docs', id));
    scripts = scripts.filter(function(x) { return x.id !== id; });
    renderScripts();
    toast('🗑 ဖျက်ပြီး');
  } catch(e) { toast('❌ ဖျက်မရပါ'); }
};
