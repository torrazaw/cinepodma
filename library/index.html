<!DOCTYPE html>
<html lang="my" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Library — CinePodma</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Noto+Sans+Myanmar:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* ── TOKENS ── */
:root{
  --font-en:'Special Elite','Courier New',monospace;
  --font-my:'Noto Sans Myanmar',sans-serif;
  --red:#DC2626;--red-h:#B91C1C;
}
[data-theme="light"]{
  --bg:#FFFFFF;--bg2:#F3F4F6;
  --fg:#0A0A0A;--fg2:#6B7280;--fg3:#9CA3AF;
  --border:#E5E7EB;
  --nav-bg:rgba(255,255,255,.95);
  --card-bg:#FFFFFF;--card-border:#E5E7EB;
  --poster-bg:#F0F0F0;--poster-letter:#C0C0C0;
  --popup-bg:#FFFFFF;
  --tab-active:#0A0A0A;
  --badge-bg:rgba(0,0,0,.7);
  --clap-bg:rgba(255,255,255,.92);--clap-fg:#0A0A0A;
}
[data-theme="dark"]{
  --bg:#0D0D0D;--bg2:#1A1A1A;
  --fg:#F0F0F0;--fg2:#9CA3AF;--fg3:#6B7280;
  --border:#2A2A2A;
  --nav-bg:rgba(13,13,13,.95);
  --card-bg:#181818;--card-border:#2A2A2A;
  --poster-bg:#222;--poster-letter:#555;
  --popup-bg:#1A1A1A;
  --tab-active:#F0F0F0;
  --badge-bg:rgba(0,0,0,.75);
  --clap-bg:rgba(30,30,30,.95);--clap-fg:#F0F0F0;
}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;}
body{font-family:var(--font-my);background:var(--bg);color:var(--fg);min-height:100vh;display:flex;flex-direction:column;-webkit-font-smoothing:antialiased;transition:background .25s,color .25s;}

/* ── NAV ── */
nav{position:fixed;top:0;left:0;right:0;z-index:200;display:flex;align-items:center;justify-content:center;padding:12px 20px;background:var(--nav-bg);backdrop-filter:blur(8px);border-bottom:1px solid var(--border);transition:background .25s,border-color .25s;}
.nav-inner{width:100%;max-width:960px;display:flex;align-items:center;justify-content:space-between;}
.brand{font-family:var(--font-en);font-size:13px;color:var(--fg);text-decoration:none;line-height:1.3;}
.brand span{display:block;color:var(--fg2);font-size:11px;letter-spacing:1px;}
.nav-r{display:flex;align-items:center;gap:8px;}
.nav-btn{padding:7px 14px;border-radius:10px;border:1px solid var(--border);background:transparent;font-family:var(--font-my);font-size:12px;color:var(--fg2);cursor:pointer;text-decoration:none;transition:all .15s;line-height:1.6;}
.nav-btn:hover{background:var(--bg2);color:var(--fg);}
.nav-btn.red{background:var(--red);color:#fff;border-color:var(--red);}
.nav-btn.red:hover{background:var(--red-h);}
.nav-user-av{width:32px;height:32px;border-radius:50%;background:var(--bg2);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:14px;overflow:hidden;cursor:pointer;text-decoration:none;}
.nav-user-av img{width:100%;height:100%;object-fit:cover;}
.theme-btn{width:32px;height:32px;border-radius:50%;border:1px solid var(--border);background:var(--bg2);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:14px;transition:all .18s;}
.theme-btn:hover{background:var(--fg);color:var(--bg);}

/* ── MAIN ── */
main{flex:1;padding:76px 16px 60px;max-width:960px;margin:0 auto;width:100%;}

/* ── HEADER ── */
.page-hdr{margin-bottom:20px;}
.page-title{font-family:var(--font-en);font-size:28px;letter-spacing:.5px;color:var(--fg);margin-bottom:4px;}
.page-div{width:40px;height:2px;background:var(--red);border-radius:2px;margin-bottom:6px;}
.page-sub{font-size:13px;color:var(--fg2);line-height:1.8;}

/* ── SEARCH ── */
.search-wrap{position:relative;margin-bottom:14px;}
.search-icon{position:absolute;left:14px;top:50%;transform:translateY(-50%);font-size:15px;color:var(--fg3);pointer-events:none;}
.search-input{width:100%;padding:10px 16px 10px 42px;border:1.5px solid var(--border);border-radius:99px;font-family:var(--font-my);font-size:14px;color:var(--fg);background:var(--bg2);outline:none;transition:border-color .15s;line-height:1.8;}
.search-input:focus{border-color:var(--fg);}
.search-input::placeholder{color:var(--fg3);}

/* ── TABS ── */
.lib-tabs{display:flex;border-bottom:1px solid var(--border);margin-bottom:16px;overflow-x:auto;scrollbar-width:none;}
.lib-tabs::-webkit-scrollbar{display:none;}
.lib-tab{padding:10px 18px;border:none;background:transparent;font-family:var(--font-my);font-size:14px;color:var(--fg2);cursor:pointer;border-bottom:2px solid transparent;transition:all .15s;white-space:nowrap;line-height:1.6;flex-shrink:0;}
.lib-tab:hover{color:var(--fg);}
.lib-tab.active{color:var(--tab-active);border-bottom-color:var(--red);font-weight:600;}

/* ── FILTER ── */
.filter-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px;}
.filter-btn{padding:5px 12px;border-radius:99px;border:1.5px solid var(--border);background:transparent;font-family:var(--font-my);font-size:11px;color:var(--fg2);cursor:pointer;transition:all .15s;line-height:1.8;white-space:nowrap;}
.filter-btn:hover,.filter-btn.active{background:var(--fg);border-color:var(--fg);color:var(--bg);}

/* ── COUNT ── */
.result-count{font-family:var(--font-en);font-size:11px;color:var(--fg3);letter-spacing:.3px;margin-bottom:12px;}

/* ── GRID ──
   mobile  : 2 col
   tablet  : 3 col (≥600px)
   desktop : 4 col (≥900px)
*/
.lib-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
  margin-bottom:32px;
}
@media(min-width:600px){.lib-grid{grid-template-columns:repeat(4,1fr);}}
@media(min-width:900px){.lib-grid{grid-template-columns:repeat(6,1fr);gap:12px;}}

/* ── CARD ── */
.lib-card{border:1px solid var(--card-border);border-radius:12px;overflow:hidden;cursor:pointer;transition:all .18s;background:var(--card-bg);display:flex;flex-direction:column;}
.lib-card:hover{border-color:var(--fg3);transform:translateY(-2px);box-shadow:0 6px 20px rgba(0,0,0,.3);}
.lib-poster{width:100%;aspect-ratio:3/4;background:var(--poster-bg);position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden;}
.lib-poster-letter{font-family:var(--font-my);font-size:28px;font-weight:700;color:var(--poster-letter);}
.lib-poster img{width:100%;height:100%;object-fit:cover;}
.lib-badge{position:absolute;top:6px;left:6px;padding:2px 7px;border-radius:5px;font-family:var(--font-my);font-size:9px;font-weight:600;background:var(--badge-bg);color:#fff;backdrop-filter:blur(4px);}
.card-clap{position:absolute;bottom:6px;right:6px;display:flex;align-items:center;gap:2px;background:var(--clap-bg);border-radius:99px;padding:2px 7px;font-size:10px;font-weight:600;color:var(--clap-fg);cursor:pointer;border:none;transition:all .15s;backdrop-filter:blur(4px);}
.card-clap:hover{filter:brightness(1.1);}
.card-clap.clapped{background:var(--red);color:#fff;}
.lib-body{padding:8px 10px;}
.lib-title{font-size:11px;font-weight:600;color:var(--fg);margin-bottom:2px;line-height:1.5;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.lib-author{font-size:10px;color:var(--fg3);line-height:1.6;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

/* ── DETAIL POPUP ── */
.popup-ov{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(4px);z-index:300;display:none;align-items:flex-end;justify-content:center;}
.popup-ov.on{display:flex;}
.popup-card{background:var(--popup-bg);border:1px solid var(--border);border-radius:20px 20px 0 0;width:100%;max-width:640px;padding:24px 24px 40px;animation:slideUp .3s cubic-bezier(.34,1.2,.64,1);}
@keyframes slideUp{from{transform:translateY(100%);opacity:0}to{transform:translateY(0);opacity:1}}
.popup-handle{width:40px;height:4px;background:var(--border);border-radius:2px;margin:0 auto 20px;}
.popup-cover-row{display:flex;gap:16px;margin-bottom:20px;}
.popup-cover{width:80px;height:106px;border-radius:10px;background:var(--poster-bg);flex-shrink:0;display:flex;align-items:center;justify-content:center;overflow:hidden;font-size:28px;font-weight:700;color:var(--poster-letter);font-family:var(--font-my);}
.popup-cover img{width:100%;height:100%;object-fit:cover;}
.popup-meta{flex:1;min-width:0;}
.popup-title{font-size:18px;font-weight:700;color:var(--fg);line-height:1.5;margin-bottom:6px;}
.popup-author{font-size:13px;color:var(--fg2);margin-bottom:8px;line-height:1.6;}
.popup-badges{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px;}
.popup-badge{padding:3px 10px;border-radius:99px;font-size:11px;border:1px solid var(--border);color:var(--fg2);background:var(--bg2);}
.popup-clap{font-size:13px;color:var(--fg2);line-height:1.6;}
.popup-synopsis{font-size:13px;color:var(--fg2);line-height:2.0;margin-bottom:20px;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;}
.popup-actions{display:flex;gap:10px;}
.popup-btn-read{flex:1;padding:13px;border-radius:12px;border:none;background:var(--fg);color:var(--bg);font-family:var(--font-my);font-size:14px;font-weight:600;cursor:pointer;transition:all .15s;line-height:1.6;}
.popup-btn-read:hover{opacity:.85;}
.popup-btn-clap{width:48px;height:48px;border-radius:12px;border:1px solid var(--border);background:var(--bg2);font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s;flex-shrink:0;}
.popup-btn-clap:hover{background:var(--bg);}
.popup-btn-clap.clapped{background:var(--red);border-color:var(--red);}

/* ── STATES ── */
.state-msg{grid-column:1/-1;text-align:center;padding:60px 24px;color:var(--fg3);font-size:14px;line-height:2;}
.spinner{width:24px;height:24px;border:2px solid var(--border);border-top-color:var(--fg);border-radius:50%;animation:spin .7s linear infinite;margin:0 auto 12px;}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── FOOTER ── */
footer{background:var(--bg2);border-top:1px solid var(--border);padding:14px 20px;text-align:center;transition:background .25s,border-color .25s;}
.footer-text{font-family:var(--font-en);font-size:11px;color:var(--fg2);letter-spacing:.5px;}

/* ── TOAST ── */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(40px);background:var(--fg);color:var(--bg);font-family:var(--font-my);font-size:13px;line-height:1.8;padding:10px 18px;border-radius:10px;opacity:0;transition:all .3s cubic-bezier(.34,1.56,.64,1);z-index:9999;pointer-events:none;white-space:nowrap;}
.toast.on{transform:translateX(-50%) translateY(0);opacity:1;}
</style>
</head>
<body>

<nav>
  <div class="nav-inner">
    <a class="brand" href="/home">cine<br><span>podma</span></a>
    <div class="nav-r" id="navR">
      <button class="theme-btn" id="themeBtn" onclick="toggleTheme()" aria-label="Toggle theme">🌙</button>
      <a class="nav-btn red" href="/write">✍ ရေးမည်</a>
    </div>
  </div>
</nav>

<main>
  <div class="page-hdr">
    <h1 class="page-title">Library</h1>
    <div class="page-div"></div>
    <p class="page-sub" id="libSub">CinePodma တွင် ရေးသားထားသော ဝတ္ထုနှင့် ဇာတ်ညွှန်းများ</p>
  </div>

  <div class="search-wrap">
    <span class="search-icon">🔍</span>
    <input class="search-input" id="searchIn" type="text" placeholder="ခေါင်းစဉ်၊ ရေးသားသူ ရှာပါ..." oninput="onSearch(this.value)">
  </div>

  <div class="lib-tabs">
    <button class="lib-tab active" id="tabPodmates" onclick="setTab('podmates',this)">Podmates</button>
    <button class="lib-tab" id="tabAdmin" onclick="setTab('admin',this)">ရုပ်ရှင်ဇာတ်ညွှန်းများ</button>
  </div>

  <div id="pmFilters">
    <div class="filter-row">
      <button class="filter-btn active" onclick="setPmFilter('all',this)">အားလုံး</button>
      <button class="filter-btn" onclick="setPmFilter('feature',this)">🎬 ဇာတ်ညွှန်း</button>
      <button class="filter-btn" onclick="setPmFilter('shortfilm',this)">🎬 ဇာတ်ညွှန်းတို</button>
      <button class="filter-btn" onclick="setPmFilter('series',this)">📺 စီးရီး</button>
      <button class="filter-btn" onclick="setPmFilter('novel',this)">📖 ဝတ္ထု</button>
      <button class="filter-btn" onclick="setPmFilter('short',this)">📄 ဝတ္ထုတို</button>
      <button class="filter-btn" onclick="setPmFilter('poem',this)">🌸 ကဗျာ</button>
      <button class="filter-btn" onclick="setPmFilter('essay',this)">✍ ဆောင်းပါး</button>
    </div>
  </div>

  <div id="adminFilters" style="display:none;">
    <div class="filter-row">
      <button class="filter-btn active" onclick="setAdminFilter('all',this)">အားလုံး</button>
      <button class="filter-btn" onclick="setAdminFilter('mm',this)">🇲🇲 ပြည်တွင်း</button>
      <button class="filter-btn" onclick="setAdminFilter('int',this)">🌐 ပြည်ပ</button>
    </div>
  </div>

  <div class="result-count" id="resultCount"></div>
  <div class="lib-grid" id="libGrid">
    <div class="state-msg"><div class="spinner"></div>ဖွင့်နေသည်...</div>
  </div>
</main>

<!-- DETAIL POPUP -->
<div class="popup-ov" id="detailPopup" onclick="closePopup(event)">
  <div class="popup-card" id="popupCard">
    <div class="popup-handle"></div>
    <div class="popup-cover-row">
      <div class="popup-cover" id="popupCover">?</div>
      <div class="popup-meta">
        <div class="popup-title" id="popupTitle">—</div>
        <div class="popup-author" id="popupAuthor">—</div>
        <div class="popup-badges" id="popupBadges"></div>
        <div class="popup-clap" id="popupClap">👏 0</div>
      </div>
    </div>
    <div class="popup-synopsis" id="popupSynopsis"></div>
    <div class="popup-actions">
      <button class="popup-btn-read" id="popupReadBtn" onclick="goRead()">📖 ဖတ်မည်</button>
      <button class="popup-btn-clap" id="popupClapBtn" onclick="doPopupClap()">👏</button>
    </div>
  </div>
</div>

<footer><span class="footer-text">© 2026 CinePodma. All rights reserved.</span></footer>
<div class="toast" id="toast"></div>

<script>
/* ── THEME ── */
(function(){
  var saved=localStorage.getItem('cp-theme');
  var theme=saved||'dark';
  document.documentElement.setAttribute('data-theme',theme);
  updateThemeBtn(theme);
})();
function updateThemeBtn(t){var b=document.getElementById('themeBtn');if(b)b.textContent=t==='dark'?'☀️':'🌙';}
function toggleTheme(){
  var cur=document.documentElement.getAttribute('data-theme')||'dark';
  var next=cur==='dark'?'light':'dark';
  document.documentElement.setAttribute('data-theme',next);
  localStorage.setItem('cp-theme',next);
  updateThemeBtn(next);
}

/* ── STATE ── */
var curTab='podmates',pmFilter='all',adminFilter='all',searchQ='';
var pmDocs=[],adminDocs=[],currentUser=null,myClaps={};
var activeDoc=null;

var genreLabels={novel:'ဝတ္ထု',short:'ဝတ္ထုတို',essay:'ဆောင်းပါး',poem:'ကဗျာ',feature:'ဇာတ်ညွှန်း',shortfilm:'ဇာတ်ညွှန်းတို',series:'စီးရီး'};
var genreFilters={feature:['feature'],shortfilm:['shortfilm'],series:['series'],novel:['novel'],short:['short'],poem:['poem'],essay:['essay']};

function toast(m){var t=document.getElementById('toast');t.textContent=m;t.classList.add('on');setTimeout(function(){t.classList.remove('on');},2500);}
function esc(s){return(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function getGenreLabel(d){return d.genreLabel||genreLabels[d.genre]||(d.type==='story'?'ဝတ္ထု':'ဇာတ်ညွှန်း');}
function stripHtml(html){if(!html)return '';var tmp=document.createElement('div');tmp.innerHTML=html;return tmp.textContent||tmp.innerText||'';}
function convertCoverUrl(url){
  if(!url)return '';
  if(url.includes('lh3.googleusercontent.com'))return url;
  var m=url.match(/\/file\/d\/([a-zA-Z0-9_-]+)/);if(m)return 'https://lh3.googleusercontent.com/d/'+m[1];
  var m2=url.match(/[?&]id=([a-zA-Z0-9_-]+)/);if(m2)return 'https://lh3.googleusercontent.com/d/'+m2[1];
  var m3=url.match(/uc\?id=([a-zA-Z0-9_-]+)/);if(m3)return 'https://lh3.googleusercontent.com/d/'+m3[1];
  return url;
}

function buildCard(doc){
  var div=document.createElement('div');div.className='lib-card';
  div.onclick=function(){openPopup(doc);};
  var poster=document.createElement('div');poster.className='lib-poster';
  if(doc.coverUrl){
    var img=document.createElement('img');img.src=convertCoverUrl(doc.coverUrl);img.alt=doc.title;
    img.onerror=function(){this.style.display='none';var l=document.createElement('div');l.className='lib-poster-letter';l.textContent=(doc.title||'?').charAt(0);poster.appendChild(l);};
    poster.appendChild(img);
  }else{
    var letter=document.createElement('div');letter.className='lib-poster-letter';letter.textContent=(doc.title||'?').charAt(0);poster.appendChild(letter);
  }
  var badge=document.createElement('div');badge.className='lib-badge';badge.textContent=getGenreLabel(doc);poster.appendChild(badge);
  var clap=document.createElement('button');
  clap.className='card-clap'+(myClaps[doc.id]?' clapped':'');
  clap.innerHTML='👏 '+(doc.clapCount||0);
  clap.onclick=function(e){e.stopPropagation();toggleClap(doc,clap,null);};
  poster.appendChild(clap);
  var body=document.createElement('div');body.className='lib-body';
  var title=document.createElement('div');title.className='lib-title';title.textContent=doc.title||'Untitled';
  var author=document.createElement('div');author.className='lib-author';author.textContent=doc.authorUsername||doc.author||'—';
  body.appendChild(title);body.appendChild(author);
  div.appendChild(poster);div.appendChild(body);
  return div;
}

function openPopup(doc){
  activeDoc=doc;
  var cv=document.getElementById('popupCover');
  if(doc.coverUrl){cv.innerHTML='<img src="'+esc(convertCoverUrl(doc.coverUrl))+'" alt="" onerror="this.parentNode.textContent=(activeDoc?activeDoc.title:\'?\').charAt(0)">';}
  else{cv.textContent=(doc.title||'?').charAt(0);}
  document.getElementById('popupTitle').textContent=doc.title||'Untitled';
  document.getElementById('popupAuthor').textContent=(doc.authorName||doc.author||'—')+(doc.authorUsername?' · '+doc.authorUsername:'');
  document.getElementById('popupBadges').innerHTML='<span class="popup-badge">'+getGenreLabel(doc)+'</span>'+(doc.updatedAt?'<span class="popup-badge">'+doc.updatedAt.substring(0,10)+'</span>':'');
  document.getElementById('popupClap').textContent='👏 '+(doc.clapCount||0);
  document.getElementById('popupSynopsis').textContent=stripHtml(doc.synopsis||doc.logline||'');
  var cb=document.getElementById('popupClapBtn');cb.className='popup-btn-clap'+(myClaps[doc.id]?' clapped':'');
  document.getElementById('popupReadBtn').textContent=doc.pdfUrl?'📄 PDF ဖတ်မည်':'📖 ဖတ်မည်';
  document.getElementById('detailPopup').classList.add('on');
  document.body.style.overflow='hidden';
}
function closePopup(e){
  if(e&&e.target!==document.getElementById('detailPopup'))return;
  document.getElementById('detailPopup').classList.remove('on');
  document.body.style.overflow='';activeDoc=null;
}
window.closePopupBtn=function(){document.getElementById('detailPopup').classList.remove('on');document.body.style.overflow='';activeDoc=null;};
window.goRead=function(){if(!activeDoc)return;if(activeDoc.pdfUrl)window.open(activeDoc.pdfUrl,'_blank');else window.location.href='/read?id='+activeDoc.id;};
window.doPopupClap=async function(){if(!activeDoc)return;await toggleClap(activeDoc,null,document.getElementById('popupClapBtn'));document.getElementById('popupClap').textContent='👏 '+(activeDoc.clapCount||0);};

async function toggleClap(doc,cardBtn,popupBtn){
  var cu=window._currentUser||null;
  if(!cu){toast('👏 Clap လုပ်ရန် Login ဝင်ပါ');return;}
  var isAdmin=!!doc.pdfUrl;
  var clapsCol=isAdmin?'adminDocClaps':'docClaps';
  var docsCol=isAdmin?'adminDocs':'docs';
  try{
    var cRef=window._getRef(clapsCol+'/'+doc.id+'/users/'+cu.uid);
    var snap=await window._getDoc2(cRef);
    if(snap.exists()){
      await window._deleteDoc(cRef);
      if(!isAdmin)try{await window._deleteDoc(window._getRef('userDocClaps/'+cu.uid+'/docs/'+doc.id));}catch(e){}
      var s=await window._getDoc2(window._getRef(docsCol+'/'+doc.id));
      var n=s.exists()?(s.data().clapCount||0):0;
      await window._updateDoc(window._getRef(docsCol+'/'+doc.id),{clapCount:Math.max(0,n-1)});
      doc.clapCount=Math.max(0,n-1);myClaps[doc.id]=false;
      if(cardBtn){cardBtn.className='card-clap';cardBtn.innerHTML='👏 '+doc.clapCount;}
      if(popupBtn)popupBtn.className='popup-btn-clap';
      toast('👏 Clap ဖြုတ်ပြီး');
    }else{
      var now=new Date().toISOString();
      await window._setDoc(cRef,{uid:cu.uid,clappedAt:now});
      if(!isAdmin)try{await window._setDoc(window._getRef('userDocClaps/'+cu.uid+'/docs/'+doc.id),{docId:doc.id,clappedAt:now,type:'podmate'});}catch(e){}
      var s2=await window._getDoc2(window._getRef(docsCol+'/'+doc.id));
      var n2=s2.exists()?(s2.data().clapCount||0):0;
      await window._updateDoc(window._getRef(docsCol+'/'+doc.id),{clapCount:n2+1});
      doc.clapCount=n2+1;myClaps[doc.id]=true;
      if(cardBtn){cardBtn.className='card-clap clapped';cardBtn.innerHTML='👏 '+doc.clapCount;}
      if(popupBtn)popupBtn.className='popup-btn-clap clapped';
      toast('👏 Clap လုပ်ပြီး');
    }
  }catch(e){toast('❌ '+e.message);}
}

function renderGrid(docs){
  var grid=document.getElementById('libGrid');
  document.getElementById('resultCount').textContent=docs.length+' ခု';
  if(!docs.length){grid.innerHTML='<div class="state-msg">ရှာမတွေ့ပါ</div>';return;}
  grid.innerHTML='';
  docs.forEach(function(d){grid.appendChild(buildCard(d));});
}

function applyPm(){
  var docs=pmDocs.slice();
  if(pmFilter!=='all'){var allowed=genreFilters[pmFilter]||[pmFilter];docs=docs.filter(function(d){return allowed.indexOf(d.genre)>-1||allowed.indexOf(d.type)>-1;});}
  if(searchQ)docs=docs.filter(function(d){return(d.title||'').toLowerCase().includes(searchQ)||(d.authorUsername||d.authorName||'').toLowerCase().includes(searchQ);});
  docs.sort(function(a,b){return(b.clapCount||0)-(a.clapCount||0);});
  renderGrid(docs);
}
function applyAdmin(){
  var docs=adminDocs.slice();
  if(adminFilter!=='all')docs=docs.filter(function(d){return d.cat===adminFilter;});
  if(searchQ)docs=docs.filter(function(d){return(d.title||'').toLowerCase().includes(searchQ);});
  docs.sort(function(a,b){return(b.clapCount||0)-(a.clapCount||0);});
  renderGrid(docs);
}
function refresh(){if(curTab==='podmates')applyPm();else applyAdmin();}

function setTab(tab,btn){
  curTab=tab;
  document.querySelectorAll('.lib-tab').forEach(function(b){b.classList.remove('active');});
  btn.classList.add('active');
  document.getElementById('pmFilters').style.display=tab==='podmates'?'':'none';
  document.getElementById('adminFilters').style.display=tab==='admin'?'':'none';
  document.getElementById('libSub').textContent=tab==='podmates'?'CinePodma တွင် ရေးသားထားသော ဝတ္ထုနှင့် ဇာတ်ညွှန်းများ':'မြန်မာ့ရုပ်ရှင်အပါအဝင် နိုင်ငံတကာရုပ်ရှင်များ၏ ဇာတ်ညွှန်းများ';
  if(tab==='admin'&&adminDocs.length===0)loadAdminDocs();else refresh();
}
function setPmFilter(f,btn){pmFilter=f;document.querySelectorAll('#pmFilters .filter-btn').forEach(function(b){b.classList.remove('active');});btn.classList.add('active');applyPm();}
function setAdminFilter(f,btn){adminFilter=f;document.querySelectorAll('#adminFilters .filter-btn').forEach(function(b){b.classList.remove('active');});btn.classList.add('active');applyAdmin();}
function onSearch(q){searchQ=q.toLowerCase().trim();refresh();}
document.addEventListener('keydown',function(e){if(e.key==='Escape')closePopupBtn();});

async function loadAdminDocs(){
  var grid=document.getElementById('libGrid');
  grid.innerHTML='<div class="state-msg"><div class="spinner"></div>ဖွင့်နေသည်...</div>';
  try{
    var snap=await window._adminDocsSnap();
    adminDocs=[];
    snap.forEach(function(d){var dt=d.data();adminDocs.push({id:d.id,cat:dt.cat||'int',type:'screenplay',title:dt.title||'Untitled',author:dt.author||'',genreLabel:dt.genreLabel||'ဇာတ်ညွှန်း',pdfUrl:dt.pdfUrl||'',coverUrl:dt.coverUrl||'',synopsis:dt.synopsis||'',clapCount:dt.clapCount||0});});
    var cu=window._currentUser||null;
    if(cu&&window._adminClapSnap){for(var i=0;i<adminDocs.length;i++){try{var cs=await window._adminClapSnap(adminDocs[i].id,cu.uid);if(cs.exists())myClaps[adminDocs[i].id]=true;}catch(e){}}}
    applyAdmin();
  }catch(e){grid.innerHTML='<div class="state-msg">ဖွင့်မရပါ — '+e.message+'</div>';}
}
</script>

<script type="module">

const app=initializeApp({apiKey:"AIzaSyB_fBWLeXjzTjWLQyZjz0SmRfzIpJTtfYw",authDomain:"cinepodma.firebaseapp.com",projectId:"cinepodma",storageBucket:"cinepodma.firebasestorage.app",messagingSenderId:"587916526322",appId:"1:587916526322:web:d00775311fb92fa1c8466b"});
const auth=getAuth(app);const db=getFirestore(app);

window._getRef=function(path){var p=path.split('/');return doc(db,...p);};
window._getDoc2=function(r){return getDoc(r);};
window._setDoc=function(r,d){return setDoc(r,d);};
window._deleteDoc=function(r){return deleteDoc(r);};
window._updateDoc=function(r,d){return updateDoc(r,d);};
window._adminDocsSnap=function(){return getDocs(query(collection(db,'adminDocs'),orderBy('createdAt','desc')));};
window._adminClapSnap=function(docId,uid){return getDoc(doc(db,'adminDocClaps',docId,'users',uid));};

  }else{
    navR.innerHTML=themeHtml+'<a class="nav-btn red" href="/write">✍ ရေးမည်</a>';
  }
});

async function loadDocs(){
  try{
    var q=query(collection(db,'docs'),where('privacy','==','public'),limit(100));
    var snap=await getDocs(q);
    pmDocs=[];
    snap.forEach(function(d){var data=d.data();pmDocs.push({id:d.id,title:data.title||'Untitled',type:data.type||'screenplay',genre:data.genre||'',genreLabel:data.genreLabel||'',authorName:data.authorName||'',authorUsername:data.authorUsername||'',coverUrl:data.coverUrl||'',clapCount:data.clapCount||0,updatedAt:data.updatedAt||'',uid:data.uid||'',synopsis:data.synopsis||data.logline||data.story||''});});
    var cu=window._currentUser||null;
    if(cu){for(var i=0;i<Math.min(pmDocs.length,50);i++){try{var cs=await getDoc(doc(db,'docClaps',pmDocs[i].id,'users',cu.uid));if(cs.exists())myClaps[pmDocs[i].id]=true;}catch(e){}}}
    applyPm();
  }catch(e){document.getElementById('libGrid').innerHTML='<div class="state-msg">ဖွင့်မရပါ — '+e.message+'</div>';}
}
loadDocs();
</script>
