<!DOCTYPE html>
<html lang="my">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Library — CinePodma</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Noto+Sans+Myanmar:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --white:#FFFFFF;--black:#0A0A0A;
  --slate:#6B7280;--slate-lt:#9CA3AF;--slate-bg:#F3F4F6;
  --border:#E5E7EB;--red:#DC2626;--red-h:#B91C1C;
  --font-en:'Special Elite','Courier New',monospace;
  --font-my:'Noto Sans Myanmar',sans-serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;}
body{font-family:var(--font-my);background:var(--white);color:var(--black);min-height:100vh;display:flex;flex-direction:column;-webkit-font-smoothing:antialiased;}

/* NAV */
nav{position:fixed;top:0;left:0;right:0;z-index:100;display:flex;align-items:center;justify-content:space-between;padding:14px 24px;background:rgba(255,255,255,.95);backdrop-filter:blur(8px);border-bottom:1px solid var(--border);}
.brand{font-family:var(--font-en);font-size:13px;color:var(--black);text-decoration:none;line-height:1.3;}
.brand span{display:block;color:var(--slate);font-size:11px;letter-spacing:1px;}
.nav-r{display:flex;align-items:center;gap:8px;}
.nav-btn{padding:7px 14px;border-radius:10px;border:1px solid var(--border);background:transparent;font-family:var(--font-my);font-size:12px;color:var(--slate);cursor:pointer;text-decoration:none;transition:all .15s;line-height:1.6;}
.nav-btn:hover{background:var(--slate-bg);color:var(--black);}
.nav-btn.red{background:var(--red);color:var(--white);border-color:var(--red);}
.nav-btn.red:hover{background:var(--red-h);}
.nav-user-av{width:32px;height:32px;border-radius:50%;background:var(--slate-bg);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:14px;overflow:hidden;cursor:pointer;text-decoration:none;}
.nav-user-av img{width:100%;height:100%;object-fit:cover;}

/* MAIN */
main{flex:1;padding:80px 24px 60px;max-width:960px;margin:0 auto;width:100%;}

/* HEADER */
.page-hdr{margin-bottom:24px;}
.page-title{font-family:var(--font-en);font-size:28px;letter-spacing:.5px;color:var(--black);margin-bottom:4px;}
.page-div{width:40px;height:2px;background:var(--red);border-radius:2px;margin-bottom:6px;}
.page-sub{font-size:13px;color:var(--slate);line-height:1.8;}

/* SEARCH */
.search-wrap{position:relative;margin-bottom:16px;}
.search-icon{position:absolute;left:14px;top:50%;transform:translateY(-50%);font-size:15px;color:var(--slate-lt);pointer-events:none;}
.search-input{width:100%;padding:11px 16px 11px 42px;border:1.5px solid var(--border);border-radius:99px;font-family:var(--font-my);font-size:14px;color:var(--black);outline:none;transition:border-color .15s;line-height:1.8;background:var(--white);}
.search-input:focus{border-color:var(--black);}

/* TABS */
.lib-tabs{display:flex;border-bottom:1px solid var(--border);margin-bottom:20px;overflow-x:auto;scrollbar-width:none;}
.lib-tabs::-webkit-scrollbar{display:none;}
.lib-tab{padding:12px 20px;border:none;background:transparent;font-family:var(--font-my);font-size:14px;color:var(--slate);cursor:pointer;border-bottom:2px solid transparent;transition:all .15s;white-space:nowrap;line-height:1.6;}
.lib-tab:hover{color:var(--black);}
.lib-tab.active{color:var(--black);border-bottom-color:var(--red);font-weight:600;}

/* FILTER */
.filter-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px;}
.filter-btn{padding:6px 14px;border-radius:99px;border:1.5px solid var(--border);background:var(--white);font-family:var(--font-my);font-size:12px;color:var(--slate);cursor:pointer;transition:all .15s;line-height:1.8;white-space:nowrap;}
.filter-btn:hover,.filter-btn.active{background:var(--black);border-color:var(--black);color:var(--white);}

/* SORT */
.sort-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:8px;}
.result-count{font-family:var(--font-en);font-size:11px;color:var(--slate-lt);letter-spacing:.3px;}
.sort-btns{display:flex;gap:4px;}
.sort-btn{padding:5px 12px;border-radius:6px;border:1px solid var(--border);background:var(--white);font-family:var(--font-en);font-size:11px;color:var(--slate);cursor:pointer;transition:all .12s;letter-spacing:.3px;}
.sort-btn.active{background:var(--black);color:var(--white);border-color:var(--black);}

/* GRID */
.lib-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:16px;margin-bottom:32px;}

/* CARD */
.lib-card{border:1px solid var(--border);border-radius:14px;overflow:hidden;cursor:pointer;transition:all .18s;background:var(--white);text-decoration:none;color:var(--black);display:flex;flex-direction:column;}
.lib-card:hover{border-color:#CCC;transform:translateY(-3px);box-shadow:0 8px 24px rgba(0,0,0,.08);}

/* Poster — shorter vertical */
.lib-poster{width:100%;aspect-ratio:3/4;background:#F0F0F0;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden;}
.lib-poster-letter{font-family:var(--font-my);font-size:36px;font-weight:700;color:#C0C0C0;}
.lib-poster img{width:100%;height:100%;object-fit:cover;}

/* Genre badge */
.lib-badge{position:absolute;top:8px;left:8px;padding:3px 8px;border-radius:6px;font-family:var(--font-my);font-size:10px;font-weight:600;background:rgba(0,0,0,.65);color:var(--white);backdrop-filter:blur(4px);}

/* Clap on card */
.card-clap{position:absolute;bottom:8px;right:8px;display:flex;align-items:center;gap:3px;background:rgba(255,255,255,.92);border-radius:99px;padding:3px 8px;font-size:11px;font-weight:600;color:var(--black);cursor:pointer;border:none;transition:all .15s;backdrop-filter:blur(4px);}
.card-clap:hover{background:var(--white);transform:scale(1.05);}
.card-clap.clapped{background:var(--red);color:var(--white);}

/* Card body */
.lib-body{padding:10px 12px;flex:1;}
.lib-title{font-size:13px;font-weight:600;color:var(--black);margin-bottom:3px;line-height:1.5;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.lib-author{font-size:11px;color:var(--slate-lt);line-height:1.6;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

/* EMPTY / LOADING */
.state-msg{grid-column:1/-1;text-align:center;padding:60px 24px;color:var(--slate-lt);font-size:14px;line-height:2;}
.spinner{width:24px;height:24px;border:2px solid var(--border);border-top-color:var(--black);border-radius:50%;animation:spin .7s linear infinite;margin:0 auto 12px;}
@keyframes spin{to{transform:rotate(360deg)}}

/* TOAST */
.toast{position:fixed;bottom:24px;right:20px;background:var(--black);color:var(--white);font-family:var(--font-my);font-size:13px;line-height:1.8;padding:10px 18px;border-radius:10px;transform:translateY(40px);opacity:0;transition:all .3s cubic-bezier(.34,1.56,.64,1);z-index:9999;pointer-events:none;}
.toast.on{transform:translateY(0);opacity:1;}

/* FOOTER */
footer{background:var(--slate-bg);border-top:1px solid var(--border);padding:16px 28px;text-align:center;}
.footer-text{font-family:var(--font-en);font-size:11px;color:var(--slate);letter-spacing:.5px;}

@media(max-width:600px){
  main{padding:72px 12px 48px;}
  .lib-grid{grid-template-columns:repeat(2,1fr);gap:10px;}
}
</style>
</head>
<body>

<nav>
  <a class="brand" href="/home">cine<br><span>podma</span></a>
  <div class="nav-r" id="navR">
    <a class="nav-btn" href="/write">✍ ရေးမည်</a>
  </div>
</nav>

<main>
  <div class="page-hdr">
    <h1 class="page-title">Library</h1>
    <div class="page-div"></div>
    <p class="page-sub" id="libSub">ဇာတ်ညွှန်းနှင့် ဝတ္ထုများ — အားလုံး အခမဲ့ဖတ်ရှုနိုင်</p>
  </div>

  <div class="search-wrap">
    <span class="search-icon">🔍</span>
    <input class="search-input" id="searchIn" type="text" placeholder="ခေါင်းစဉ်၊ ရေးသားသူ ရှာပါ..." oninput="onSearch(this.value)">
  </div>

  <div class="lib-tabs">
    <button class="lib-tab active" id="tabPodmates" onclick="setTab('podmates',this)">Podmates</button>
    <button class="lib-tab" id="tabAdmin" onclick="setTab('admin',this)">ပြည်တွင်း / ပြည်ပ</button>
  </div>

  <!-- Podmates filters -->
  <div id="pmFilters">
    <div class="filter-row">
      <button class="filter-btn active" onclick="setPmFilter('all',this)">အားလုံး</button>
      <button class="filter-btn" onclick="setPmFilter('screenplay',this)">🎬 ဇာတ်ညွှန်း</button>
      <button class="filter-btn" onclick="setPmFilter('story',this)">📖 ဝတ္ထု</button>
    </div>
  </div>

  <!-- Admin filters -->
  <div id="adminFilters" style="display:none;">
    <div class="filter-row">
      <button class="filter-btn active" onclick="setAdminFilter('all',this)">အားလုံး</button>
      <button class="filter-btn" onclick="setAdminFilter('mm',this)">🇲🇲 ပြည်တွင်း</button>
      <button class="filter-btn" onclick="setAdminFilter('int',this)">🌐 ပြည်ပ</button>
    </div>
  </div>

  <div class="sort-row">
    <span class="result-count" id="resultCount"></span>
    <div class="sort-btns">
      <button class="sort-btn active" onclick="setSort('newest',this)">Newest</button>
      <button class="sort-btn" onclick="setSort('title',this)">A–Z</button>
      <button class="sort-btn" onclick="setSort('claps',this)">👏 Claps</button>
    </div>
  </div>

  <div class="lib-grid" id="libGrid">
    <div class="state-msg"><div class="spinner"></div>ဖွင့်နေသည်...</div>
  </div>
</main>

<footer><span class="footer-text">© 2026 CinePodma. All rights reserved.</span></footer>
<div class="toast" id="toast"></div>

<script>
/* STATE */
var curTab='podmates', pmFilter='all', adminFilter='all', sortBy='newest', searchQ='';
var pmDocs=[], currentUser=null;
var myClaps={}; /* docId → true */

var genreLabels={
  novel:'ဝတ္ထု', short:'ဝတ္ထုတို', essay:'ဆောင်းပါး', poem:'ကဗျာ',
  feature:'ဇာတ်ညွှန်း', shortfilm:'ဇာတ်ညွှန်းတို', series:'စီးရီး'
};

var adminDocs=[
  {id:'ad1',cat:'mm',type:'screenplay',title:'နမူနာဇာတ်ညွှန်း',author:'Admin',genreLabel:'ဇာတ်ညွှန်း',clapCount:0},
  {id:'ad2',cat:'int',type:'screenplay',title:'Parasite',author:'Bong Joon-ho',genreLabel:'ဇာတ်ညွှန်း',clapCount:0},
  {id:'ad3',cat:'int',type:'screenplay',title:'Pulp Fiction',author:'Quentin Tarantino',genreLabel:'ဇာတ်ညွှန်း',clapCount:0},
];

function toast(m){var t=document.getElementById('toast');t.textContent=m;t.classList.add('on');setTimeout(function(){t.classList.remove('on');},2500);}

/* GENRE LABEL */
function getGenreLabel(d){
  if(d.genreLabel) return d.genreLabel;
  if(d.genre && genreLabels[d.genre]) return genreLabels[d.genre];
  return d.type==='story'?'ဝတ္ထု':'ဇာတ်ညွှန်း';
}

/* BUILD CARD */
function buildCard(doc){
  var a=document.createElement('a');
  a.className='lib-card';
  a.href='/read?id='+doc.id;

  var poster=document.createElement('div');poster.className='lib-poster';

  if(doc.coverUrl){
    var img=document.createElement('img');img.src=doc.coverUrl;img.alt=doc.title;
    poster.appendChild(img);
  } else {
    var letter=document.createElement('div');letter.className='lib-poster-letter';
    letter.textContent=(doc.title||'?').charAt(0);
    poster.appendChild(letter);
  }

  /* genre badge */
  var badge=document.createElement('div');badge.className='lib-badge';
  badge.textContent=getGenreLabel(doc);
  poster.appendChild(badge);

  /* clap button — check myClaps state */
  var isClapped = myClaps[doc.id] ? true : false;
  var clap=document.createElement('button');
  clap.className='card-clap'+(isClapped?' clapped':'');
  clap.innerHTML='👏 '+(doc.clapCount||0);
  clap.onclick=function(e){e.preventDefault();e.stopPropagation();toggleDocClap(doc,clap);};
  poster.appendChild(clap);

  var body=document.createElement('div');body.className='lib-body';
  var title=document.createElement('div');title.className='lib-title';title.textContent=doc.title||'Untitled';
  var author=document.createElement('div');author.className='lib-author';
  author.textContent=doc.authorUsername||doc.author||'—';
  body.appendChild(title);body.appendChild(author);

  a.appendChild(poster);a.appendChild(body);
  return a;
}

/* RENDER */
function renderGrid(docs){
  var grid=document.getElementById('libGrid');
  document.getElementById('resultCount').textContent=docs.length+' ခု';
  if(docs.length===0){grid.innerHTML='<div class="state-msg">ရှာမတွေ့ပါ</div>';return;}
  grid.innerHTML='';
  docs.forEach(function(d){grid.appendChild(buildCard(d));});
}

/* FILTER + SORT */
function applyPm(){
  var docs=pmDocs.slice();
  if(pmFilter!=='all') docs=docs.filter(function(d){return d.type===pmFilter;});
  if(searchQ) docs=docs.filter(function(d){
    var t=(d.title||'').toLowerCase();var a=(d.authorUsername||d.authorName||'').toLowerCase();
    return t.includes(searchQ)||a.includes(searchQ);
  });
  if(sortBy==='newest') docs.sort(function(a,b){return (b.updatedAt||'').localeCompare(a.updatedAt||'');});
  else if(sortBy==='title') docs.sort(function(a,b){return(a.title||'').localeCompare(b.title||'');});
  else if(sortBy==='claps') docs.sort(function(a,b){return(b.clapCount||0)-(a.clapCount||0);});
  renderGrid(docs);
}

function applyAdmin(){
  var docs=adminDocs.slice();
  if(adminFilter!=='all') docs=docs.filter(function(d){return d.cat===adminFilter;});
  if(searchQ) docs=docs.filter(function(d){
    return (d.title||'').toLowerCase().includes(searchQ)||(d.author||'').toLowerCase().includes(searchQ);
  });
  if(sortBy==='title') docs.sort(function(a,b){return(a.title||'').localeCompare(b.title||'');});
  renderGrid(docs);
}

function refresh(){if(curTab==='podmates')applyPm();else applyAdmin();}

/* CONTROLS */
function setTab(tab,btn){
  curTab=tab;
  document.querySelectorAll('.lib-tab').forEach(function(b){b.classList.remove('active');});
  btn.classList.add('active');
  document.getElementById('pmFilters').style.display=tab==='podmates'?'':'none';
  document.getElementById('adminFilters').style.display=tab==='admin'?'':'none';
  refresh();
}
function setPmFilter(f,btn){pmFilter=f;document.querySelectorAll('#pmFilters .filter-btn').forEach(function(b){b.classList.remove('active');});btn.classList.add('active');applyPm();}
function setAdminFilter(f,btn){adminFilter=f;document.querySelectorAll('#adminFilters .filter-btn').forEach(function(b){b.classList.remove('active');});btn.classList.add('active');applyAdmin();}
function setSort(s,btn){sortBy=s;document.querySelectorAll('.sort-btn').forEach(function(b){b.classList.remove('active');});btn.classList.add('active');refresh();}
function onSearch(q){searchQ=q.toLowerCase().trim();refresh();}

/* CLAP */
async function toggleDocClap(doc, btn){
  if(!currentUser){ toast('👏 Clap လုပ်ရန် အကောင့်ဝင်ပါ'); return; }
  var docId=doc.id;
  try{
    var clapRef    =window._getRef('docClaps/'+docId+'/users/'+currentUser.uid);
    /* clapping collection — key = docId so profile can find it */
    var clappingRef=window._getRef('clapping/'+currentUser.uid+'/users/'+docId);
    var snap=await window._getDoc2(clapRef);
    if(snap.exists()){
      await window._deleteDoc(clapRef);
      try{await window._deleteDoc(clappingRef);}catch(e){}
      try{
        var docRef2=window._getRef('docs/'+docId);
        var docSnap2=await window._getDoc2(docRef2);
        var cur=docSnap2.exists()?(docSnap2.data().clapCount||0):0;
        await window._updateDoc(docRef2,{clapCount:Math.max(0,cur-1)});
      }catch(e){console.error('clapCount decrement:',e);}
      myClaps[docId]=false;
      doc.clapCount=Math.max(0,(doc.clapCount||1)-1);
      btn.className='card-clap';
      toast('👏 Clap ဖြုတ်ပြီး');
    }else{
      var now=new Date().toISOString();
      await window._setDoc(clapRef,{uid:currentUser.uid,clappedAt:now});
      await window._setDoc(clappingRef,{docId:docId,clappedAt:now});
      /* update clapCount — setDoc merge to ensure field exists first */
      try{
        var docRef=window._getRef('docs/'+docId);
        var docSnap=await window._getDoc2(docRef);
        var currentCount=docSnap.exists()?(docSnap.data().clapCount||0):0;
        await window._updateDoc(docRef,{clapCount:currentCount+1});
      }catch(e){console.error('clapCount update:',e);}
      myClaps[docId]=true;
      doc.clapCount=(doc.clapCount||0)+1;
      btn.className='card-clap clapped';
      toast('👏 Clap လုပ်ပြီး');
    }
    btn.innerHTML='👏 '+doc.clapCount;
  }catch(e){toast('❌ Error: '+e.message);console.error(e);}
}
</script>

<!-- FIREBASE -->
<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js';
import { getAuth, onAuthStateChanged }
  from 'https://www.gstatic.com/firebasejs/12.13.0/firebase-auth.js';
import { getFirestore, collection, query, where, orderBy, limit, getDocs,
         doc, getDoc, setDoc, deleteDoc, updateDoc, increment }
  from 'https://www.gstatic.com/firebasejs/12.13.0/firebase-firestore.js';

const firebaseConfig={
  apiKey:"AIzaSyB_fBWLeXjzTjWLQyZjz0SmRfzIpJTtfYw",
  authDomain:"cinepodma.firebaseapp.com",
  projectId:"cinepodma",
  storageBucket:"cinepodma.firebasestorage.app",
  messagingSenderId:"587916526322",
  appId:"1:587916526322:web:d00775311fb92fa1c8466b"
};

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getFirestore(app);

/* expose helpers */
window._db = db;
window._getRef = function(path){
  var parts = path.split('/');
  return doc(db, ...parts);
};
window._getDoc2  = function(ref){ return getDoc(ref); };
window._setDoc   = function(ref,data){ return setDoc(ref,data); };
window._deleteDoc= function(ref){ return deleteDoc(ref); };
window._updateDoc= function(ref,data){ return updateDoc(ref,data); };
window._inc      = increment;

/* nav auth state */
onAuthStateChanged(auth,async function(user){
  currentUser=user;
  var navR=document.getElementById('navR');
  if(user){
    var usnap=await getDoc(doc(db,'users',user.uid));
    var av=usnap.exists()&&usnap.data().avatar?'<img src="'+usnap.data().avatar+'" alt="">':'👤';
    navR.innerHTML=
      '<a class="nav-user-av" href="/profile">'+av+'</a>'+
      '<a class="nav-btn red" href="/write">✍ ရေးမည်</a>';
    /* load my claps */
    loadMyClaps(user.uid);
  } else {
    navR.innerHTML='<a class="nav-btn" href="/write">✍ ရေးမည်</a>';
  }
});

/* load my clapped docs */
async function loadMyClaps(uid){
  /* we'll check per-doc when needed — lazy */
}

/* load public docs */
async function loadDocs(){
  try{
    var q=query(collection(db,'docs'),where('privacy','==','public'),orderBy('updatedAt','desc'),limit(100));
    var snap=await getDocs(q);
    pmDocs=[];
    snap.forEach(function(d){
      var data=d.data();
      pmDocs.push({
        id:d.id,
        title:data.title||'Untitled',
        type:data.type||'screenplay',
        genre:data.genre||'',
        genreLabel:data.genreLabel||'',
        authorName:data.authorName||'',
        authorUsername:data.authorUsername||'',
        coverUrl:data.coverUrl||'',
        clapCount:data.clapCount||0,
        updatedAt:data.updatedAt||''
      });
    });
    /* if logged in — load which ones I clapped */
    if(currentUser){
      await loadMyClapsForDocs(pmDocs.map(function(d){return d.id;}));
    }
    document.getElementById('libSub').textContent=
      'Podmates '+pmDocs.length+' ဦး၏ ရေးသားချက်များ';
    applyPm();
  }catch(e){
    console.error('loadDocs',e);
    document.getElementById('libGrid').innerHTML=
      '<div class="state-msg">ဖွင့်မရပါ — '+e.message+'</div>';
  }
}

/* load my clapped docs and restore clap state */
async function loadMyClapsForDocs(docIds){
  if(!currentUser) return;
  for(var i=0;i<Math.min(docIds.length,100);i++){
    try{
      var snap=await window._getDoc2(window._getRef('docClaps/'+docIds[i]+'/users/'+currentUser.uid));
      if(snap.exists()) myClaps[docIds[i]]=true;
    }catch(e){}
  }
  /* re-render to update clap button states */
  refresh();
}

loadDocs();
</script>
</body>
</html>
