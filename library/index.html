<!DOCTYPE html>
<html lang="my">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Library — CinePodma</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Noto+Sans+Myanmar:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --white:#FFFFFF;--black:#0A0A0A;
  --slate:#6B7280;--slate-lt:#9CA3AF;--slate-bg:#F3F4F6;
  --border:#E5E7EB;--red:#DC2626;--red-h:#B91C1C;
  --font-en:'Special Elite','Courier New',monospace;
  --font-my:'Noto Sans Myanmar',sans-serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;}
body{font-family:var(--font-my);background:var(--white);color:var(--black);min-height:100vh;display:flex;flex-direction:column;-webkit-font-smoothing:antialiased;}

/* NAV */
nav{position:fixed;top:0;left:0;right:0;z-index:200;display:flex;align-items:center;justify-content:space-between;padding:12px 20px;background:rgba(255,255,255,.95);backdrop-filter:blur(8px);border-bottom:1px solid var(--border);}
.brand{font-family:var(--font-en);font-size:13px;color:var(--black);text-decoration:none;line-height:1.3;}
.brand span{display:block;color:var(--slate);font-size:11px;letter-spacing:1px;}
.nav-r{display:flex;align-items:center;gap:8px;}
.nav-btn{padding:7px 14px;border-radius:10px;border:1px solid var(--border);background:transparent;font-family:var(--font-my);font-size:12px;color:var(--slate);cursor:pointer;text-decoration:none;transition:all .15s;line-height:1.6;}
.nav-btn:hover{background:var(--slate-bg);color:var(--black);}
.nav-btn.red{background:var(--red);color:var(--white);border-color:var(--red);}
.nav-btn.red:hover{background:var(--red-h);}
.nav-user-av{width:32px;height:32px;border-radius:50%;background:var(--slate-bg);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:14px;overflow:hidden;cursor:pointer;text-decoration:none;}
.nav-user-av img{width:100%;height:100%;object-fit:cover;}

/* MAIN */
main{flex:1;padding:76px 16px 60px;max-width:960px;margin:0 auto;width:100%;}

/* HEADER */
.page-hdr{margin-bottom:20px;}
.page-title{font-family:var(--font-en);font-size:28px;letter-spacing:.5px;color:var(--black);margin-bottom:4px;}
.page-div{width:40px;height:2px;background:var(--red);border-radius:2px;margin-bottom:6px;}
.page-sub{font-size:13px;color:var(--slate);line-height:1.8;}

/* SEARCH */
.search-wrap{position:relative;margin-bottom:14px;}
.search-icon{position:absolute;left:14px;top:50%;transform:translateY(-50%);font-size:15px;color:var(--slate-lt);pointer-events:none;}
.search-input{width:100%;padding:10px 16px 10px 42px;border:1.5px solid var(--border);border-radius:99px;font-family:var(--font-my);font-size:14px;color:var(--black);outline:none;transition:border-color .15s;line-height:1.8;background:var(--white);}
.search-input:focus{border-color:var(--black);}

/* TABS */
.lib-tabs{display:flex;border-bottom:1px solid var(--border);margin-bottom:16px;overflow-x:auto;scrollbar-width:none;}
.lib-tabs::-webkit-scrollbar{display:none;}
.lib-tab{padding:10px 18px;border:none;background:transparent;font-family:var(--font-my);font-size:14px;color:var(--slate);cursor:pointer;border-bottom:2px solid transparent;transition:all .15s;white-space:nowrap;line-height:1.6;flex-shrink:0;}
.lib-tab:hover{color:var(--black);}
.lib-tab.active{color:var(--black);border-bottom-color:var(--red);font-weight:600;}

/* FILTER */
.filter-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px;}
.filter-btn{padding:5px 12px;border-radius:99px;border:1.5px solid var(--border);background:var(--white);font-family:var(--font-my);font-size:11px;color:var(--slate);cursor:pointer;transition:all .15s;line-height:1.8;white-space:nowrap;}
.filter-btn:hover,.filter-btn.active{background:var(--black);border-color:var(--black);color:var(--white);}

/* COUNT */
.result-count{font-family:var(--font-en);font-size:11px;color:var(--slate-lt);letter-spacing:.3px;margin-bottom:12px;}

/* 3-COL GRID */
.lib-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:32px;}

/* CARD */
.lib-card{border:1px solid var(--border);border-radius:12px;overflow:hidden;cursor:pointer;transition:all .18s;background:var(--white);display:flex;flex-direction:column;}
.lib-card:hover{border-color:#CCC;transform:translateY(-2px);box-shadow:0 6px 18px rgba(0,0,0,.08);}
.lib-poster{width:100%;aspect-ratio:3/4;background:#F0F0F0;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden;}
.lib-poster-letter{font-family:var(--font-my);font-size:28px;font-weight:700;color:#C0C0C0;}
.lib-poster img{width:100%;height:100%;object-fit:cover;}
.lib-badge{position:absolute;top:6px;left:6px;padding:2px 7px;border-radius:5px;font-family:var(--font-my);font-size:9px;font-weight:600;background:rgba(0,0,0,.7);color:var(--white);backdrop-filter:blur(4px);}
.card-clap{position:absolute;bottom:6px;right:6px;display:flex;align-items:center;gap:2px;background:rgba(255,255,255,.92);border-radius:99px;padding:2px 7px;font-size:10px;font-weight:600;color:var(--black);cursor:pointer;border:none;transition:all .15s;backdrop-filter:blur(4px);}
.card-clap:hover{background:var(--white);}
.card-clap.clapped{background:var(--red);color:var(--white);}
.lib-body{padding:8px 10px;}
.lib-title{font-size:11px;font-weight:600;color:var(--black);margin-bottom:2px;line-height:1.5;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.lib-author{font-size:10px;color:var(--slate-lt);line-height:1.6;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

/* DETAIL POPUP */
.popup-ov{position:fixed;inset:0;background:rgba(0,0,0,.5);backdrop-filter:blur(4px);z-index:300;display:none;align-items:flex-end;justify-content:center;}
.popup-ov.on{display:flex;}
.popup-card{background:var(--white);border-radius:20px 20px 0 0;width:100%;max-width:640px;padding:24px 24px 40px;animation:slideUp .3s cubic-bezier(.34,1.2,.64,1);}
@keyframes slideUp{from{transform:translateY(100%);opacity:0}to{transform:translateY(0);opacity:1}}
.popup-handle{width:40px;height:4px;background:var(--border);border-radius:2px;margin:0 auto 20px;}
.popup-cover-row{display:flex;gap:16px;margin-bottom:20px;}
.popup-cover{width:80px;height:106px;border-radius:10px;background:#F0F0F0;flex-shrink:0;display:flex;align-items:center;justify-content:center;overflow:hidden;font-size:28px;font-weight:700;color:#C0C0C0;font-family:var(--font-my);}
.popup-cover img{width:100%;height:100%;object-fit:cover;}
.popup-meta{flex:1;min-width:0;}
.popup-title{font-size:18px;font-weight:700;color:var(--black);line-height:1.5;margin-bottom:6px;}
.popup-author{font-size:13px;color:var(--slate);margin-bottom:8px;line-height:1.6;}
.popup-badges{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px;}
.popup-badge{padding:3px 10px;border-radius:99px;font-size:11px;border:1px solid var(--border);color:var(--slate);background:var(--slate-bg);}
.popup-clap{font-size:13px;color:var(--slate);line-height:1.6;}
.popup-synopsis{font-size:13px;color:var(--slate);line-height:2.0;margin-bottom:20px;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;}
.popup-actions{display:flex;gap:10px;}
.popup-btn-read{flex:1;padding:13px;border-radius:12px;border:none;background:var(--black);color:var(--white);font-family:var(--font-my);font-size:14px;font-weight:600;cursor:pointer;transition:all .15s;line-height:1.6;}
.popup-btn-read:hover{background:#222;}
.popup-btn-clap{width:48px;height:48px;border-radius:12px;border:1px solid var(--border);background:var(--white);font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s;flex-shrink:0;}
.popup-btn-clap:hover{background:var(--slate-bg);}
.popup-btn-clap.clapped{background:var(--red);border-color:var(--red);}

/* LOADING */
.state-msg{grid-column:1/-1;text-align:center;padding:60px 24px;color:var(--slate-lt);font-size:14px;line-height:2;}
.spinner{width:24px;height:24px;border:2px solid var(--border);border-top-color:var(--black);border-radius:50%;animation:spin .7s linear infinite;margin:0 auto 12px;}
@keyframes spin{to{transform:rotate(360deg)}}

/* FOOTER */
footer{background:var(--slate-bg);border-top:1px solid var(--border);padding:14px 20px;text-align:center;}
.footer-text{font-family:var(--font-en);font-size:11px;color:var(--slate);letter-spacing:.5px;}

/* TOAST */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(40px);background:var(--black);color:var(--white);font-family:var(--font-my);font-size:13px;line-height:1.8;padding:10px 18px;border-radius:10px;opacity:0;transition:all .3s cubic-bezier(.34,1.56,.64,1);z-index:9999;pointer-events:none;white-space:nowrap;}
.toast.on{transform:translateX(-50%) translateY(0);opacity:1;}

@media(max-width:480px){
  .lib-grid{gap:8px;}
}
</style>
</head>
<body>

<nav>
  <a class="brand" href="/home">cine<br><span>podma</span></a>
  <div class="nav-r" id="navR">
    <a class="nav-btn red" href="/write">✍ ရေးမည်</a>
  </div>
</nav>

<main>
  <div class="page-hdr">
    <h1 class="page-title">Library</h1>
    <div class="page-div"></div>
    <p class="page-sub" id="libSub">CinePodma တွင် ရေးသားထားသော ဝတ္ထုနှင့် ဇာတ်ညွှန်းများ</p>
  </div>

  <div class="search-wrap">
    <span class="search-icon">🔍</span>
    <input class="search-input" id="searchIn" type="text" placeholder="ခေါင်းစဉ်၊ ရေးသားသူ ရှာပါ..." oninput="onSearch(this.value)">
  </div>

  <div class="lib-tabs">
    <button class="lib-tab active" id="tabPodmates" onclick="setTab('podmates',this)">Podmates</button>
    <button class="lib-tab" id="tabAdmin" onclick="setTab('admin',this)">ရုပ်ရှင်ဇာတ်ညွှန်းများ</button>
  </div>

  <!-- Podmates filters -->
  <div id="pmFilters">
    <div class="filter-row">
      <button class="filter-btn active" onclick="setPmFilter('all',this)">အားလုံး</button>
      <button class="filter-btn" onclick="setPmFilter('feature',this)">🎬 ဇာတ်ညွှန်း</button>
      <button class="filter-btn" onclick="setPmFilter('shortfilm',this)">🎬 ဇာတ်ညွှန်းတို</button>
      <button class="filter-btn" onclick="setPmFilter('series',this)">📺 စီးရီး</button>
      <button class="filter-btn" onclick="setPmFilter('novel',this)">📖 ဝတ္ထု</button>
      <button class="filter-btn" onclick="setPmFilter('short',this)">📄 ဝတ္ထုတို</button>
      <button class="filter-btn" onclick="setPmFilter('poem',this)">🌸 ကဗျာ</button>
      <button class="filter-btn" onclick="setPmFilter('essay',this)">✍ ဆောင်းပါး</button>
    </div>
  </div>

  <!-- Admin filters -->
  <div id="adminFilters" style="display:none;">
    <p style="font-size:12px;color:var(--slate);line-height:1.8;margin-bottom:10px;">မြန်မာ့ရုပ်ရှင်အပါအဝင် နိုင်ငံတကာရုပ်ရှင်များ၏ ဇာတ်ညွှန်းများ</p>
    <div class="filter-row">
      <button class="filter-btn active" onclick="setAdminFilter('all',this)">အားလုံး</button>
      <button class="filter-btn" onclick="setAdminFilter('mm',this)">🇲🇲 ပြည်တွင်း</button>
      <button class="filter-btn" onclick="setAdminFilter('int',this)">🌐 ပြည်ပ</button>
    </div>
  </div>

  <div class="result-count" id="resultCount"></div>
  <div class="lib-grid" id="libGrid">
    <div class="state-msg"><div class="spinner"></div>ဖွင့်နေသည်...</div>
  </div>
</main>

<!-- DETAIL POPUP -->
<div class="popup-ov" id="detailPopup" onclick="closePopup(event)">
  <div class="popup-card" id="popupCard">
    <div class="popup-handle"></div>
    <div class="popup-cover-row">
      <div class="popup-cover" id="popupCover">?</div>
      <div class="popup-meta">
        <div class="popup-title" id="popupTitle">—</div>
        <div class="popup-author" id="popupAuthor">—</div>
        <div class="popup-badges" id="popupBadges"></div>
        <div class="popup-clap" id="popupClap">👏 0</div>
      </div>
    </div>
    <div class="popup-synopsis" id="popupSynopsis"></div>
    <div class="popup-actions">
      <button class="popup-btn-read" id="popupReadBtn" onclick="goRead()">📖 ဖတ်မည်</button>
      <button class="popup-btn-clap" id="popupClapBtn" onclick="doPopupClap()">👏</button>
    </div>
  </div>
</div>

<footer><span class="footer-text">© 2026 CinePodma. All rights reserved.</span></footer>
<div class="toast" id="toast"></div>

<script>
var curTab='podmates', pmFilter='all', adminFilter='all', searchQ='';
var pmDocs=[], currentUser=null, myClaps={};
var activeDoc=null;

var genreLabels={
  novel:'ဝတ္ထု',short:'ဝတ္ထုတို',essay:'ဆောင်းပါး',poem:'ကဗျာ',
  feature:'ဇာတ်ညွှန်း',shortfilm:'ဇာတ်ညွှန်းတို',series:'စီးရီး'
};
var genreFilters={
  feature:['feature'],shortfilm:['shortfilm'],series:['series'],
  novel:['novel'],short:['short'],poem:['poem'],essay:['essay'],
  screenplay:['feature','shortfilm','series'],
  story:['novel','short','poem','essay']
};

var adminDocs=[
  {id:'ad1',cat:'mm',type:'screenplay',title:'နမူနာဇာတ်ညွှန်း',author:'Admin',genreLabel:'ဇာတ်ညွှန်း',clapCount:0,synopsis:''},
  {id:'ad2',cat:'int',type:'screenplay',title:'Parasite',author:'Bong Joon-ho',genreLabel:'ဇာတ်ညွှန်း',clapCount:0,synopsis:''},
  {id:'ad3',cat:'int',type:'screenplay',title:'Pulp Fiction',author:'Quentin Tarantino',genreLabel:'ဇာတ်ညွှန်း',clapCount:0,synopsis:''},
];

function toast(m){var t=document.getElementById('toast');t.textContent=m;t.classList.add('on');setTimeout(function(){t.classList.remove('on');},2500);}
function esc(s){return(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

function getGenreLabel(d){
  return d.genreLabel||genreLabels[d.genre]||(d.type==='story'?'ဝတ္ထု':'ဇာတ်ညွှန်း');
}

/* HTML tags ဖြုတ်ပြီး plain text ထုတ်သည့် helper */
function stripHtml(html){
  if(!html) return '';
  var tmp=document.createElement('div');
  tmp.innerHTML=html;
  return tmp.textContent||tmp.innerText||'';
}

/* ── BUILD CARD ── */
function buildCard(doc){
  var div=document.createElement('div');
  div.className='lib-card';
  div.onclick=function(){ openPopup(doc); };

  var poster=document.createElement('div');poster.className='lib-poster';
  if(doc.coverUrl){
    var img=document.createElement('img');img.src=doc.coverUrl;img.alt=doc.title;
    poster.appendChild(img);
  } else {
    var letter=document.createElement('div');letter.className='lib-poster-letter';
    letter.textContent=(doc.title||'?').charAt(0);
    poster.appendChild(letter);
  }
  var badge=document.createElement('div');badge.className='lib-badge';
  badge.textContent=getGenreLabel(doc);
  poster.appendChild(badge);
  var clap=document.createElement('button');
  clap.className='card-clap'+(myClaps[doc.id]?' clapped':'');
  clap.innerHTML='👏 '+(doc.clapCount||0);
  clap.onclick=function(e){e.stopPropagation();toggleClap(doc,clap,null);};
  poster.appendChild(clap);

  var body=document.createElement('div');body.className='lib-body';
  var title=document.createElement('div');title.className='lib-title';title.textContent=doc.title||'Untitled';
  var author=document.createElement('div');author.className='lib-author';
  author.textContent=doc.authorUsername||doc.author||'—';
  body.appendChild(title);body.appendChild(author);
  div.appendChild(poster);div.appendChild(body);
  return div;
}

/* ── POPUP ── */
function openPopup(doc){
  activeDoc=doc;
  var cv=document.getElementById('popupCover');
  if(doc.coverUrl){cv.innerHTML='<img src="'+esc(doc.coverUrl)+'" alt="">';}
  else{cv.textContent=(doc.title||'?').charAt(0);}
  document.getElementById('popupTitle').textContent=doc.title||'Untitled';
  document.getElementById('popupAuthor').textContent=(doc.authorName||doc.author||'—')+(doc.authorUsername?' · '+doc.authorUsername:'');
  document.getElementById('popupBadges').innerHTML=
    '<span class="popup-badge">'+getGenreLabel(doc)+'</span>'+
    (doc.updatedAt?'<span class="popup-badge">'+doc.updatedAt.substring(0,10)+'</span>':'');
  document.getElementById('popupClap').textContent='👏 '+(doc.clapCount||0);

  /* ✅ FIX: HTML tags ဖြုတ်ပြီး plain text ပဲ ပြသည် */
  var rawSynopsis=doc.synopsis||doc.logline||'';
  document.getElementById('popupSynopsis').textContent=stripHtml(rawSynopsis);

  var cb=document.getElementById('popupClapBtn');
  cb.className='popup-btn-clap'+(myClaps[doc.id]?' clapped':'');
  cb.textContent=myClaps[doc.id]?'❤️':'👏';
  document.getElementById('detailPopup').classList.add('on');
  document.body.style.overflow='hidden';
}
function closePopup(e){
  if(e&&e.target!==document.getElementById('detailPopup')) return;
  document.getElementById('detailPopup').classList.remove('on');
  document.body.style.overflow='';
  activeDoc=null;
}
window.closePopupBtn=function(){
  document.getElementById('detailPopup').classList.remove('on');
  document.body.style.overflow='';
  activeDoc=null;
};
window.goRead=function(){
  if(activeDoc) window.location.href='/read?id='+activeDoc.id;
};
window.doPopupClap=async function(){
  if(!activeDoc) return;
  await toggleClap(activeDoc, null, document.getElementById('popupClapBtn'));
  document.getElementById('popupClap').textContent='👏 '+(activeDoc.clapCount||0);
};

/* ── CLAP ── */
async function toggleClap(doc,cardBtn,popupBtn){
  if(!currentUser){toast('👏 Clap လုပ်ရန် Login ဝင်ပါ');return;}
  var docId=doc.id;
  try{
    var cRef=window._getRef('docClaps/'+docId+'/users/'+currentUser.uid);
    var gRef=window._getRef('clapping/'+currentUser.uid+'/users/'+docId);
    var snap=await window._getDoc2(cRef);
    if(snap.exists()){
      await window._deleteDoc(cRef);
      try{await window._deleteDoc(gRef);}catch(e){}
      var s=await window._getDoc2(window._getRef('docs/'+docId));
      var n=s.exists()?(s.data().clapCount||0):0;
      await window._updateDoc(window._getRef('docs/'+docId),{clapCount:Math.max(0,n-1)});
      doc.clapCount=Math.max(0,n-1);
      myClaps[docId]=false;
      if(cardBtn){cardBtn.className='card-clap';cardBtn.innerHTML='👏 '+doc.clapCount;}
      if(popupBtn){popupBtn.className='popup-btn-clap';popupBtn.textContent='👏';}
      toast('👏 Clap ဖြုတ်ပြီး');
    }else{
      var now=new Date().toISOString();
      await window._setDoc(cRef,{uid:currentUser.uid,clappedAt:now});
      await window._setDoc(gRef,{docId:docId,clappedAt:now});
      var s2=await window._getDoc2(window._getRef('docs/'+docId));
      var n2=s2.exists()?(s2.data().clapCount||0):0;
      await window._updateDoc(window._getRef('docs/'+docId),{clapCount:n2+1});
      doc.clapCount=n2+1;
      myClaps[docId]=true;
      if(cardBtn){cardBtn.className='card-clap clapped';cardBtn.innerHTML='👏 '+doc.clapCount;}
      if(popupBtn){popupBtn.className='popup-btn-clap clapped';popupBtn.textContent='❤️';}
      toast('👏 Clap လုပ်ပြီး');
    }
  }catch(e){toast('❌ '+e.message);}
}

/* ── RENDER ── */
function renderGrid(docs){
  var grid=document.getElementById('libGrid');
  document.getElementById('resultCount').textContent=docs.length+' ခု';
  if(!docs.length){grid.innerHTML='<div class="state-msg">ရှာမတွေ့ပါ</div>';return;}
  grid.innerHTML='';
  docs.forEach(function(d){grid.appendChild(buildCard(d));});
}

/* ── FILTER/SORT ── */
function applyPm(){
  var docs=pmDocs.slice();
  if(pmFilter!=='all'){
    var allowed=genreFilters[pmFilter]||[pmFilter];
    docs=docs.filter(function(d){return allowed.indexOf(d.genre)>-1||allowed.indexOf(d.type)>-1;});
  }
  if(searchQ){
    docs=docs.filter(function(d){
      return (d.title||'').toLowerCase().includes(searchQ)||
             (d.authorUsername||d.authorName||'').toLowerCase().includes(searchQ);
    });
  }
  docs.sort(function(a,b){return (b.clapCount||0)-(a.clapCount||0);});
  renderGrid(docs);
}

function applyAdmin(){
  var docs=adminDocs.slice();
  if(adminFilter!=='all') docs=docs.filter(function(d){return d.cat===adminFilter;});
  if(searchQ) docs=docs.filter(function(d){return (d.title||'').toLowerCase().includes(searchQ);});
  docs.sort(function(a,b){return (b.clapCount||0)-(a.clapCount||0);});
  renderGrid(docs);
}

function refresh(){if(curTab==='podmates')applyPm();else applyAdmin();}

/* ── CONTROLS ── */
function setTab(tab,btn){
  curTab=tab;
  document.querySelectorAll('.lib-tab').forEach(function(b){b.classList.remove('active');});
  btn.classList.add('active');
  document.getElementById('pmFilters').style.display=tab==='podmates'?'':'none';
  document.getElementById('adminFilters').style.display=tab==='admin'?'':'none';
  document.getElementById('libSub').textContent=tab==='podmates'
    ?'CinePodma တွင် ရေးသားထားသော ဝတ္ထုနှင့် ဇာတ်ညွှန်းများ'
    :'မြန်မာ့ရုပ်ရှင်အပါအဝင် နိုင်ငံတကာရုပ်ရှင်များ၏ ဇာတ်ညွှန်းများ';
  refresh();
}
function setPmFilter(f,btn){
  pmFilter=f;
  document.querySelectorAll('#pmFilters .filter-btn').forEach(function(b){b.classList.remove('active');});
  btn.classList.add('active');applyPm();
}
function setAdminFilter(f,btn){
  adminFilter=f;
  document.querySelectorAll('#adminFilters .filter-btn').forEach(function(b){b.classList.remove('active');});
  btn.classList.add('active');applyAdmin();
}
function onSearch(q){searchQ=q.toLowerCase().trim();refresh();}

document.addEventListener('keydown',function(e){
  if(e.key==='Escape') closePopupBtn();
});
</script>

onAuthStateChanged(auth,async function(user){
  currentUser=user;
  var navR=document.getElementById('navR');
  if(user){
    try{
      var us=await getDoc(doc(db,'users',user.uid));
      var av=us.exists()&&us.data().avatar?'<img src="'+us.data().avatar+'" alt="">':'👤';
      navR.innerHTML='<a class="nav-user-av" href="/profile">'+av+'</a>'+
        '<a class="nav-btn red" href="/write">✍ ရေးမည်</a>';
    }catch(e){}
  }
});

async function loadDocs(){
  try{
    var q=query(collection(db,'docs'),where('privacy','==','public'),limit(100));
    var snap=await getDocs(q);
    pmDocs=[];
    var uids=new Set();
    snap.forEach(function(d){
      var data=d.data();
      pmDocs.push({id:d.id,title:data.title||'Untitled',type:data.type||'screenplay',
        genre:data.genre||'',genreLabel:data.genreLabel||'',
        authorName:data.authorName||'',authorUsername:data.authorUsername||'',
        coverUrl:data.coverUrl||'',clapCount:data.clapCount||0,
        updatedAt:data.updatedAt||'',uid:data.uid||'',
        synopsis:data.synopsis||data.logline||data.story||''});
      if(data.uid) uids.add(data.uid);
    });
    if(currentUser){
      for(var i=0;i<Math.min(pmDocs.length,50);i++){
        try{
          var cs=await getDoc(doc(db,'docClaps',pmDocs[i].id,'users',currentUser.uid));
          if(cs.exists()) myClaps[pmDocs[i].id]=true;
        }catch(e){}
      }
    }
    document.getElementById('libSub').textContent=
      'CinePodma တွင် ရေးသားထားသော ဝတ္ထုနှင့် ဇာတ်ညွှန်းများ ('+pmDocs.length+' ခု)';
    applyPm();
  }catch(e){
    document.getElementById('libGrid').innerHTML=
      '<div class="state-msg">ဖွင့်မရပါ — '+e.message+'</div>';
    console.error('loadDocs',e);
  }
}
loadDocs();
</script>
